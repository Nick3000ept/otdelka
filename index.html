   строки с заполненной ставкой). Бэкенд отдаёт агрегат одним запросом
   action=tuzio: словари статей и ФИО + три разреза (статья×месяц,
   статья×месяц×человек, статья×месяц×табель). Накопление считается здесь. */

// Статей 52 — столько цветов неразличимы, поэтому цветом показываем топ-12
// по сумме за всё время, остальные собираем в серую группу «Прочие».
const TZ_TOP = 12;
const TZ_COLORS = ['#0072B2', '#E69F00', '#009E73', '#D55E00', '#CC79A7', '#56B4E9',
                   '#7C4DFF', '#8C6D31', '#1B7837', '#C2185B', '#00868B', '#A6761D'];
const TZ_REST = '#9AA5B1';
// В раскрытой статье табелей могут быть сотни — показываем первые, о срезе пишем.
const TZ_DOCS_LIMIT = 300;
const TZ_MON_NAMES = ['янв', 'фев', 'мар', 'апр', 'май', 'июн',
                      'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

const tzMonthLabel = m =>
  (TZ_MON_NAMES[parseInt(m.slice(5), 10) - 1] || m.slice(5)) + ' ' + m.slice(2, 4);
const tzInt = v => fmtInt(Math.round(v || 0));
const tzMln = v => (Math.abs(v) >= 1e6 ? tzInt(v / 1e6) + ' млн' : tzInt(v));

// «Статья есть в бюджете отделки» — тот же признак, которым фильтруется
// «Аналитика» (список AN_ITEMS + паркинг/лобби по префиксу). Решение
// пользователя 31.08.2026: так цифры двух вкладок сопоставимы. Из 52 статей
// ТУЗИО в него попадают 20 (54,3 млн из 226,6); остальные идут отдельным
// блоком «Справочно» — они оплачены с почасовиков, но к бюджету отделки
// отношения не имеют.
const tzInBudget = name => anMatch(name);

// Отделка / общестрой — разметка ПО СМЫСЛУ РАБОТ, независимо от бюджета
// (решение пользователя 31.08.2026). Отделка: слово «отделка» в названии,
// МОП-статьи (СБ3/СБ5/Паркинг), сдельщики и содержание бригад собственных сил
// (Джамал, Овчинников, Элшод, Смирнов) — 29 статей, 55,7 млн. Общестрой —
// всё остальное: монолит, бетон, опалубка, арматура, котлован, фасады, кровля,
// гидроизоляция, тепловой контур, благоустройство, лифты, мусор, «Содержание
// площадки», «Стены и перегородки», «СБ3 - Работы» — 23 статьи, 170,9 млн.
// Новая статья появится — проверить, куда её относит правило.
const TZ_FIN_CREWS = ['джамал', 'овчинников', 'элшод', 'смирнов'];
const tzIsFinish = name => {
  const k = anNorm(name);
  if (k.indexOf('отделк') >= 0) return true;
  if (k.indexOf('- моп -') >= 0) return true;
  if (k.indexOf('сделк') >= 0) return true;
  return TZ_FIN_CREWS.some(n => k.indexOf('содержание ' + n) >= 0);
};

async function loadTuzio() {
  state.tuzioStatus = 'loading';
  try {
    const url = GAS_URL + '?action=tuzio&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.tuzio = json.tuzio || null;
    state.tuzioStatus = 'ready';
  } catch (e) {
    state.tuzioStatus = 'error';
  }
  if (state.screen === 'tuzio') renderTuzio();
}

function renderTuzio() {
  const el = document.getElementById('tuzio-screen');
  if (state.tuzioStatus === 'idle') loadTuzio();
  const head = '<div class="check-head">ТУЗИО — оплата почасовщикам</div>' +
    '<div class="check-desc">Начислено рабочим, которым платят за час работы ' +
    '(ежедневный табель, строки с заполненной ставкой). Столбик — накопительный ' +
    'итог с начала года, цвет — статья бюджета. Клик по месяцу — расшифровка ниже.</div>';
  if (state.tuzioStatus !== 'ready') {
    el.innerHTML = head + '<div class="side-note">' +
      (state.tuzioStatus === 'error'
        ? 'Не удалось загрузить данные. Обновите страницу.'
        : 'Данные считаются по листу «ТУЗИО_часы» — на холодном кэше это может занять до полуминуты…') +
      '</div>';
    return;
  }
  const t = state.tuzio || {};
  const months = t.months || [];
  if (!months.length) {
    el.innerHTML = head + '<div class="side-note">Данных нет — лист «ТУЗИО_часы» пуст. ' +
      'Он заливается скриптом «Приложения/tuzio_import.py» из экселя «Часы 2026».</div>';
    return;
  }

  // Суммы по каждой статье за всё время — основа и для фильтров, и для топ-12.
  const itemAll = new Map();
  (t.ma || []).forEach(r => itemAll.set(r[0], (itemAll.get(r[0]) || 0) + r[3]));

  // ---- Фильтры: вид работ + мультивыбор статей (31.08.2026) ----
  const kind = state.tzKind || '';
  const kindOk = ii => !kind || (kind === 'fin') === tzIsFinish(t.items[ii]);
  const itemOk = ii => kindOk(ii) && (!state.tzSel.size || state.tzSel.has(ii));

  const kindBtns = [['', 'Все работы'], ['fin', 'Отделка'], ['gen', 'Общестрой']]
    .map(k => '<button data-tzkind="' + k[0] + '"' + (kind === k[0] ? ' class="on"' : '') +
      '>' + k[1] + '</button>').join('');
  // Список статей в фильтре подчиняется виду работ — фильтры складываются.
  const pickable = [...itemAll.entries()].filter(e => kindOk(e[0]))
    .sort((a, b) => b[1] - a[1]);
  const picked = pickable.filter(e => state.tzSel.has(e[0])).length;
  const ddList = state.tzSelOpen
    ? '<div class="tz-dd-list"><div class="tz-dd-act">' +
      '<button data-tzsel="all">Выбрать все</button>' +
      '<button data-tzsel="none">Снять все</button></div>' +
      pickable.map(e => {
        const on = state.tzSel.has(e[0]);
        return '<div class="tz-opt' + (on ? ' on' : '') + '" data-tzitemchk="' + e[0] + '">' +
          '<span class="tz-box">' + (on ? '&#10003;' : '') + '</span>' +
          escapeHtml(t.items[e[0]]) + '<i>' + tzMln(e[1]) + '</i></div>';
      }).join('') + '</div>'
    : '';
  const filters = '<div class="tz-filters">' + kindBtns +
    '<div class="tz-dd"><div class="tz-dd-head" data-tzdd="1">' +
    (picked ? 'Статьи: выбрано ' + picked + ' из ' + pickable.length
            : 'Статьи: все (' + pickable.length + ')') +
    ' &#9662;</div>' + ddList + '</div>' +
    (kind || state.tzSel.size
      ? '<button data-tzreset="1">Сбросить фильтры</button>' : '') +
    '</div>';

  // ---- Группировка статей для диаграммы: топ-12 + «Прочие» ----
  const ranked = [...itemAll.entries()].filter(e => itemOk(e[0]))
    .sort((a, b) => b[1] - a[1]);
  if (!ranked.length) {
    el.innerHTML = head + filters +
      '<div class="side-note">Под фильтры не попала ни одна статья — снимите часть условий.</div>';
    return;
  }
  const grpOf = new Map();
  ranked.forEach((pair, n) => grpOf.set(pair[0], n < TZ_TOP ? n : TZ_TOP));
  const grpNames = ranked.slice(0, TZ_TOP).map(pair => t.items[pair[0]]);
  const restCount = Math.max(0, ranked.length - TZ_TOP);
  if (restCount) grpNames.push('Прочие статьи (' + restCount + ')');
  const G = grpNames.length;
  const grpColor = g => (g < TZ_TOP ? TZ_COLORS[g % TZ_COLORS.length] : TZ_REST);

  // Суммы группа × месяц -> накопительный итог по каждой группе.
  const byMonth = grpNames.map(() => months.map(() => 0));
  (t.ma || []).forEach(r => {
    if (!itemOk(r[0])) return;
    byMonth[grpOf.get(r[0])][r[1]] += r[3];
  });
  const cumG = byMonth.map(row => { let acc = 0; return row.map(v => (acc += v)); });
  const totals = months.map((_, i) => cumG.reduce((sum, row) => sum + row[i], 0));

  let mSel = months.indexOf(state.tzMonth);
  if (mSel < 0) mSel = months.length - 1;

  // Геометрия — как на «Аналитике» (просьба 31.08.2026: тот же вид диаграммы):
  // накопительные заливки по статьям снизу вверх, сверху линия общего итога
  // с точками по месяцам. Вписывается в ширину экрана, при resize перерисовка.
  const padL = 96, padR = 28, padT = 16, padB = 56, H = 420;
  const availW = Math.max(480, (el.clientWidth || 900) - 44);
  const stepX = Math.max(28, (availW - padL - padR) / Math.max(1, months.length - 1));
  const W = Math.round(padL + padR + stepX * Math.max(1, months.length - 1));
  const maxV = Math.max(1, totals[totals.length - 1]) * 1.06;
  const px = i => padL + i * stepX;
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);

  // Горизонтальная сетка с «круглым» шагом — как на «Аналитике».
  const rawStep = maxV / 5;
  const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const niceStep = [1, 2, 2.5, 5, 10].map(k => k * pow).find(v => v >= rawStep);
  let grid = '';
  for (let v = 0; v <= maxV; v += niceStep) {
    grid += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) +
      '" stroke="#e3e8ef"/>' +
      '<text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" ' +
      'fill="#667">' + tzMln(v) + '</text>';
  }

  // Клик по легенде подсвечивает статью: её заливка ярче, остальные гаснут.
  const hl = state.tzHl;
  const bandOp = g => (hl == null ? 0.85 : (hl === g ? 0.95 : 0.1));

  // Подсветка выбранного месяца — вертикальная полоса под заливками.
  let bars = '<rect x="' + (px(mSel) - stepX / 2) + '" y="' + padT + '" width="' + stepX +
    '" height="' + (H - padT - padB) + '" fill="#eef3fb"/>';

  // Заливки-полигоны: каждая статья лежит на предыдущей, верхняя граница
  // последней совпадает с линией общего итога.
  const base = months.map(() => 0);
  for (let g = 0; g < G; g++) {
    const upper = base.map((v, i) => v + cumG[g][i]);
    if (upper.every((v, i) => v === base[i])) { continue; }
    const top = upper.map((v, i) => px(i) + ',' + y(v)).join(' ');
    const bottom = base.map((v, i) => px(i) + ',' + y(v)).reverse().join(' ');
    bars += '<polygon points="' + top + ' ' + bottom + '" fill="' + grpColor(g) +
      '" opacity="' + bandOp(g) + '" stroke="#fff" stroke-width="0.5">' +
      '<title>' + escapeHtml(grpNames[g]) + ': ' + tzInt(cumG[g][months.length - 1]) +
      ' руб. накопительно за весь период</title></polygon>';
    for (let i = 0; i < months.length; i++) base[i] = upper[i];
  }

  // Линия общего итога с точками — точки и подписи месяцев кликабельны.
  bars += '<polyline fill="none" stroke="#b42121" stroke-width="2.5" points="' +
    totals.map((v, i) => px(i) + ',' + y(v)).join(' ') + '"/>';
  for (let i = 0; i < months.length; i++) {
    bars += '<circle data-tzm="' + i + '" cx="' + px(i) + '" cy="' + y(totals[i]) +
      '" r="' + (i === mSel ? 6 : 4) + '" fill="#b42121" stroke="#fff" stroke-width="1.5" ' +
      'style="cursor:pointer"><title>' + tzMonthLabel(months[i]) + ': ' + tzInt(totals[i]) +
      ' руб. накопительно</title></circle>' +
      // прозрачный кружок побольше — чтобы в точку было легче попасть мышью
      '<circle data-tzm="' + i + '" cx="' + px(i) + '" cy="' + y(totals[i]) +
      '" r="13" fill="#fff" opacity="0" pointer-events="all" style="cursor:pointer"/>' +
      '<text class="tz-mlabel" data-tzm="' + i + '" x="' + px(i) + '" y="' + (H - padB + 20) +
      '" text-anchor="middle" font-size="12" fill="' + (i === mSel ? '#1a2940' : '#667') +
      '" font-weight="' + (i === mSel ? 700 : 400) + '">' + tzMonthLabel(months[i]) + '</text>' +
      '<text class="tz-mlabel" data-tzm="' + i + '" x="' + px(i) + '" y="' + (H - padB + 36) +
      '" text-anchor="middle" font-size="11" fill="#8894a8">' + tzMln(totals[i]) + '</text>';
  }

  const legend = '<div class="tz-legend">' + grpNames.map((name, g) =>
    '<span data-tzg="' + g + '"' + (hl != null && hl !== g ? ' class="off"' : '') + '>' +
    '<i class="tz-dot" style="background:' + grpColor(g) + '"></i>' + escapeHtml(name) +
    ' — ' + tzMln(cumG[g][months.length - 1]) + '</span>').join('') + '</div>';

  const chart = '<div class="tz-chart"><svg width="' + W + '" height="' + H +
    '" viewBox="0 0 ' + W + ' ' + H + '">' + grid + bars + '</svg></div>';

  // ---- Расшифровка выбранного месяца ----
  const cumMode = state.tzCum !== false;
  const inRange = mi => (cumMode ? mi <= mSel : mi === mSel);
  const period = cumMode
    ? (mSel === 0 ? tzMonthLabel(months[0])
                  : 'накопительно ' + tzMonthLabel(months[0]) + ' — ' + tzMonthLabel(months[mSel]))
    : 'только ' + tzMonthLabel(months[mSel]);

  const rows = new Map();   // индекс статьи -> {h, s, docs:Set, ppl:Set}
  const get = ii => {
    let r = rows.get(ii);
    if (!r) { r = { h: 0, s: 0, docs: new Set(), ppl: new Set() }; rows.set(ii, r); }
    return r;
  };
  (t.ma || []).forEach(r => {
    if (!itemOk(r[0]) || !inRange(r[1])) return;
    const o = get(r[0]); o.h += r[2]; o.s += r[3];
  });
  (t.mp || []).forEach(r => { if (itemOk(r[0]) && inRange(r[1])) get(r[0]).ppl.add(r[2]); });
  (t.md || []).forEach(r => { if (itemOk(r[0]) && inRange(r[1])) get(r[0]).docs.add(r[2]); });
  const list = [...rows.entries()].sort((a, b) => b[1].s - a[1].s);
  const sumAll = list.reduce((acc, r) => acc + r[1].s, 0);
  const hoursAll = list.reduce((acc, r) => acc + r[1].h, 0);

  // Деление на статьи бюджета отделки и справочные (31.08.2026).
  const inBud = list.filter(e => tzInBudget(t.items[e[0]]));
  const outBud = list.filter(e => !tzInBudget(t.items[e[0]]));
  const sumOf = arr => arr.reduce((acc, r) => acc + r[1].s, 0);

  const modes = '<div class="tz-modes">' +
    '<span class="tz-title">' + escapeHtml(tzMonthLabel(months[mSel])) + ': ' +
    tzInt(sumAll) + ' руб. · ' + tzInt(hoursAll) + ' ч</span>' +
    '<button data-tzcum="1"' + (cumMode ? ' class="on"' : '') + '>накопительно</button>' +
    '<button data-tzcum="0"' + (!cumMode ? ' class="on"' : '') + '>только этот месяц</button>' +
    '<span class="check-desc" style="margin:0">' + escapeHtml(period) + '</span></div>';

  // Порядок блоков (31.08.2026, просьба пользователя): сразу под диаграммой —
  // расшифровка выбранного месяца, и только потом сводная «статьи × месяцы»,
  // а в самом низу справочный блок СБ5 (он внутри tzPivot).
  el.innerHTML = head + filters + legend + chart + modes +
    tzBlock(t, 'Статьи бюджета отделки', inBud, sumAll, inRange,
      'Те же статьи, по которым считается вкладка «Аналитика».') +
    tzBlock(t, 'Справочно — нет в бюджете отделки', outBud, sumAll, inRange,
      'Оплачено тем же почасовщикам, но к бюджету отделки не относится.') +
    tzPivot(t, months, itemOk, mSel);
}

/* Статья второй очереди: названия начинаются с «СБ5 - …». Такие статьи
   с 31.08.2026 показываются ОТДЕЛЬНОЙ таблицей под основной (просьба
   пользователя) — в остальном ведут себя так же. */
const tzIsSb5 = name => anNorm(name).indexOf('сб5') === 0;

/* Сводная «статьи × месяцы» (31.08.2026): в ячейках часы ЗА МЕСЯЦ, не
   накопительно — таблица показывает сразу весь год. Подчиняется тем же
   фильтрам, что диаграмма. Клик по месяцу в шапке выбирает его для
   расшифровки ниже, выбранный столбец подсвечен. Деление на «бюджет
   отделки / справочно» здесь не дублируем таблицами — статьи вне бюджета
   помечены «спр.» прямо в строке.

   Раскрытие (31.08.2026, просьба пользователя):
     статья -> «Без бригады» -> сотрудники -> подневная разбивка.
   Уровень бригады назван честно: колонка «Бригада» в исходном экселе пуста
   во всех месяцах, восстанавливать её по составу табелей пользователь
   не захотел («если нет бригады — пиши без бригады»), поэтому это одна
   строка-заглушка, а не выдуманная группировка. Подневные часы берём
   из action=tuzioPerson (тот же запрос, что у карточки сотрудника),
   ответы складываем в state.tzPersonCache. */
function tzPivot(t, months, itemOk, mSel) {
  const cells = new Map();          // статья -> часы по месяцам
  (t.ma || []).forEach(r => {
    if (!itemOk(r[0])) return;
    let a = cells.get(r[0]);
    if (!a) { a = months.map(() => 0); cells.set(r[0], a); }
    a[r[1]] += r[2];
  });
  if (!cells.size) return '';
  // Сотрудники внутри статьи: часы по месяцам.
  const emp = new Map();            // статья -> Map(человек -> часы по месяцам)
  (t.mp || []).forEach(r => {
    if (!itemOk(r[0])) return;
    let byP = emp.get(r[0]);
    if (!byP) { byP = new Map(); emp.set(r[0], byP); }
    let a = byP.get(r[2]);
    if (!a) { a = months.map(() => 0); byP.set(r[2], a); }
    a[r[1]] += r[3];
  });

  const rows = [...cells.entries()]
    .map(e => [e[0], e[1], e[1].reduce((x, v) => x + v, 0)])
    .sort((a, b) => b[2] - a[2]);
  const sb5 = rows.filter(r => tzIsSb5(t.items[r[0]]));
  const main = rows.filter(r => !tzIsSb5(t.items[r[0]]));
  const hours = list => list.reduce((acc, r) => acc + r[2], 0);

  // Статьи СБ5 — отдельным справочным блоком внизу, по умолчанию свёрнутым
  // (просьба 31.08.2026): это вторая очередь, к бюджету отделки СБ3 отношения
  // не имеет и в основной таблице только мешает.
  const sb5Block = sb5.length
    ? '<div class="tz-block tz-ref"><div class="tz-block-head clickable" data-tzsb5="1">' +
      '<span class="chev">' + (state.tzSb5Open ? '&#9662;' : '&#9656;') + '</span> ' +
      'Справочно: статьи СБ5 — ' + sb5.length + ' статей, ' + tzInt(hours(sb5)) + ' ч</div>' +
      '<div class="tz-block-sub">Вторая очередь, в бюджет отделки СБ3 не входит. ' +
      (state.tzSb5Open ? 'Клик по заголовку свернёт таблицу.'
                       : 'Клик по заголовку покажет таблицу.') + '</div>' +
      (state.tzSb5Open ? tzPivotTable(t, months, mSel, sb5, emp, '', '', true) : '') +
      '</div>'
    : '';

  return tzPivotTable(t, months, mSel, main, emp,
      'Сводная: часы по статьям и месяцам',
      'В ячейках — часы за месяц, не накопительно. «спр.» — статьи нет в бюджете ' +
      'отделки. Клик по строке статьи раскрывает её до сотрудников, клик по часам ' +
      'сотрудника — разбивку по дням. Клик по месяцу в шапке выбирает его для ' +
      'расшифровки ниже.' +
      (sb5.length ? ' Статьи СБ5 — справочным блоком внизу (' + sb5.length +
        ' статей, ' + tzInt(hours(sb5)) + ' ч).' : '')) + sb5Block;
}

/* Одна таблица сводной: строки-статьи с раскрытием до сотрудников и дней. */
function tzPivotTable(t, months, mSel, rows, emp, title, note, bare) {
  if (!rows.length) return '';
  const colSum = months.map((_, i) => rows.reduce((acc, r) => acc + r[1][i], 0));
  const allSum = rows.reduce((acc, r) => acc + r[2], 0);
  const selCls = i => (i === mSel ? ' tzpiv-sel' : '');
  const cols = months.length + 2;

  const thead = '<tr><th>Статья бюджета</th>' +
    months.map((m, i) => '<th class="num' + selCls(i) + '" data-tzm="' + i +
      '" title="Показать расшифровку: ' + tzMonthLabel(m) + '">' +
      tzMonthLabel(m) + '</th>').join('') +
    '<th class="num">Итого</th></tr>';

  const numCells = (arr, tot) =>
    arr.map((v, i) => '<td class="num' + selCls(i) + '">' + (v ? tzInt(v) : '') + '</td>').join('') +
    '<td class="num"><b>' + tzInt(tot) + '</b></td>';

  let body = '';
  rows.forEach(r => {
    const ii = r[0];
    const open = state.tzPivOpen.has(ii);
    body += '<tr class="tzpiv-item' + (open ? ' open' : '') + '" data-tzpivitem="' + ii + '">' +
      '<td><span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span> ' +
      escapeHtml(t.items[ii]) +
      (tzInBudget(t.items[ii]) ? ''
        : '<span class="tzpiv-ref" title="Статьи нет в бюджете отделки">спр.</span>') +
      '</td>' + numCells(r[1], r[2]) + '</tr>';
    if (!open) return;

    const byP = emp.get(ii) || new Map();
    const brOpen = !state.tzPivBrClosed.has(ii);
    body += '<tr class="tzpiv-br" data-tzpivbr="' + ii + '">' +
      '<td><span class="chev">' + (brOpen ? '&#9662;' : '&#9656;') + '</span> ' +
      'Без бригады <span class="tzpiv-ref">' + byP.size + ' чел. · в файле бригада не заполнена' +
      '</span></td>' + numCells(r[1], r[2]) + '</tr>';
    if (!brOpen) return;

    [...byP.entries()]
      .map(e => [e[0], e[1], e[1].reduce((x, v) => x + v, 0)])
      .sort((a, b) => b[2] - a[2])
      .forEach(pr => {
        const pi = pr[0];
        body += '<tr class="tzpiv-emp"><td data-tzpi="' + pi +
          '" title="Открыть карточку сотрудника">' + escapeHtml(t.people[pi]) + '</td>' +
          pr[1].map((v, i) => {
            if (!v) return '<td class="num' + selCls(i) + '"></td>';
            const key = ii + '|' + pi + '|' + i;
            const on = state.tzPivDay === key;
            return '<td class="num tzpiv-cell' + selCls(i) + (on ? ' open' : '') +
              '" data-tzday="' + key + '" title="Показать по дням">' + tzInt(v) + '</td>';
          }).join('') +
          '<td class="num"><b>' + tzInt(pr[2]) + '</b></td></tr>';
        const openKey = state.tzPivDay;
        if (openKey && openKey.indexOf(ii + '|' + pi + '|') === 0) {
          body += tzPivDaysRow(t, ii, pi, parseInt(openKey.split('|')[2], 10), months, cols);
        }
      });
  });

  const tot = '<tr class="tzpiv-tot"><td>Итого</td>' +
    colSum.map((v, i) => '<td class="num' + selCls(i) + '">' + tzInt(v) + '</td>').join('') +
    '<td class="num">' + tzInt(allSum) + '</td></tr>';

  const table = '<div class="tz-pivot-wrap"><table class="check tzpiv"><thead>' + thead +
    '</thead><tbody>' + body + tot + '</tbody></table></div>';
  // bare — вернуть только таблицу: у справочного блока СБ5 своя шапка с раскрытием.
  if (bare) return table;
  return '<div class="tz-block"><div class="tz-block-head">' + escapeHtml(title) + '</div>' +
    '<div class="tz-block-sub">' + rows.length + ' статей · ' + tzInt(allSum) + ' ч за ' +
    months.length + ' месяцев. ' + note + '</div>' + table + '</div>';
}

/* Подневная разбивка одной ячейки «сотрудник × месяц» внутри статьи.
   Дни берём из ответа action=tuzioPerson (в нём все строки сотрудника
   за все месяцы) и фильтруем по статье и месяцу. */
function tzPivDaysRow(t, ii, pi, mi, months, cols) {
  const fio = t.people[pi];
  const mon = months[mi];
  const cell = txt => '<tr class="tzpiv-days"><td colspan="' + cols + '">' + txt + '</td></tr>';
  const p = state.tzPersonCache.get(fio);
  if (!p) return cell('<div class="side-note">Загружаем дни сотрудника… ' +
    'первый запрос по человеку может занять до полуминуты.</div>');
  if (p === 'error') return cell('<div class="side-note">Не удалось загрузить дни сотрудника.</div>');
  const item = t.items[ii];
  const days = (p.rows || [])
    .filter(r => r[0] === mon && ((r[3] || '(без статьи)') === item))
    .sort((a, b) => a[1] - b[1]);
  if (!days.length) return cell('<div class="side-note">Строк за этот месяц по этой статье нет.</div>');
  const sumH = days.reduce((a, r) => a + r[4], 0);
  const sumS = days.reduce((a, r) => a + r[5], 0);
  return cell('<div class="tzpiv-days-head">' + escapeHtml(fio) + ' · ' +
    escapeHtml(item) + ' · ' + tzMonthLabel(mon) + ' — ' + days.length + ' дней, ' +
    tzInt(sumH) + ' ч, ' + tzInt(sumS) + ' руб.</div>' +
    '<table class="tzpiv-days-tab"><thead><tr><th>Дата</th><th>Табель №</th>' +
    '<th>Часы</th><th>Сумма, руб.</th></tr></thead><tbody>' +
    days.map(r => '<tr><td>' + ('0' + r[1]).slice(-2) + '.' + mon.slice(5) +
      '</td><td>' + escapeHtml(r[2] || '—') + '</td><td>' + tzInt(r[4]) +
      '</td><td>' + tzInt(r[5]) + '</td></tr>').join('') +
    '</tbody></table>');
}

/* Один блок таблицы статей (31.08.2026): заголовок с итогами + таблица.
   Доля считается от общего итога периода, чтобы блоки были сопоставимы. */
function tzBlock(t, title, entries, sumAll, inRange, note) {
  const s = entries.reduce((acc, r) => acc + r[1].s, 0);
  const h = entries.reduce((acc, r) => acc + r[1].h, 0);
  const sub = entries.length
    ? entries.length + ' статей · ' + tzInt(s) + ' руб. · ' + tzInt(h) + ' ч · ' +
      (sumAll ? (s / sumAll * 100).toFixed(1) : '0.0') + '% от всех начислений'
    : 'Ни одной статьи';
  const body = entries.length
    ? '<table class="check tztab"><thead><tr>' +
      '<th>Статья бюджета</th><th class="num">Часы</th><th class="num">Сумма, руб.</th>' +
      '<th class="num">Табелей</th><th class="num">Людей</th><th class="num">Доля</th>' +
      '</tr></thead><tbody>' +
      entries.map(entry => {
        const ii = entry[0], r = entry[1];
        const open = state.tzOpen.has(ii);
        const tr = '<tr class="tzrow' + (open ? ' open' : '') + '" data-tzitem="' + ii + '">' +
          '<td><span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span> ' +
          escapeHtml(t.items[ii]) + '</td>' +
          '<td class="num">' + tzInt(r.h) + '</td>' +
          '<td class="num">' + tzInt(r.s) + '</td>' +
          '<td class="num">' + r.docs.size + '</td>' +
          '<td class="num">' + r.ppl.size + '</td>' +
          '<td class="num">' + (sumAll ? (r.s / sumAll * 100).toFixed(1) : '0.0') + '%</td></tr>';
        return open ? tr + tzDetailRow(t, ii, inRange) : tr;
      }).join('') +
      '<tr><td><b>Итого</b></td><td class="num"><b>' + tzInt(h) + '</b></td>' +
      '<td class="num"><b>' + tzInt(s) + '</b></td><td class="num"></td>' +
      '<td class="num"></td><td class="num"></td></tr>' +
      '</tbody></table>'
    : '';
  return '<div class="tz-block"><div class="tz-block-head">' + escapeHtml(title) + '</div>' +
    '<div class="tz-block-sub">' + sub + (note ? ' · ' + escapeHtml(note) : '') + '</div>' +
    body + '</div>';
}

/* Раскрытая статья: сначала состав по людям, затем по табелям (табель здесь
   вместо бригады: колонка «Бригада» в экселе пустая во всех месяцах). */
function tzDetailRow(t, ii, inRange) {
  const ppl = new Map();
  (t.mp || []).forEach(r => {
    if (r[0] !== ii || !inRange(r[1])) return;
    const o = ppl.get(r[2]) || { h: 0, s: 0, n: 0 };
    o.h += r[3]; o.s += r[4]; o.n += 1;
    ppl.set(r[2], o);
  });
  const docs = [];
  (t.md || []).forEach(r => { if (r[0] === ii && inRange(r[1])) docs.push(r); });
  docs.sort((a, b) => (b[1] - a[1]) || (b[3] - a[3]));

  const pplRows = [...ppl.entries()].sort((a, b) => b[1].h - a[1].h).map(e =>
    '<tr class="tzp" data-tzpi="' + e[0] + '" title="Открыть карточку: табели и бригада">' +
    '<td>' + escapeHtml(t.people[e[0]]) + '</td>' +
    '<td class="num">' + tzInt(e[1].h) + '</td>' +
    '<td class="num">' + tzInt(e[1].s) + '</td>' +
    '<td class="num">' + e[1].n + '</td></tr>').join('');

  const shown = docs.slice(0, TZ_DOCS_LIMIT);
  const docRows = shown.map(r =>
    '<tr><td>' + escapeHtml(r[2] || '—') + '</td>' +
    '<td class="num">' + (r[3] ? ('0' + r[3]).slice(-2) + '.' + t.months[r[1]].slice(5) : '—') + '</td>' +
    '<td class="num">' + tzInt(r[4]) + '</td>' +
    '<td class="num">' + tzInt(r[5]) + '</td>' +
    '<td class="num">' + r[6] + '</td></tr>').join('');
  const cut = docs.length > shown.length
    ? '<div class="check-desc">Показаны первые ' + shown.length + ' табелей из ' +
      docs.length + ' — свежие сверху.</div>'
    : '';

  return '<tr class="tzdetail"><td colspan="6">' +
    '<div class="tz-subhead">Сотрудники (' + ppl.size + ') — часы накопительно за период; ' +
    'клик по строке открывает табели и бригаду</div>' +
    '<table class="check inner"><thead><tr><th>ФИО</th><th class="num">Часы</th>' +
    '<th class="num">Сумма, руб.</th><th class="num">Месяцев</th></tr></thead><tbody>' +
    pplRows + '</tbody></table>' +
    '<div class="tz-subhead">Табели (' + docs.length + ') — вместо бригад, ' +
    'бригада в исходном файле не заполнена</div>' + cut +
    '<table class="check inner"><thead><tr><th>Табель №</th><th class="num">Дата</th>' +
    '<th class="num">Часы</th><th class="num">Сумма, руб.</th><th class="num">Людей</th>' +
    '</tr></thead><tbody>' + docRows + '</tbody></table></td></tr>';
}

/* Карточка сотрудника (31.08.2026): в какие табели он попадает и с кем работает.
   Бригады в исходном экселе нет — колонка «Бригада» пуста во всех месяцах.
   Но в один ежедневный табель за день записывается одна бригада: человек за
   день встречается ровно в одном табеле (в августе 2 исключения на 6129 пар),
   в табеле в среднем 11 человек, около 21 табеля в день. Поэтому бригада —
   это люди, с которыми сотрудник чаще всего оказывается в одном табеле;
   у постоянного состава совпадение 80–95%, дальше идёт резкий спад.
   Данные — action=tuzioPerson (свой кэш на каждого, холодный ответ ~10-20 сек). */
// Ответ по сотруднику нужен и карточке, и подневной разбивке в сводной —
// держим его в state.tzPersonCache, чтобы не дёргать бэк повторно.
async function tzLoadPerson(fio) {
  const cached = state.tzPersonCache.get(fio);
  if (cached && cached !== 'error') return cached;
  try {
    const url = GAS_URL + '?action=tuzioPerson&p=' + encodeURIComponent(fio) +
      '&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    const person = json.person || { rows: [] };
    state.tzPersonCache.set(fio, person);
    return person;
  } catch (e) {
    state.tzPersonCache.set(fio, 'error');
    throw e;
  }
}

async function openTuzioPerson(fio) {
  state.tzpFio = fio;
  state.tzpOpenItem = null;
  state.tzpAllDocs = false;
  document.getElementById('modal-title').textContent = 'Сотрудник';
  document.getElementById('modal-sub').textContent = fio;
  document.getElementById('modal-body').innerHTML =
    '<div class="side-note">Собираем табели сотрудника… ' +
    'на холодном кэше это занимает до полуминуты.</div>';
  document.getElementById('modal-overlay').style.display = 'flex';
  try {
    await tzLoadPerson(fio);
    tzRenderPerson();
  } catch (e) {
    document.getElementById('modal-body').innerHTML =
      '<div class="side-note">Не удалось загрузить карточку: ' + escapeHtml(e.message) + '</div>';
  }
}

// Перерисовка открытой карточки: нужна при раскрытии статьи и общего списка.
function tzRenderPerson() {
  const p = state.tzPersonCache.get(state.tzpFio);
  if (!p || p === 'error') return;
  document.getElementById('modal-body').innerHTML = tzPersonHtml(p);
}

// Клики внутри карточки сотрудника (31.08.2026): статья раскрывает свои табели,
// заголовок «Табели сотрудника» — общий список.
document.getElementById('modal-body').addEventListener('click', e => {
  const itemEl = e.target.closest('[data-tzpitem]');
  if (itemEl) {
    const n = parseInt(itemEl.dataset.tzpitem, 10);
    state.tzpOpenItem = state.tzpOpenItem === n ? null : n;
    tzRenderPerson();
    return;
  }
  if (e.target.closest('[data-tzpall]')) {
    state.tzpAllDocs = !state.tzpAllDocs;
    tzRenderPerson();
  }
});

function tzPersonHtml(p) {
  const rows = p.rows || [];
  if (!rows.length) {
    return '<div class="tzp-card"><div class="side-note">По этому сотруднику строк нет — ' +
      'возможно, он есть только в табеле СКУД, который на вкладке не учитывается.</div></div>';
  }
  const months = [...new Set(rows.map(r => r[0]))].sort();
  const docs = p.docs || 0;

  // Итоги по месяцам: часы, сумма и число табелей.
  const byM = new Map();
  const seenDoc = new Set();
  rows.forEach(r => {
    const o = byM.get(r[0]) || { h: 0, s: 0, d: new Set() };
    o.h += r[4]; o.s += r[5]; o.d.add(r[2]);
    byM.set(r[0], o);
  });
  rows.forEach(r => seenDoc.add(r[0] + '|' + r[2]));

  const sum = '<div class="tzp-sum">Всего <b>' + tzInt(p.hours) + ' ч</b> и <b>' +
    tzInt(p.sum) + ' руб.</b> в <b>' + docs + '</b> табелях · ' +
    tzMonthLabel(months[0]) + ' — ' + tzMonthLabel(months[months.length - 1]) +
    '</div><div class="tzp-note">Карточка показывает данные за весь период, ' +
    'независимо от выбранного на диаграмме месяца.</div>';

  const monthTab = '<table class="check tzp-tab"><thead><tr><th>Месяц</th>' +
    '<th class="num">Табелей</th><th class="num">Часы</th><th class="num">Сумма, руб.</th>' +
    '</tr></thead><tbody>' +
    months.map(m => {
      const o = byM.get(m);
      return '<tr><td>' + tzMonthLabel(m) + '</td><td class="num">' + o.d.size +
        '</td><td class="num">' + tzInt(o.h) + '</td><td class="num">' + tzInt(o.s) +
        '</td></tr>';
    }).join('') + '</tbody></table>';

  // Блок «Бригада — с кем работает» убран с экрана 31.08.2026 (просьба
  // пользователя). Бэкенд напарников по-прежнему считает и отдаёт в `mates`
  // (см. buildTuzioPerson_) — понадобится вернуть, хватит вывода здесь.

  // Табели: свежие сверху (общий порядок для всех списков в карточке).
  const sorted = rows.slice().sort((a, b) => (b[0] < a[0] ? -1 : b[0] > a[0] ? 1 : 0) || (b[1] - a[1]));

  // Свод по статьям бюджета (31.08.2026): по сотне строк табелей не видно,
  // на чём человек работал. Клик по статье раскрывает под ней её табели
  // (просьба 31.08.2026) — общий список ниже нужен уже редко, поэтому свёрнут.
  const byItem = new Map();
  rows.forEach(r => {
    const key = r[3] || '(без статьи)';
    const o = byItem.get(key) || { h: 0, s: 0, d: new Set() };
    o.h += r[4]; o.s += r[5]; o.d.add(r[0] + '|' + r[2]);
    byItem.set(key, o);
  });
  const items = [...byItem.entries()].sort((a, b) => b[1].h - a[1].h);
  const docsTable = list =>
    '<table class="check tzp-tab tzp-docs"><thead><tr><th class="num">Дата</th>' +
    '<th class="num">Табель №</th><th>Статья бюджета</th><th class="num">Часы</th>' +
    '<th class="num">Сумма, руб.</th></tr></thead><tbody>' +
    list.map(r => '<tr><td class="num">' + ('0' + r[1]).slice(-2) + '.' + r[0].slice(5) +
      '</td><td class="num">' + escapeHtml(r[2] || '—') + '</td><td>' +
      escapeHtml(r[3] || '(без статьи)') + '</td><td class="num">' + tzInt(r[4]) +
      '</td><td class="num">' + tzInt(r[5]) + '</td></tr>').join('') +
    '</tbody></table>';

  const itemTab = '<div class="tzp-head">По статьям бюджета (' + items.length +
    ') — клик по статье покажет её табели</div>' +
    '<table class="check tzp-tab"><thead><tr><th>Статья бюджета</th>' +
    '<th class="num">Табелей</th><th class="num">Часы</th><th class="num">Сумма, руб.</th>' +
    '</tr></thead><tbody>' +
    items.map((e, n) => {
      const open = state.tzpOpenItem === n;
      const tr = '<tr class="tzp-item' + (open ? ' open' : '') + '" data-tzpitem="' + n + '">' +
        '<td><span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span> ' +
        escapeHtml(e[0]) + '</td><td class="num">' + e[1].d.size +
        '</td><td class="num">' + tzInt(e[1].h) + '</td><td class="num">' + tzInt(e[1].s) +
        '</td></tr>';
      if (!open) return tr;
      const mine = sorted.filter(r => (r[3] || '(без статьи)') === e[0]);
      return tr + '<tr class="tzp-docs"><td colspan="4"><div class="tzp-scroll">' +
        docsTable(mine) + '</div></td></tr>';
    }).join('') +
    '</tbody></table>';

  const allDocs = '<div class="tzp-head clickable" data-tzpall="1"><span class="chev">' +
    (state.tzpAllDocs ? '&#9662;' : '&#9656;') + '</span> Все табели сотрудника (' +
    seenDoc.size + ')</div>' +
    (state.tzpAllDocs ? '<div class="tzp-scroll">' + docsTable(sorted) + '</div>' : '');

  return '<div class="tzp-card">' + sum + monthTab + itemTab + allDocs + '</div>';
}

// Статьи, доступные к выбору при текущем фильтре вида работ — нужны кнопке
// «Выбрать все» в списке статей.
function tzPickable() {
  const t = state.tuzio || {};
  const out = new Set();
  (t.ma || []).forEach(r => {
    if (!state.tzKind || (state.tzKind === 'fin') === tzIsFinish(t.items[r[0]])) out.add(r[0]);
  });
  return out;
}

// Клики на вкладке «ТУЗИО»: фильтры (вид работ, список статей), выбор месяца,
// подсветка статьи в легенде, переключатель периода и раскрытие статьи.
document.getElementById('tuzio-screen').addEventListener('click', e => {
  // Клик мимо выпадающего списка статей — закрыть его (перерисовка ниже).
  let redraw = false;
  if (state.tzSelOpen && !e.target.closest('.tz-dd')) { state.tzSelOpen = false; redraw = true; }

  const ddEl = e.target.closest('[data-tzdd]');
  if (ddEl) {
    state.tzSelOpen = !state.tzSelOpen;
    renderTuzio();
    return;
  }
  const chkEl = e.target.closest('[data-tzitemchk]');
  if (chkEl) {
    const ii = parseInt(chkEl.dataset.tzitemchk, 10);
    if (state.tzSel.has(ii)) state.tzSel.delete(ii);
    else state.tzSel.add(ii);
    state.tzHl = null;          // подсветка легенды считалась по прежнему набору
    renderTuzio();
    return;
  }
  const selEl = e.target.closest('[data-tzsel]');
  if (selEl) {
    state.tzSel = selEl.dataset.tzsel === 'all' ? tzPickable() : new Set();
    state.tzHl = null;
    renderTuzio();
    return;
  }
  const kindEl = e.target.closest('[data-tzkind]');
  if (kindEl) {
    state.tzKind = kindEl.dataset.tzkind;
    // Выбор статей сбрасываем: иначе после смены вида работ таблица могла бы
    // оказаться пустой — выбранные статьи в новый вид просто не входят.
    state.tzSel = new Set();
    state.tzHl = null;
    state.tzSelOpen = false;
    renderTuzio();
    return;
  }
  if (e.target.closest('[data-tzreset]')) {
    state.tzKind = '';
    state.tzSel = new Set();
    state.tzHl = null;
    state.tzSelOpen = false;
    renderTuzio();
    return;
  }
  const mEl = e.target.closest('[data-tzm]');
  if (mEl) {
    const mm = (state.tuzio || {}).months || [];
    state.tzMonth = mm[parseInt(mEl.dataset.tzm, 10)] || null;
    renderTuzio();
    return;
  }
  const gEl = e.target.closest('[data-tzg]');
  if (gEl) {
    const g = parseInt(gEl.dataset.tzg, 10);
    state.tzHl = state.tzHl === g ? null : g;
    renderTuzio();
    return;
  }
  const cEl = e.target.closest('[data-tzcum]');
  if (cEl) {
    state.tzCum = cEl.dataset.tzcum === '1';
    renderTuzio();
    return;
  }
  // Сводная: клик по часам сотрудника раскрывает его дни за этот месяц.
  const dayEl = e.target.closest('[data-tzday]');
  if (dayEl) {
    const key = dayEl.dataset.tzday;
    state.tzPivDay = state.tzPivDay === key ? null : key;
    if (state.tzPivDay) {
      const fio = ((state.tuzio || {}).people || [])[parseInt(key.split('|')[1], 10)];
      // После неудачной попытки в кэше лежит 'error' — снимаем, чтобы повторный
      // клик снова сходил на бэк.
      if (state.tzPersonCache.get(fio) === 'error') state.tzPersonCache.delete(fio);
      if (fio && !state.tzPersonCache.has(fio)) {
        tzLoadPerson(fio)
          .catch(() => {})
          .then(() => { if (state.screen === 'tuzio') renderTuzio(); });
      }
    }
    renderTuzio();
    return;
  }
  if (e.target.closest('[data-tzsb5]')) {
    state.tzSb5Open = !state.tzSb5Open;
    renderTuzio();
    return;
  }
  const brEl = e.target.closest('[data-tzpivbr]');
  if (brEl) {
    const ii = parseInt(brEl.dataset.tzpivbr, 10);
    if (state.tzPivBrClosed.has(ii)) state.tzPivBrClosed.delete(ii);
    else state.tzPivBrClosed.add(ii);
    renderTuzio();
    return;
  }
  const itemEl = e.target.closest('[data-tzpivitem]');
  if (itemEl) {
    const ii = parseInt(itemEl.dataset.tzpivitem, 10);
    if (state.tzPivOpen.has(ii)) state.tzPivOpen.delete(ii);
    else state.tzPivOpen.add(ii);
    renderTuzio();
    return;
  }
  const pEl = e.target.closest('[data-tzpi]');
  if (pEl) {
    const people = (state.tuzio || {}).people || [];
    const fio = people[parseInt(pEl.dataset.tzpi, 10)];
    if (fio) openTuzioPerson(fio);
    if (redraw) renderTuzio();
    return;
  }
  const tr = e.target.closest('tr.tzrow');
  if (tr) {
    const ii = parseInt(tr.dataset.tzitem, 10);
    if (state.tzOpen.has(ii)) state.tzOpen.delete(ii);
    else state.tzOpen.add(ii);
    renderTuzio();
    return;
  }
  if (redraw) renderTuzio();
});

// График «Аналитики» подстраивается под ширину окна — при resize перерисовать.
window.addEventListener('resize', () => {
  if (state.screen === 'analytics' && state.analyticsStatus === 'ready') renderAnalytics();
  if (state.screen === 'tuzio' && state.tuzioStatus === 'ready') renderTuzio();
});

// Липкая шапка бюджета в два ряда: второму ряду нужен отступ сверху на высоту
// первого, иначе при прокрутке ряды наезжают друг на друга. Высота первого ряда
// зависит от масштаба текста (А−/А+), поэтому меряем её после отрисовки
// (по ячейке «Модель» — она единственная в один ряд высотой) и пересчитываем
// при смене масштаба (вызов из applyZoom).
function alignBudgetHead() {
  const el = document.getElementById('budget-screen');
  const model = el && el.querySelector('table.budget thead th.modelhead');
  if (!model) return;
  const h = model.getBoundingClientRect().height;
  el.querySelectorAll('table.budget thead tr.sub th').forEach(th => {
    th.style.top = (h - 14) + 'px';   // базовый top у th: -14px (см. CSS table.check th)
  });
}

/**
 * Сводная для работ «Собственных сил (Шамов)» (просьба 24.08.2026): корпусов
 * в расчёте нет — по клику показываем строки МОЛов: чел.-часы (кол-во людей x
 * часов в месяц, суммой за все месяцы, приходит в cell[9]), средняя ставка
 * ₽/час (cell[10]) и стоимость. Фильтр по подрядчикам действует.
 */
function budgetSSHtml(w) {
  const fSel = budgetSelSet();
  const fActive = fSel.size > 0;
  const cells = (w[2] || []).filter(c => !fActive || fSel.has(String(c[0])));
  if (!cells.length) {
    return '<div class="side-note">По выбранным подрядчикам данных нет</div>';
  }
  const rows = cells.slice().sort((a, b) => (b[2] || 0) - (a[2] || 0));
  // Строка = позиция (полное название с корпусами, cell[13]) x МОЛ; Месяцев
  // (cell[11]) и среднее людей в месяц (cell[12]) — просьбы 24.08.2026.
  const hasPos = cells.some(c => c.length > 13 && String(c[13] || '') !== '');
  let hoursT = 0, costT = 0, pplT = 0;
  let h = '<table class="inner"><thead><tr>' +
    (hasPos ? '<th>Позиция</th>' : '') + '<th>МОЛ</th>' +
    '<th class="num">Месяцев</th><th class="num">Ср. людей</th>' +
    '<th class="num">Чел.-часы</th><th class="num">Ставка, ₽/час</th>' +
    '<th class="num">Стоимость, ₽</th></tr></thead><tbody>';
  rows.forEach(c => {
    const name = String(c[0]) === '— без подрядчика —' ? 'Не определен' : String(c[0]);
    hoursT += c[9] || 0;
    costT += c[2] || 0;
    pplT += c[12] || 0;
    h += '<tr>' + (hasPos ? '<td>' + escapeHtml(String(c[13] || '')) + '</td>' : '') +
      '<td>' + escapeHtml(name) + '</td>' +
      '<td class="num">' + (c[11] ? escapeHtml(fmtInt(c[11])) : '') + '</td>' +
      '<td class="num">' + (c[12] ? escapeHtml(fmtCell(c[12])) : '') + '</td>' +
      '<td class="num">' + (c[9] ? escapeHtml(fmtInt(c[9])) : '') + '</td>' +
      '<td class="num">' + (c[10] ? escapeHtml(fmtCell(c[10])) : '') + '</td>' +
      '<td class="num">' + escapeHtml(fmtInt(c[2] || 0)) + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td>Итого</td>' + (hasPos ? '<td></td>' : '') +
    '<td class="num"></td>' +
    '<td class="num">' + (pplT ? escapeHtml(fmtCell(Math.round(pplT * 10) / 10)) : '') + '</td>' +
    '<td class="num">' + (hoursT ? escapeHtml(fmtInt(hoursT)) : '') + '</td>' +
    '<td class="num"></td>' +
    '<td class="num">' + escapeHtml(fmtInt(costT)) + '</td></tr></tfoot></table>';
  return h;
}

/**
 * Сводная по работе из бюджета (просьба 05.08.2026): строки — подрядчики
 * (с расценками за ед. работы и материалов из сводки floors), столбцы — корпуса,
 * в ячейках — «Стоимость материалы + работа для бюджета» (кол. AG поэтажки).
 * Показывается выпадающим блоком под строкой работы (просьба 05.08.2026).
 */
function budgetWorkHtml(w) {
  const name = String(w[0]);

  // Расценки за единицу — из сводки floors: [подрядчик, корпус, раб/ед, СС, мат/ед].
  // Подрядчик с разными расценками разбивается на ОТДЕЛЬНЫЕ строки — по строке
  // на каждую комбинацию «раб/ед + мат/ед», суммы стоят в корпусах с этой расценкой
  // (просьба пользователя 05.08.2026: важно видеть, на каком корпусе какая расценка).
  const fl = (state.floors && state.floors[norm(name)]) || [];
  const rateByCorp = new Map();   // подрядчик|корпус -> [раб/ед, мат/ед, признак СС]
  fl.forEach(r => rateByCorp.set(r[0] + '|' + r[1], [r[2] || 0, r[4] || 0, r[3] ? 1 : 0]));

  // Фильтр по подрядчикам с экрана «Бюджет» действует и здесь (12.08.2026),
  // включая галочку «Собственные силы» (18.08.2026).
  const fSel = budgetSelSet();
  const fActive = fSel.size > 0;

  // С 18.08.2026 в каждой ячейке две суммы: работы (кол. AE, приходит в cell[5])
  // и материалы (итог AG минус работы). Старый кэш без cell[5] — показываем
  // одной суммой, как раньше (hasSplit).
  const hasSplit = (w[2] || []).some(cell => cell.length > 5);
  const contrTotal = new Map();   // подрядчик -> сумма (для порядка строк)
  const rowsMap = new Map();      // подрядчик|раб|мат|СС -> строка сводной
  (w[2] || []).forEach(cell => {
    if (fActive && !fSel.has(String(cell[0]))) return;
    const p = cell[0], c = cell[1], v = cell[2], vw = cell[5] || 0;
    contrTotal.set(p, (contrTotal.get(p) || 0) + v);
    const rk = rateByCorp.get(p + '|' + c) || [0, 0, 0];
    const key = p + '|' + rk[0] + '|' + rk[1] + '|' + rk[2];
    if (!rowsMap.has(key)) {
      rowsMap.set(key, { contr: p, src: p, rw: rk[0], rm: rk[1], ss: rk[2],
        corps: {}, corpsW: {}, total: 0, totalW: 0 });
    }
    const o = rowsMap.get(key);
    o.corps[c] = (o.corps[c] || 0) + v;
    o.corpsW[c] = (o.corpsW[c] || 0) + vw;
    o.total += v;
    o.totalW += vw;
  });
  if (!rowsMap.size) {
    return '<div class="side-note">Разбивки по подрядчикам для этой работы нет</div>';
  }
  // Подрядчики — по убыванию их общей суммы; строки одного подрядчика рядом,
  // внутри — по убыванию суммы строки. Имя пишем только в первой его строке.
  // Два блока (просьба 05.08.2026): обычные подрядчики и «Собственные силы»
  // (признак СС — по строкам поэтажки, как в сводной на «Расценках»).
  let list = Array.from(rowsMap.values()).sort((a, b) =>
    (contrTotal.get(b.contr) - contrTotal.get(a.contr)) ||
    a.contr.localeCompare(b.contr, 'ru') ||
    (b.total - a.total));

  // Строки поэтажки без подрядчика — одной строкой «Не определен» в самом верху,
  // с базовыми стоимостями работы и материалов из справочника «Работы» (05.08.2026).
  const UNDEF = '— без подрядчика —';
  const workRow = state.works.find(r => norm(r[WORK_KEY]) === norm(name));
  const baseW = workRow && typeof workRow[BASE_RATE_COL] === 'number' ? workRow[BASE_RATE_COL] : 0;
  const baseM = workRow && typeof workRow[BASE_MAT_COL] === 'number' ? workRow[BASE_MAT_COL] : 0;
  let undef = null;
  list = list.filter(o => {
    if (o.contr !== UNDEF) return true;
    if (!undef) {
      undef = { contr: 'Не определен', src: UNDEF, rw: baseW, rm: baseM, ss: 0,
        corps: {}, corpsW: {}, total: 0, totalW: 0 };
    }
    Object.keys(o.corps).forEach(c => {
      undef.corps[c] = (undef.corps[c] || 0) + o.corps[c];
      undef.corpsW[c] = (undef.corpsW[c] || 0) + (o.corpsW[c] || 0);
    });
    undef.total += o.total;
    undef.totalW += o.totalW;
    return false;
  });
  // Справа — сумматор «Итого» по строке (просьба 05.08.2026). Объём и коэффициент
  // переделки показываются на уровне строки работы, не здесь (просьба 05.08.2026).
  const head = '<tr><th>Название</th><th class="num">Раб., руб/ед</th>' +
    '<th class="num">Мат., руб/ед</th>' +
    ALL_CORPS.map(c => '<th class="num">' + escapeHtml(c) + '</th>').join('') +
    '<th class="num">Итого</th></tr>';
  // Ячейки с суммами кликабельны: расшифровка по этажам (просьба 05.08.2026).
  // Раздельные суммы (просьба 18.08.2026): сверху — работы, снизу приглушённо —
  // материалы; подсказка при наведении расшифровывает.
  const splitHtml = (v, vw) => hasSplit
    ? '<div>' + escapeHtml(fmtInt(vw)) + '</div><div class="bmat">' +
      escapeHtml(fmtInt(v - vw)) + '</div>'
    : escapeHtml(fmtInt(v));
  const splitTitle = (v, vw) => hasSplit
    ? ' title="' + escapeHtml('Работы ' + fmtInt(vw) + ' · материалы ' +
      fmtInt(v - vw) + ' · итого ' + fmtInt(v)) + '"'
    : '';
  const rowHtml = (o, nameCell) =>
    '<tr><td>' + nameCell + '</td>' +
    '<td class="num">' + (o.rw ? escapeHtml(fmtInt(o.rw)) : '') + '</td>' +
    '<td class="num">' + (o.rm ? escapeHtml(fmtInt(o.rm)) : '') + '</td>' +
    ALL_CORPS.map(c => {
      const v = o.corps[c];
      if (!v) return '<td class="num"></td>';
      return '<td class="num bcell" data-contr="' + escapeHtml(o.src) +
        '" data-corp="' + escapeHtml(c) + '"' + splitTitle(v, o.corpsW[c] || 0) + '>' +
        splitHtml(v, o.corpsW[c] || 0) + '</td>';
    }).join('') +
    '<td class="num gsum"' + (o.total ? splitTitle(o.total, o.totalW) : '') + '>' +
    (o.total ? splitHtml(o.total, o.totalW) : '') + '</td></tr>';

  // Сумматоры «Итого <подрядчик>» убраны по просьбе пользователя 05.08.2026 —
  // остались только колонка «Итого» справа и общий «Итого» внизу.
  const renderRows = rows => {
    let html = '';
    for (let i = 0; i < rows.length; i++) {
      const o = rows[i];
      const first = i === 0 || rows[i - 1].contr !== o.contr;
      html += rowHtml(o, first ? escapeHtml(o.contr) : '');
    }
    return html;
  };
  const sect = t =>
    '<tr class="sect"><td colspan="' + (ALL_CORPS.length + 4) + '">' + t + '</td></tr>';
  const reg = list.filter(o => !o.ss);
  const own = list.filter(o => o.ss);
  let body = '';
  if (undef) body += renderRows([undef]);
  if (reg.length) body += sect('Подрядчики') + renderRows(reg);
  if (own.length) body += sect('Собственные силы') + renderRows(own);

  // Сумматор по корпусам (просьба 05.08.2026) — по всем строкам, включая «Не определен».
  const totals = {}, totalsW = {};
  let grand = 0, grandW = 0;
  (undef ? [undef] : []).concat(reg, own).forEach(o => {
    grand += o.total;
    grandW += o.totalW;
    ALL_CORPS.forEach(c => {
      if (o.corps[c]) {
        totals[c] = (totals[c] || 0) + o.corps[c];
        totalsW[c] = (totalsW[c] || 0) + (o.corpsW[c] || 0);
      }
    });
  });
  const foot = '<tr class="total"><td>Итого</td><td class="num"></td><td class="num"></td>' +
    ALL_CORPS.map(c =>
      '<td class="num"' + (totals[c] ? splitTitle(totals[c], totalsW[c] || 0) : '') + '>' +
      (totals[c] ? splitHtml(totals[c], totalsW[c] || 0) : '') + '</td>'
    ).join('') +
    '<td class="num"' + (grand ? splitTitle(grand, grandW) : '') + '>' +
    (grand ? splitHtml(grand, grandW) : '') + '</td></tr>';
  // Заголовка и названия работы у блока нет (просьба 05.08.2026); легенда раздельных
  // сумм — одной строкой под таблицей (18.08.2026).
  const legend = hasSplit
    ? '<div class="side-sub" style="margin-top:4px">в ячейках: сверху — работы, ' +
      'снизу — материалы, руб</div>'
    : '';
  return '<div class="bdetail-wrap"><table class="inner mini"><thead>' + head +
    '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table>' +
    legend + '</div>';
}

/**
 * Расшифровка ячейки бюджета (просьба 05.08.2026): клик по сумме «подрядчик × корпус»
 * -> модальное окно с этажами: этаж, объём, расценки за работу и материалы, стоимость.
 * Данные (action=budgetFloors) грузятся при первом клике и живут в памяти страницы.
 */
async function loadBudgetFloors() {
  state.budgetFloorsStatus = 'loading';
  try {
    const url = GAS_URL + '?action=budgetFloors&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.budgetFloors = json.bfloors || {};
    state.budgetFloorsStatus = 'ready';
  } catch (e) {
    state.budgetFloorsStatus = 'error';
  }
}

async function openBudgetCellModal(bi, wi, contr, corp) {
  const item = state.budget && state.budget[bi];
  const w = item && (item[2] || [])[wi];
  if (!w) return;
  const name = String(w[0]);
  const shownContr = contr === '— без подрядчика —' ? 'Не определен' : contr;
  document.getElementById('modal-title').textContent = shownContr + ' · ' + corp;
  document.getElementById('modal-sub').textContent = name;
  const bodyEl = document.getElementById('modal-body');
  document.getElementById('modal-overlay').style.display = 'flex';
  if (!state.budgetFloors) {
    bodyEl.innerHTML = '<div class="side-note">Расшифровка по этажам загружается… ' +
      'первый раз это может занять до полуминуты</div>';
    await loadBudgetFloors();
    if (!state.budgetFloors) {
      bodyEl.innerHTML = '<div class="side-note">Не удалось загрузить расшифровку. ' +
        'Закройте окно и попробуйте ещё раз.</div>';
      return;
    }
  }
  const entry = (state.budgetFloors[norm(name)] || {})[contr + '|' + corp];
  if (!entry) {
    bodyEl.innerHTML = '<div class="side-note">Строк поэтажки для этой ячейки не нашлось</div>';
    return;
  }
  const rw = entry.r[0], rm = entry.r[1];
  const head = '<tr><th class="num">Этаж</th><th class="num">Объем</th>' +
    '<th class="num">Раб., руб/ед</th><th class="num">Мат., руб/ед</th>' +
    '<th class="num">Стоимость, руб</th></tr>';
  let tvol = 0, tcost = 0;
  const body = entry.f.map(f => {
    tvol += f[1];
    tcost += f[2];
    return '<tr><td class="num">' + escapeHtml(fmtCell(f[0])) + '</td>' +
      '<td class="num">' + escapeHtml(fmtVol(f[1])) + '</td>' +
      '<td class="num">' + (rw ? escapeHtml(fmtInt(rw)) : '') + '</td>' +
      '<td class="num">' + (rm ? escapeHtml(fmtInt(rm)) : '') + '</td>' +
      '<td class="num">' + escapeHtml(fmtInt(f[2])) + '</td></tr>';
  }).join('');
  const foot = '<tr class="total"><td>Итого</td>' +
    '<td class="num">' + escapeHtml(fmtVol(tvol)) + '</td><td></td><td></td>' +
    '<td class="num">' + escapeHtml(fmtInt(tcost)) + '</td></tr>';
  bodyEl.innerHTML = '<table class="inner mini"><thead>' + head + '</thead><tbody>' +
    body + '</tbody><tfoot>' + foot + '</tfoot></table>';
}

// Обработчики собственных полей фильтра бюджета (bsearch/bss-check/bfilter)
// удалены 26.08.2026 вместе с блоком — фильтры бюджета управляются из шапки.

// Клик по статье бюджета — раскрыть/свернуть работы; по группе работ — её работы;
// по работе — выпадающая сводная; по сумме в сводной — расшифровка по этажам.
document.getElementById('budget-screen').addEventListener('click', e => {
  const bc = e.target.closest('td.bcell');
  if (bc) {
    const det = e.target.closest('tr.bdetail');
    if (det) openBudgetCellModal(+det.dataset.bi, +det.dataset.wi,
      bc.dataset.contr, bc.dataset.corp);
    return;
  }
  const bs = e.target.closest('tr.bsub');
  if (bs) {
    // Подгруппа-поверхность паркинга (25.08.2026) — проверять ДО bgrp:
    // у строки оба класса.
    const key = bs.dataset.bi + '|' + bs.dataset.grp + '|' + bs.dataset.sub;
    if (state.budgetSubOpen.has(key)) state.budgetSubOpen.delete(key);
    else state.budgetSubOpen.add(key);
    renderBudget();
    return;
  }
  const bg = e.target.closest('tr.bgrp');
  if (bg) {
    const key = bg.dataset.bi + '|' + bg.dataset.grp;
    if (state.budgetGrpOpen.has(key)) state.budgetGrpOpen.delete(key);
    else state.budgetGrpOpen.add(key);
    renderBudget();
    return;
  }
  const bw = e.target.closest('tr.bwork');
  if (bw) {
    if (bw.classList.contains('bflat')) return;   // работы паркинга не раскрываются
    // Можно держать открытыми несколько работ сразу (просьба 05.08.2026).
    const key = bw.dataset.bi + '|' + bw.dataset.wi;
    if (state.budgetWorkOpen.has(key)) state.budgetWorkOpen.delete(key);
    else state.budgetWorkOpen.add(key);
    renderBudget();
    return;
  }
  const bst = e.target.closest('tr.bsect');
  if (bst) {
    // Секция статей «Квартиры»/«МОП» (25.08.2026)
    const key = bst.dataset.sect;
    if (state.budgetSectOpen.has(key)) state.budgetSectOpen.delete(key);
    else state.budgetSectOpen.add(key);
    renderBudget();
    return;
  }
  const tr = e.target.closest('tr.brow');
  if (!tr) return;
  const item = tr.dataset.item;
  if (state.budgetOpen.has(item)) state.budgetOpen.delete(item);
  else state.budgetOpen.add(item);
  renderBudget();
});

// Поэтажная ведомость по корпусам — модальное окно (вкладка «Объемы»).
function openVolModal(key, name) {
  const work = state.works.find(r => norm(r[WORK_KEY]) === key);
  const unit = String((work && work[UNIT_COL]) || '').trim();
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-sub').textContent =
    'Поэтажная ведомость' + (unit ? ' · объёмы в ' + unit : '');
  const byCorp = (state.vols && state.vols[key]) || {};
  const corps = ALL_CORPS;
  let html;
  const floorSet = new Set();
  corps.forEach(c => (byCorp[c] || []).forEach(p => floorSet.add(p[0])));
  if (!floorSet.size) {
    html = '<div class="side-note">Объёмы по этой работе в «Поэтажка_работы» не найдены</div>';
  } else {
    const floors = Array.from(floorSet).sort((a, b) => a - b);
    const volByCorpFloor = {};
    corps.forEach(c => {
      volByCorpFloor[c] = new Map((byCorp[c] || []).map(p => [p[0], p[1]]));
    });
    const head = '<tr><th>Этаж</th>' +
      corps.map(c => '<th class="num">' + escapeHtml(c) + '</th>').join('') + '</tr>';
    const body = floors.map(fl =>
      '<tr><td>' + escapeHtml(fmtCell(fl)) + '</td>' +
      corps.map(c => {
        const v = volByCorpFloor[c].get(fl);
        return '<td class="num">' + (v ? escapeHtml(fmtVol(v)) : '') + '</td>';
      }).join('') + '</tr>'
    ).join('');
    const foot = '<tr class="total"><td>Итого</td>' +
      corps.map(c => {
        const t = (byCorp[c] || []).reduce((acc, p) => acc + p[1], 0);
        return '<td class="num">' + (t ? escapeHtml(fmtVol(t)) : '') + '</td>';
      }).join('') + '</tr>';
    html = '<table class="inner mini vol-table"><thead>' + head + '</thead><tbody>' + body +
      '</tbody><tfoot>' + foot + '</tfoot></table>';
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}

/**
 * Вкладка «Факт» (10.08.2026): отметка фактически выполненных работ поэтажно.
 * Отметка — процент готовности (кнопка ✓ = 100%) на ячейку корпус × этаж.
 * Хранение — журнал в листе «Факт» таблицы «Отделка ИИ» (строки только добавляются,
 * последняя отметка по ключу актуальна); справочно показывается факт из поэтажки
 * (V «Процент готовности», Z «Объем к закрытию») — в подсказках ячеек.
 * Сохранение: optimistic UI + очередь с паузой 1,2 с, пакетом одним POST, при
 * ошибке — откат значений и предупреждение (паттерн шахматки СБ3).
 */
async function loadFact() {
  state.factStatus = 'loading';
  try {
    const url = GAS_URL + '?action=fact&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.factMarks = new Map(Object.entries(json.marks || {}));
    state.factStatus = 'ready';
  } catch (e) {
    state.factStatus = 'error';
  }
  if (state.screen === 'fact') refreshFactScreen();
}

async function loadFactRef() {
  state.factRefStatus = 'loading';
  try {
    const url = GAS_URL + '?action=factRef&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.factRef = json.ref || {};
    state.factRefStatus = 'ready';
  } catch (e) {
    state.factRefStatus = 'error';
  }
  // Справка пришла — обновляем подсказки в открытой сетке (если пользователь не печатает).
  const overlayOpen = document.getElementById('modal-overlay').style.display !== 'none';
  const typing = document.activeElement && document.activeElement.classList &&
    document.activeElement.classList.contains('fpct');
  if (state.factRefStatus === 'ready' && overlayOpen && state.factModalKey &&
      state.screen === 'fact' && !typing) {
    openFactModal(state.factModalKey, state.factModalName);
  }
}

// Экран «Факт» готов, когда загружены объёмы поэтажки и отметки из журнала.
function refreshFactScreen() {
  if (state.volsStatus === 'error' || state.factStatus === 'error') {
    setStatus('Не удалось загрузить данные факта. Обновите страницу.', true);
    return;
  }
  if (state.volsStatus !== 'ready' || state.factStatus !== 'ready') {
    setStatus('Данные факта загружаются…');
    return;
  }
  setStatus('');
  if (state.works.length) renderTable();
}

// Готовность по корпусу для строки «Готовность» в сетке — текстом ('85%' или '').
function factFootTxt(workKey, corp) {
  const p = factPct(workKey, [corp]);
  return p ? fmtInt(p) + '%' : '';
}

// Сетка отметок: строки — этажи, столбцы — корпуса; в ячейке план-объём,
// поле процента и кнопка «готово».
function openFactModal(key, name) {
  state.factModalKey = key;
  state.factModalName = name;
  const work = state.works.find(r => norm(r[WORK_KEY]) === key);
  const unit = String((work && work[UNIT_COL]) || '').trim();
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-sub').textContent =
    'Отметка факта' + (unit ? ' · объёмы в ' + unit : '') +
    ' · процент готовности, ✓ — выполнено (100%)';
  const byCorp = (state.vols && state.vols[key]) || {};
  const corps = ALL_CORPS;
  const floorSet = new Set();
  corps.forEach(c => (byCorp[c] || []).forEach(p => floorSet.add(p[0])));
  let html;
  if (!floorSet.size) {
    html = '<div class="side-note">Объёмов по этой работе в «Поэтажка_работы» нет — ' +
      'отмечать факт не по чему</div>';
  } else {
    const floors = Array.from(floorSet).sort((a, b) => a - b);
    const volByCorpFloor = {};
    corps.forEach(c => {
      volByCorpFloor[c] = new Map((byCorp[c] || []).map(p => [p[0], p[1]]));
    });
    const ref = (state.factRefStatus === 'ready' && state.factRef && state.factRef[key]) || null;
    const refByCorpFloor = {};
    corps.forEach(c => {
      refByCorpFloor[c] = new Map(((ref && ref[c]) || []).map(p => [p[0], p]));
    });
    const head = '<tr><th>Этаж</th>' + corps.map(c =>
      '<th class="num">' + escapeHtml(c) +
      '<button class="fcorp-done" type="button" data-corp="' + escapeHtml(c) +
      '" title="Отметить весь корпус выполненным (100%)">&#10003; все</button></th>'
    ).join('') + '</tr>';
    const body = floors.map(fl =>
      '<tr><td class="num">' + escapeHtml(fmtCell(fl)) + '</td>' +
      corps.map(c => {
        const v = volByCorpFloor[c].get(fl);
        if (!v) return '<td></td>';
        const mark = state.factMarks && state.factMarks.get(key + '|' + c + '|' + fl);
        const pct = mark ? mark[0] : null;
        const refRow = refByCorpFloor[c].get(fl);
        const title = refRow
          ? 'По поэтажке: готовность ' + fmtCell(refRow[1]) + '%' +
            (refRow[2] ? ' · объём к закрытию ' + fmtCell(refRow[2]) : '') +
            (mark ? ' · отметка: ' + mark[1] + ' ' + fmtDate(mark[2]) : '')
          : (mark ? 'Отметка: ' + mark[1] + ' ' + fmtDate(mark[2]) : '');
        const ph = (pct === null && refRow && refRow[1]) ? String(Math.round(refRow[1])) : '';
        return '<td class="fcell' + (pct === 100 ? ' done' : '') +
          '" data-corp="' + escapeHtml(c) + '" data-floor="' + fl + '"' +
          (title ? ' title="' + escapeHtml(title) + '"' : '') + '>' +
          '<div class="fvol">' + escapeHtml(fmtVol(v)) + '</div>' +
          '<input class="fpct" type="text" inputmode="numeric" value="' +
          (pct === null ? '' : pct) + '"' + (ph ? ' placeholder="' + ph + '"' : '') + '>' +
          '<button class="fdone" type="button" title="Готово — 100%">&#10003;</button></td>';
      }).join('') + '</tr>').join('');
    const foot = '<tr class="total"><td>Готовность</td>' + corps.map(c =>
      '<td class="num" data-ffoot="' + escapeHtml(c) + '">' +
      escapeHtml(factFootTxt(key, c)) + '</td>').join('') + '</tr>';
    html = '<table class="inner mini factgrid"><thead>' + head + '</thead><tbody>' + body +
      '</tbody><tfoot>' + foot + '</tfoot></table>' +
      '<div id="fact-note">' +
      (state.factRefStatus === 'ready'
        ? 'Серый процент в пустом поле и подсказка при наведении — данные поэтажки (справочно).'
        : (state.factRefStatus === 'error' ? ''
          : 'Справка из поэтажки ещё загружается — подсказки в ячейках появятся чуть позже.')) +
      '</div>';
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}

// Имя для журнала отметок — то же, что для вопросов (localStorage otdelka_user).
function ensureUserName() {
  if (state.userName) return true;
  const name = (window.prompt('Ваше имя (запишется в журнал отметок):') || '').trim();
  if (!name) return false;
  state.userName = name;
  try { localStorage.setItem('otdelka_user', name); } catch (e) {}
  return true;
}

// Введённый процент: проверка, optimistic-обновление и постановка в очередь на сохранение.
function applyFactInput(inp) {
  const td = inp.closest('td.fcell');
  if (!td || !state.factModalKey) return;
  const corp = td.dataset.corp;
  const fl = parseFloat(td.dataset.floor);
  const key = state.factModalKey + '|' + corp + '|' + fl;
  const prevMark = state.factMarks.get(key) || null;
  const raw = inp.value.trim().replace(',', '.').replace('%', '');
  let pct;
  if (raw === '') {
    if (!prevMark) return;          // пусто и отметки не было — нечего сохранять
    pct = 0;                        // стирание отметки = 0%
  } else {
    pct = Math.round(parseFloat(raw));
    if (isNaN(pct)) {               // не число — возвращаем прежнее значение
      inp.value = prevMark ? prevMark[0] : '';
      return;
    }
    pct = Math.max(0, Math.min(100, pct));
    inp.value = String(pct);
  }
  if (prevMark && prevMark[0] === pct) return;   // не изменилось
  if (!ensureUserName()) {
    inp.value = prevMark ? prevMark[0] : '';
    return;
  }
  if (!state.factPending.has(key)) {
    state.factPending.set(key, {
      work: state.factModalName, corp, floor: fl,
      prev: prevMark ? prevMark.slice() : null
    });
  }
  state.factPending.get(key).pct = pct;
  state.factMarks.set(key, [pct, state.userName, new Date().toISOString()]);
  td.classList.toggle('done', pct === 100);
  const footCell = document.querySelector('#modal-body td[data-ffoot="' + corp + '"]');
  if (footCell) footCell.textContent = factFootTxt(state.factModalKey, corp);
  setFactNote('Сохраняем…');
  scheduleFactFlush();
}

function setFactNote(text, isErr) {
  const el = document.getElementById('fact-note');
  if (!el) return;
  el.textContent = text || '';
  el.className = isErr ? 'err' : '';
}

let factFlushTimer = null;
function scheduleFactFlush() {
  clearTimeout(factFlushTimer);
  factFlushTimer = setTimeout(flushFactMarks, 1200);
}

async function flushFactMarks() {
  if (state.factSaving || !state.factPending.size) return;
  const batch = state.factPending;
  state.factPending = new Map();
  state.factSaving = true;
  const marks = Array.from(batch.values()).map(m =>
    ({ work: m.work, corp: m.corp, floor: m.floor, pct: m.pct }));
  try {
    let json = null, lastErr = null;
    for (let i = 0; i < 3; i++) {
      try {
        json = await postJson({ action: 'saveFact', author: state.userName, marks });
        break;
      } catch (e) {
        lastErr = e;
        await new Promise(r => setTimeout(r, 1000 * (i + 1)));
      }
    }
    if (!json) throw lastErr;
    if (!json.ok) throw new Error(json.message || json.error);
    setFactNote('Сохранено ✓');
    if (state.screen === 'fact') renderTable();
  } catch (e) {
    // Откат: отметки возвращаются к прежним, сетка и таблица перерисовываются.
    batch.forEach((m, key) => {
      if (m.prev) state.factMarks.set(key, m.prev);
      else state.factMarks.delete(key);
    });
    if (state.screen === 'fact') renderTable();
    const overlayOpen = document.getElementById('modal-overlay').style.display !== 'none';
    if (overlayOpen && state.factModalKey) {
      openFactModal(state.factModalKey, state.factModalName);
      setFactNote('Не сохранилось: ' + e.message, true);
    }
    alert('Отметки факта не сохранились: ' + e.message +
      '. Значения возвращены как были — попробуйте ещё раз.');
  } finally {
    state.factSaving = false;
    if (state.factPending.size) scheduleFactFlush();
  }
}

// Пока есть несохранённые отметки — предупреждаем при закрытии страницы.
window.addEventListener('beforeunload', e => {
  if (state.factPending.size || state.factSaving) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// Обработчики сетки отметок — делегированием (модальное окно переиспользуется).
document.getElementById('modal-body').addEventListener('change', e => {
  const inp = e.target.closest('input.fpct');
  if (inp && state.factModalKey) applyFactInput(inp);
});
document.getElementById('modal-body').addEventListener('click', e => {
  const done = e.target.closest('button.fdone');
  if (done && state.factModalKey) {
    const td = done.closest('td.fcell');
    const inp = td && td.querySelector('input.fpct');
    if (inp) { inp.value = '100'; applyFactInput(inp); }
    return;
  }
  const all = e.target.closest('button.fcorp-done');
  if (all && state.factModalKey) {
    const corp = all.dataset.corp;
    if (!window.confirm('Отметить все этажи корпуса ' + corp + ' выполненными (100%)?')) return;
    document.querySelectorAll('#modal-body td.fcell[data-corp="' + corp + '"] input.fpct')
      .forEach(inp => {
        if (inp.value.trim() !== '100') { inp.value = '100'; applyFactInput(inp); }
      });
  }
});
