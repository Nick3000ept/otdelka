<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отделка — витрина расценок</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel2: #eef0f4;
    --border: #d7dbe3;
    --text: #1c2028;
    --text-dim: #6b7280;
    --accent: #2f6fed;
    --danger: #d92d2d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #gate {
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 320px; text-align: center;
  }
  #gate h1 { font-size: 18px; margin: 0 0 16px; }
  #gate input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 15px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
  }
  #gate button:disabled { opacity: .6; cursor: default; }
  #gate .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

  #app { display: none; height: 100%; flex-direction: row; }

  /* Боковая панель с вкладками (по образцу КЛАД). */
  #sidebar {
    flex: none; width: 190px; background: #0f1b2d; color: #e8eaed;
    display: flex; flex-direction: column; padding: 16px 10px; gap: 2px;
  }
  .sb-brand { font-size: 18px; font-weight: 700; padding: 0 10px 16px; color: #fff; }
  .sb-item {
    padding: 9px 12px; border-radius: 8px; color: #c7cfdd;
    cursor: pointer; font-size: 13px;
  }
  .sb-item:hover { background: #1a2940; color: #fff; }
  .sb-item.active { background: var(--accent); color: #fff; }
  .sb-group {
    padding: 9px 12px; color: #c7cfdd; cursor: pointer; font-size: 13px;
    border-radius: 8px; margin-top: 6px;
  }
  .sb-group:hover { background: #1a2940; color: #fff; }
  .sb-group .chev { color: #6f7f99; margin-right: 4px; }
  .sb-sub { padding-left: 26px; display: flex; align-items: center; gap: 8px; }
  .sb-badge {
    margin-left: auto; background: #d92d2d; color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; padding: 1px 7px; min-width: 14px; text-align: center;
  }
  .sb-badge:empty { display: none; }

  #content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }

  .filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .flt { display: flex; align-items: center; gap: 6px; }
  .flt label { color: var(--text-dim); font-size: 12px; }
  .flt select {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; max-width: 260px;
  }
  #f-reset, #f-toggle-all {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  #f-reset:hover, #f-toggle-all:hover { color: var(--text); }
  .search-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #search {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; width: 260px;
  }
  #count { color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  main { flex: 1; overflow: auto; padding: 0 16px 16px; }
  /* table-layout: fixed — ширины колонок берутся ТОЛЬКО из заголовков и не зависят
     от того, какие строки сейчас раскрыты. Иначе столбцы скачут при разворачивании
     уровней (жалоба пользователя 03.08.2026). Все ширины заданы у th ниже. */
  table { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
  /* Всё по центру, кроме названия работы и локации (просьба пользователя 03.08.2026). */
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--panel); text-align: center;
    padding: 7px 8px; border-bottom: 2px solid var(--border); white-space: nowrap;
    color: var(--text-dim); font-weight: 600;
  }
  tbody td {
    padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  th.wname, td.wname, th.tags, td.tags { text-align: left; }

  /* Ширины колонок задаются только здесь (см. table-layout: fixed выше). */
  thead th { width: 96px; }
  thead th.chev-col { width: 8px; }
  thead th.wname { width: 38%; }
  /* «Объемы»: название забирает всё свободное место (просьба пользователя 04.08.2026). */
  thead th.wauto { width: auto; }
  thead th.tags { width: 200px; }
  thead th.volcell { width: 62px; white-space: normal; }
  /* Корпуса на «Объемах» — узкие (48px + 10% по просьбе 04.08.2026), «Итого» чуть шире. */
  thead th.corpcell { width: 53px; }
  thead th.totcell { width: 64px; }
  /* Числа объёмов на «Объемах» — мельче, чтобы не обрезались (просьба 04.08.2026). */
  table.vols tbody td.num { font-size: 11px; }
  tbody tr.work { cursor: pointer; }
  tbody tr.work:hover { background: var(--panel2); }
  tbody tr.work.open { background: var(--panel2); }
  .num { text-align: center; font-variant-numeric: tabular-nums; }

  /* Служебная первая колонка (под пустой заголовок). Стрелки у всех уровней и у работы
     живут внутри ячейки с названием, поэтому здесь только узкий отступ. */
  td.chev-cell { padding: 0; overflow: visible; text-overflow: clip; }
  .cnt { color: var(--text-dim); font-size: 11px; }

  /* Место · поверхность · локация — тегами в одной ячейке. */
  td.tags { white-space: normal; overflow: visible; text-overflow: clip; }
  .tag {
    display: inline-block; margin: 1px 4px 1px 0; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel2); color: var(--text-dim); font-size: 12px; white-space: nowrap;
  }

  th.volcell, td.volcell { text-align: center; white-space: nowrap; }
  /* Галочка лидерного объёма. Имя .tick, не .check — класс .check носят таблицы
     проверок/бюджета, и общее имя красило их текст в зелёный (баг 04.08.2026). */
  .tick { color: #4ccf7a; font-size: 15px; }

  thead th.num { white-space: normal; }
  /* Во внутренней таблице узкие: числовые + Ед. изм. материала и Слои. */
  table.inner th.num, table.inner th.fixw { width: 84px; }
  /* Ед. изм, Слои, Расход, Итого — на 20% уже остальных (решение пользователя 03.08.2026). */
  table.inner th.narw { width: 67px; }
  table.inner th.fixw { white-space: normal; }
  table.inner th.mname { width: 320px; }

  /* Название работы — с переносом строк, без обрезки многоточием. */
  td.wname, th.wname {
    white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word;
  }

  /* Заголовки уровней дерева: место -> поверхность -> группа работ.
     Отступ задаётся только ячейке с названием (.gname), чтобы остальные колонки
     оставались на своих местах: 8 / 24 / 40px, работа — 56px (td.wname). */
  tbody tr.plc td, tbody tr.srf td, tbody tr.grp td {
    border-bottom: 1px solid var(--border);
    cursor: pointer; white-space: normal; max-width: none;
  }
  tbody tr.plc .chev, tbody tr.srf .chev, tbody tr.grp .chev {
    color: var(--accent); margin-right: 4px;
  }

  tbody tr.plc td {
    background: var(--panel2); border-top: 1px solid var(--border);
    padding: 9px 8px; font-weight: 700;
  }
  tbody tr.plc:hover td { background: #e2e5eb; }
  tbody tr.plc td.gname { padding-left: 8px; }

  tbody tr.srf td {
    background: #f2f4f7; padding: 7px 8px; font-weight: 650; font-size: 13px;
  }
  tbody tr.srf:hover td { background: #e8ebf0; }
  tbody tr.srf td.gname { padding-left: 24px; }

  tbody tr.grp td {
    background: #f9fafb; padding: 6px 8px; font-weight: 600; font-size: 13px;
  }
  tbody tr.grp:hover td { background: #eef0f4; }
  tbody tr.grp td.gname { padding-left: 40px; }

  /* Работа — четвёртый уровень, правее заголовка группы работ. */
  tbody tr.work td.wname { padding-left: 56px; }
  /* Итог по объёму в заголовке группы — в своих колонках, не рядом с названием. */
  td.gsum { font-weight: 600; color: var(--text); }
  /* Фиксированная раскладка: список материалов одинаков у всех работ и не «дышит». */
  table.inner {
    table-layout: fixed; width: 964px; max-width: 100%;
    margin: 10px 0 14px; border: 1px solid var(--border);
  }
  table.inner th {
    position: static; background: var(--panel2); color: var(--text-dim);
    font-size: 12px; padding: 5px 8px; border-bottom: 1px solid var(--border);
    text-align: center;
  }
  table.inner td {
    font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border);
    text-align: center;
  }
  /* Название материала — по левому краю, как и название работы. */
  table.inner th.mname, table.inner td.mname, table.inner tfoot td:first-child {
    text-align: left;
  }
  table.inner tbody tr:last-child td { border-bottom: none; }

  /* Экран: верхние 2/3 — дерево работ, нижняя треть — подрядчики выбранной работы. */
  main { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #pane-top { flex: 1 1 0; overflow: auto; padding: 0 16px; }
  #pane-bottom {
    flex: 0 0 33%; overflow: auto; padding: 10px 16px 16px;
    border-top: 2px solid var(--border); background: var(--panel);
  }
  .pane-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .pane-caption {
    font-size: 11px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .4px; white-space: nowrap;
  }
  .pane-work { font-size: 13px; font-weight: 600; color: var(--text); }
  .side-sub { display: block; font-weight: 400; color: var(--text-dim); font-size: 11px; }
  .side-note { font-size: 12px; color: var(--text-dim); padding: 12px 0; }

  /* Выбранная работа в дереве. */
  tbody tr.work { cursor: pointer; }
  tbody tr.work.sel td { background: #dbe7ff; }
  tbody tr.work:hover td { background: var(--panel2); }
  tbody tr.work.sel:hover td { background: #d0dffc; }

  /* Название выбранной работы — по центру над таблицами нижнего блока. */
  #pane-work {
    text-align: center; font-size: 13px; font-weight: 700; color: var(--text);
    margin: 0 0 10px;
  }
  #pane-work.placeholder { color: var(--text-dim); font-weight: 400; }

  /* Нижний блок: слева подрядчики × корпуса, справа материалы. */
  #bottom-cols { display: flex; gap: 28px; align-items: flex-start; }
  .bottom-col { min-width: 0; overflow-x: auto; }
  /* Заголовки обеих таблиц на одной высоте: убираем верхний отступ у таблиц. */
  #bottom-cols table.inner { margin-top: 0; }

  /* Переключатель содержимого ячеек сводной: Работа / Материалы / Работа + материалы. */
  .cmode { display: flex; margin-bottom: 6px; }
  .cmode-btn {
    padding: 3px 10px; font-size: 11px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text-dim);
  }
  .cmode-btn:first-child { border-radius: 6px 0 0 6px; }
  .cmode-btn:last-child { border-radius: 0 6px 6px 0; }
  .cmode-btn + .cmode-btn { border-left: none; }
  .cmode-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  table.inner.contractors { width: auto; margin: 0; }
  table.inner.contractors th.cname, table.inner.contractors td.cname {
    width: 220px; text-align: left; white-space: normal;
  }
  table.inner.contractors th.ccorp, table.inner.contractors td.num { width: 46px; }
  table.inner.contractors td { font-size: 11px; }
  /* Кликабельные строки подрядчиков и таблица деталей. */
  table.inner.contractors tr.crow { cursor: pointer; }
  table.inner.contractors tr.crow:hover td { background: var(--panel2); }
  table.inner.contractors tr.crow-sel td { background: #dbe7ff; }
  table.inner.mini { width: auto; margin: 0 0 10px; }
  table.inner.mini th, table.inner.mini td { font-size: 11px; }
  table.inner.mini th.num, table.inner.mini td.num { width: 90px; }

  /* Модальное окно с деталями по подрядчику. */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 17, 21, .45);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    max-width: min(1100px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(15, 17, 21, .25);
  }
  .modal-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .modal-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  #modal-close {
    border: 1px solid var(--border); background: var(--panel2); color: var(--text-dim);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; flex: none;
  }
  #modal-close:hover { color: var(--text); }
  #modal-body { padding: 12px 18px 16px; overflow: auto; }

  /* Базовая расценка — приглушённая строка внизу сводной. */
  table.inner.contractors tr.baserow td { color: var(--text-dim); }

  /* Разделители-заголовки: «Собственные силы» в таблицах подрядчиков
     и группы работ в проверке «Расценки работ». */
  table.inner tr.sect td, table.check tr.sect td {
    background: var(--panel2); font-size: 11px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .4px; text-align: left; padding: 6px 8px;
  }
  table.inner tfoot td {
    font-size: 12px; padding: 6px 8px; font-weight: 600;
    background: var(--panel2); border-top: 1px solid var(--border);
  }
  .no-detail { color: var(--text-dim); font-size: 12px; padding: 10px 0 12px; }

  #status { padding: 40px; text-align: center; color: var(--text-dim); }
  #status.error { color: var(--danger); }

  /* Вопросы по работам (04.08.2026): кнопка в строке, форма в модалке, статусы. */
  .qbtn {
    margin-left: 8px; padding: 1px 8px; font-size: 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text-dim);
    cursor: pointer; vertical-align: middle;
  }
  .qbtn:hover { color: var(--accent); border-color: var(--accent); }
  .q-form { min-width: min(460px, 80vw); }
  .q-form label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  .q-form input, .q-form textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel2); color: var(--text); font: inherit; resize: vertical;
  }
  .q-actions { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  #q-send {
    padding: 8px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  #q-send:disabled { opacity: .6; cursor: default; }
  #q-err { font-size: 12px; color: var(--danger); }
  .qstatus {
    padding: 2px 10px; border-radius: 999px; border: 1px solid; cursor: pointer;
    font-size: 12px; background: transparent;
  }
  .qstatus.open { color: #b42121; border-color: #f2c4c4; background: #fdeaea; }
  .qstatus.closed { color: #1d7a3d; border-color: #bfe3cb; background: #e7f6ec; }
  table.check.qtab th.c-st { width: 90px; }
  table.check.qtab th.c-work { width: 26%; }
  table.check.qtab th.c-auth { width: 110px; }
  table.check.qtab th.c-date { width: 120px; }
  table.check.qtab th.c-who { width: 170px; }

  /* Экраны проверок и бюджета. */
  #check-screen, #budget-screen { flex: 1; overflow: auto; padding: 14px 16px; }
  /* Свод бюджета: две колонки, таблицу не растягиваем на весь экран.
     Статья должна помещаться в одну строку (просьба 04.08.2026). */
  table.check.budget { max-width: 1000px; }
  table.check.budget th.num, table.check.budget td.num { width: 200px; }
  table.check.budget td:first-child { white-space: nowrap; }
  table.check.budget tfoot td {
    font-weight: 700; background: var(--panel2);
    border-top: 2px solid var(--border); padding: 7px 8px;
  }
  .check-head { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .check-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  table.check { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
  table.check th {
    text-align: left; padding: 7px 8px; border-bottom: 2px solid var(--border);
    color: var(--text-dim); font-weight: 600; background: var(--panel);
    position: sticky; top: -14px;
  }
  table.check td {
    padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top;
    white-space: normal; word-break: break-word;
    text-align: left;   /* текст по левому краю, как заголовки (просьба 04.08.2026) */
  }
  table.check th.cw-name { width: 44%; }
  /* Проверка «Расценки работ»: числовые колонки по центру, строки кликабельны,
     отклонения больше порога — красным, под строкой раскрывается список подрядчиков. */
  table.check th.num { text-align: center; width: 110px; }
  table.check td.num { text-align: center; white-space: nowrap; }
  table.check tr.sect[data-grp] { cursor: pointer; }
  table.check tr.sect .chev { color: var(--accent); }
  table.check tr.wrow { cursor: pointer; }
  table.check tr.wrow:hover td { background: var(--panel2); }
  table.check tr.wrow.open td { background: #dbe7ff; }
  table.check tr.wdetail > td { background: #fafbfc; padding: 10px 14px 14px; }
  .dev-bad { color: #b42121; font-weight: 700; }
  .flag {
    display: inline-block; margin: 1px 4px 1px 0; padding: 2px 8px;
    border-radius: 999px; font-size: 11px; font-weight: 600;
    background: #fdeaea; color: #b42121; border: 1px solid #f2c4c4;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Отделка — витрина расценок</h1>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="pwBtn">Войти</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="sb-brand">Отделка СБ3</div>
    <div class="sb-item active" data-screen="rates">Расценки</div>
    <div class="sb-item" data-screen="volumes">Объемы</div>
    <div class="sb-item" data-screen="budget">Бюджет</div>
    <div class="sb-group" id="sb-checks-toggle"><span class="chev">&#9656;</span> Проверки</div>
    <div id="sb-checks" style="display:none">
      <div class="sb-item sb-sub" data-screen="check-rates">Недостающие расценки
        <span class="sb-badge" id="badge-check-rates"></span></div>
      <div class="sb-item sb-sub" data-screen="check-work-rates">Отклонения расценок
        <span class="sb-badge" id="badge-check-work-rates"></span></div>
      <div class="sb-item sb-sub" data-screen="check-questions">Вопросы
        <span class="sb-badge" id="badge-check-questions"></span></div>
    </div>
  </aside>
  <div id="content">
  <header>
    <div class="filters">
      <span class="flt"><label for="f-group">Группа работ</label><select id="f-group"></select></span>
      <span class="flt"><label for="f-place">Место</label><select id="f-place"></select></span>
      <span class="flt"><label for="f-surface">Поверхность</label><select id="f-surface"></select></span>
      <button id="f-toggle-all" type="button">Развернуть все</button>
      <button id="f-reset" type="button">Сбросить</button>
      <div class="search-wrap">
        <span id="count"></span>
        <input id="search" type="text" placeholder="Поиск...">
      </div>
    </div>
  </header>
  <main>
    <div id="status">Загрузка данных...</div>
    <!-- Верхняя треть: дерево работ. Нижние 2/3: подрядчики × корпуса выбранной работы. -->
    <div id="pane-top" style="display:none">
      <table id="table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="check-screen" style="display:none"></div>
    <div id="budget-screen" style="display:none"></div>
    <div id="pane-bottom" style="display:none">
      <div id="pane-work"></div>
      <div id="bottom-cols">
        <div class="bottom-col"><div id="ctr-body"></div></div>
        <div class="bottom-col"><div id="mat-body"></div></div>
      </div>
    </div>
  </main>
  </div>
</div>

<!-- Модальное окно с деталями по подрядчику -->
<div id="modal-overlay" style="display:none">
  <div id="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div id="modal-sub" class="modal-sub"></div>
      </div>
      <button id="modal-close" type="button" title="Закрыть (Esc)">&#10005;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyo6f-OGca1loM1aBXtHkcx7nq8tlJWBreGepxp0KTwq7GvDdDPKo-tuFjXQqKs1nZfdQ/exec';

// Колонки листа «Работы», которые на витрине не показываем (решение пользователя 03.08.2026).
const HIDDEN_COLS = [
  'Название работы СС',
  'ИД факт',
  'Признак для бюджета основной',
  'Признак для бюджета дополнительный',
  'Признак для бюджета дополнительный объем',
  'Признак Уровень 1 ДГП для увязки',
  'Материалы',
  'Место',        // не показываем: 1-й уровень группировки, значение в заголовке
  'Поверхность',  // не показываем: 2-й уровень группировки, значение в заголовке
  'Группа работ', // не показываем: 3-й уровень группировки, значение в заголовке
  'Плановый процент переделки'  // убран с витрины 03.08.2026
];

// Колонка, по которой работа связывается с материалами из листа «Расходы».
const WORK_KEY = 'Название работы из АР';

// Колонки для группировки и фильтров.
const COL_GROUP = 'Группа работ';
const COL_PLACE = 'Место';
const COL_SURFACE = 'Поверхность';
// Список группируется в два уровня: Место -> Группа работ (решение пользователя 03.08.2026).
const NO_PLACE = '— без места —';
const NO_SURFACE = '— без поверхности —';
const NO_GROUP = '— без группы —';

// Раскрытый список материалов: что показываем и в каком порядке (решение пользователя
// 03.08.2026). Место, Тип работ, Объем работ и Объем материала не показываем.
const RUCH = 'Ручной расход';
const AVTO = 'Расход автомат';

function filled(v) {
  return v !== '' && v !== null && v !== undefined;
}

// fix: true — колонка той же узкой ширины, что и числовые (просьба пользователя 03.08.2026).
const DETAIL_COLS = [
  { label: 'Материалы', key: 'Материалы', name: true },
  // Единица измерения самого материала — из справочника «Материалы» по названию.
  { label: 'Ед. изм', fix: true, nar: true, calc: r => state.unitByMaterial.get(norm(r['Материалы'])) || '' },
  { label: 'Слои', key: 'Слои', fix: true, nar: true },
  // Ручной расход имеет приоритет над автоматическим; своей колонки у него больше нет.
  { label: 'Расход', nar: true, calc: r => (filled(r[RUCH]) ? r[RUCH] : r[AVTO]) },
  { label: 'Итого', key: 'Расход в рачет', nar: true },
  { label: 'Расценка', key: 'Расценка' },
  { label: 'Стоимость', key: 'Стоимость материала в ед работы' }
];

// Колонка, по которой в раскрытом списке считается итог.
const SUM_COL = 'Стоимость материала в ед работы';

const state = {
  token: localStorage.getItem('otdelka_token') || '',
  works: [],
  byWork: new Map(),           // название работы -> строки листа «Расходы»
  unitByMaterial: new Map(),   // название материала -> ед. изм. из справочника «Материалы»
  screen: 'rates',             // текущая вкладка: rates (расценки) | volumes (объёмы)
  vols: null,                  // работа -> корпус -> [[этаж, объём], ...] (action=volumes)
  volsTotals: null,            // работа -> { корпус: суммарный объём }
  volsStatus: 'idle',          // idle | loading | ready | error
  floors: null,                // сводка подрядчик × корпус, грузится отдельным запросом
  floorsSS: null,              // работа -> названия работы СС из поэтажки (кол. J)
  floorsStatus: 'loading',     // loading | ready | error
  contrRates: [],              // лист «Расценки подрядчиков» — детали по клику
  ssRates: [],                 // лист «Расценки СС» — детали по клику (собств. силы)
  ssMap: [],                   // лист «Справочник СС» — мэппинг Работа СС -> Работа для АР
  checkRates: [],              // лист «Проверки расценки» — готовая проверка «нет расценок»
  checkOpen: null,             // раскрытая строка в проверке «Расценки работ»
  budget: null,                // свод статья -> стоимость (action=budget)
  budgetStatus: 'idle',        // idle | loading | ready | error
  checkCollapsed: new Set(),   // свёрнутые группы в проверке «Отклонения расценок»
  questions: [],               // вопросы по работам (action=questions + POST)
  questionsStatus: 'idle',     // idle | loading | ready | error
  userName: localStorage.getItem('otdelka_user') || '',  // имя для вопросов/статусов
  ctrSel: null,                // выбранный в сводной подрядчик: { name, ss }
  ctrMode: 'work',             // ячейки сводной: 'work' | 'mat' | 'both' (кнопки Работа/Материалы/Работа+материалы)
  selected: null,              // ключ выбранной работы -> нижняя панель подрядчиков
  selectedName: '',
  query: '',
  filters: { group: '', place: '', surface: '' },
  collapsed: new Set()         // свёрнутые группы работ
};

const NUM_HINT = /(расценк|цена|стоимост|объем|объём|расход|процент)/i;
// Денежные колонки — всегда ровно 2 знака после запятой.
const MONEY_HINT = /(расценк|цена|стоимост|руб)/i;

// Локация показывается тегом в конце строки. Место и Группа работ туда не входят —
// они теперь заголовки уровней группировки (см. groupWorks).
const TAG_COLS = ['Локация'];
const TAG_LABEL = 'Локация';

// Работа участвует в расчёте лидерного объёма, если этот признак заполнен
// (в колонке лежит не «да/нет», а название группы — 73 работы из 321).
// Заголовок: «Ген. объем» -> «Лидерный объем» -> «Лид.» (просьбы пользователя 04.08.2026).
const VOL_FLAG = 'Признак для бюджета дополнительный объем';
const VOL_LABEL = 'Лид.';

const VOL_COL = 'Объем работ';
const UNIT_COL = 'Ед. изм. работа';

function hasVolume(r) {
  return String(r[VOL_FLAG] === null || r[VOL_FLAG] === undefined ? '' : r[VOL_FLAG]).trim() !== '';
}

// Короткие заголовки колонок работ (решение пользователя 03.08.2026).
// Ключ — как в Sheets, значение — как показываем.
const RENAME = {
  'Ед. изм. работа': 'Ед. изм',
  'Базовая расценка работа в расчет, руб': 'Баз. расценка раб.',
  'Стоимость материалов базовая, за ед': 'Баз. расценка мат.'
};

function norm(v) {
  return String(v === null || v === undefined ? '' : v).trim().toLowerCase();
}

function fmtCell(val, money) {
  if (typeof val === 'number') {
    return new Intl.NumberFormat('ru-RU', money
      ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
      : { maximumFractionDigits: 4 }
    ).format(val);
  }
  return val === null || val === undefined ? '' : String(val);
}

// Объёмы работ — целыми, без десятых (в строках работ и в итогах групп; 03.08.2026).
function fmtVol(v) {
  return typeof v === 'number'
    ? new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(v)
    : fmtCell(v);
}

function isNumericColumn(key, rows) {
  if (NUM_HINT.test(key)) return true;
  return rows.length > 0 && typeof rows[0][key] === 'number';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Колонки, по которым идёт поиск (все непрятанные, включая источники тегов).
function searchKeys(rows) {
  if (!rows.length) return [];
  return Object.keys(rows[0]).filter(h => HIDDEN_COLS.indexOf(h) === -1);
}

// Порядок колонок после названия — жёстко задан пользователем 03.08.2026
// («% переделки» убран; ключи — имена из Sheets).
const COL_ORDER = [
  'Ед. изм. работа',
  'Базовая расценка работа в расчет, руб',
  'Стоимость материалов базовая, за ед',
  'Объем работ'
];

// Колонки таблицы работ: название + галочка ген. объёма + COL_ORDER + локация тегом.
// На вкладке «Объемы» вместо характеристик — 12 корпусов (иерархия та же).
function workColumns(rows) {
  if (!rows.length) return [];
  if (state.screen === 'volumes') {
    // Ед. изм. и галочка лидерного объёма — сразу после названия, справа «Итого»
    // (просьбы пользователя 04.08.2026). Название занимает всё свободное место (auto).
    const cols = [
      { label: WORK_KEY, key: WORK_KEY, auto: true },
      { label: 'Ед. изм', key: UNIT_COL, unit: true },
      { label: VOL_LABEL, vol: true }
    ];
    ALL_CORPS.forEach(c => cols.push({ label: c, corp: c, num: true }));
    cols.push({ label: 'Итого', total: true, num: true });
    return cols;
  }
  const keys = Object.keys(rows[0]);
  const mk = h => ({
    label: RENAME[h.trim()] || h,     // признаки «числовая»/«денежная» — по имени из Sheets
    key: h,
    num: isNumericColumn(h, rows),
    money: MONEY_HINT.test(h)
  });
  const cols = [mk(WORK_KEY), { label: VOL_LABEL, vol: true }];
  COL_ORDER.forEach(h => { if (keys.indexOf(h) !== -1) cols.push(mk(h)); });
  if (TAG_COLS.some(t => keys.indexOf(t) !== -1)) cols.push({ label: TAG_LABEL, tags: true });
  return cols;
}

function cellHtml(col, r) {
  // Вкладка «Объемы»: суммарный объём работы по корпусу.
  if (col.corp) {
    const t = state.volsTotals && state.volsTotals.get(norm(r[WORK_KEY]));
    const v = t && t[col.corp];
    return '<td class="num">' + (v ? escapeHtml(fmtVol(v)) : '') + '</td>';
  }
  // «Итого» справа — объём работы по всем корпусам разом (04.08.2026).
  if (col.total) {
    const t = state.volsTotals && state.volsTotals.get(norm(r[WORK_KEY]));
    let sum = 0;
    if (t) ALL_CORPS.forEach(c => { sum += t[c] || 0; });
    return '<td class="num gsum">' + (sum ? escapeHtml(fmtVol(sum)) : '') + '</td>';
  }
  if (col.vol) {
    return '<td class="volcell">' + (hasVolume(r) ? '<span class="tick">&#10003;</span>' : '') + '</td>';
  }
  if (col.tags) {
    const tags = TAG_COLS
      .map(k => String(r[k] === null || r[k] === undefined ? '' : r[k]).trim())
      .filter(v => v);
    return '<td class="tags">' +
      tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</td>';
  }
  // Название с отступом (лесенка иерархии); раскрытия больше нет, клик выбирает работу.
  // На «Расценках» рядом с названием — кнопка «Вопрос» (04.08.2026).
  if (col.key === WORK_KEY) {
    const qbtn = state.screen === 'rates'
      ? ' <button class="qbtn" type="button" title="Задать вопрос по работе">Вопрос</button>'
      : '';
    return '<td class="wname">' + escapeHtml(fmtCell(r[col.key], col.money)) + qbtn + '</td>';
  }
  // Объёмы работ — до десятых (решение пользователя 03.08.2026).
  if (col.key === VOL_COL) {
    return '<td class="num">' + escapeHtml(fmtVol(r[col.key])) + '</td>';
  }
  const cls = col.num ? ' class="num"' : '';
  return '<td' + cls + '>' + escapeHtml(fmtCell(r[col.key], col.money)) + '</td>';
}

function buildIndex(expenses) {
  const map = new Map();
  expenses.forEach(row => {
    const key = norm(row[WORK_KEY]);
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  });
  return map;
}

function passesFilters(r) {
  const f = state.filters;
  if (f.group && String(r[COL_GROUP] || '').trim() !== f.group) return false;
  if (f.place && String(r[COL_PLACE] || '').trim() !== f.place) return false;
  if (f.surface && String(r[COL_SURFACE] || '').trim() !== f.surface) return false;
  return true;
}

// Три уровня группировки: Место -> Поверхность -> Группа работ. Порядок — как в листе
// «Работы» (порядок таблицы осмыслен), не по алфавиту.
function groupWorks(rows) {
  const places = [];
  const byPlace = new Map();
  rows.forEach(r => {
    const placeName = String(r[COL_PLACE] || '').trim() || NO_PLACE;
    if (!byPlace.has(placeName)) {
      const p = { name: placeName, key: 'p:' + placeName, rows: [], surfaces: [], bySurface: new Map() };
      byPlace.set(placeName, p);
      places.push(p);
    }
    const p = byPlace.get(placeName);
    p.rows.push(r);

    const surfaceName = String(r[COL_SURFACE] || '').trim() || NO_SURFACE;
    if (!p.bySurface.has(surfaceName)) {
      const s = { name: surfaceName, key: p.key + '›s:' + surfaceName, rows: [], subgroups: [], byGroup: new Map() };
      p.bySurface.set(surfaceName, s);
      p.surfaces.push(s);
    }
    const s = p.bySurface.get(surfaceName);
    s.rows.push(r);

    const groupName = String(r[COL_GROUP] || '').trim() || NO_GROUP;
    if (!s.byGroup.has(groupName)) {
      const g = { name: groupName, key: s.key + '›g:' + groupName, rows: [] };
      s.byGroup.set(groupName, g);
      s.subgroups.push(g);
    }
    s.byGroup.get(groupName).rows.push(r);
  });

  // Итог по объёму — только на уровне «Группа работ» (решение пользователя 03.08.2026):
  // сумма `Объем работ` по работам с признаком ген. объёма. Считаем раздельно по единицам
  // измерения: сейчас внутри групп они однородны, но при изменении данных м2 и м.п.
  // не должны молча сложиться в одно число.
  places.forEach(p => p.surfaces.forEach(s => s.subgroups.forEach(g => {
    // Работы без признака ген. объёма — вниз группы (решение пользователя 03.08.2026);
    // работы с признаком сортируются по «Объем работ» на уменьшение, без признака —
    // в порядке листа (sort стабильный).
    const volOf = r => (typeof r[VOL_COL] === 'number' ? r[VOL_COL] : 0);
    g.rows.sort((a, b) => {
      const fa = hasVolume(a), fb = hasVolume(b);
      if (fa !== fb) return (fb ? 1 : 0) - (fa ? 1 : 0);
      return fa ? volOf(b) - volOf(a) : 0;
    });
    const flagged = g.rows.filter(hasVolume);
    g.flagged = flagged.length;
    const byUnit = new Map();
    flagged.forEach(r => {
      const u = String(r[UNIT_COL] || '').trim();
      const v = typeof r[VOL_COL] === 'number' ? r[VOL_COL] : 0;
      byUnit.set(u, (byUnit.get(u) || 0) + v);
    });
    g.volParts = Array.from(byUnit.entries());
  })));

  return places;
}

// Плоский список всех ключей группировки (мест, поверхностей, подгрупп) — нужен
// для «свернуть/развернуть всё» и для стартового состояния (всё свёрнуто).
function allGroupKeys(places) {
  const keys = [];
  places.forEach(p => {
    keys.push(p.key);
    p.surfaces.forEach(s => {
      keys.push(s.key);
      s.subgroups.forEach(g => keys.push(g.key));
    });
  });
  return keys;
}

function renderTable() {
  const rows = state.works;
  const cols = workColumns(rows);
  const keys = searchKeys(rows);
  const q = state.query.trim().toLowerCase();
  const filtered = rows.filter(r =>
    passesFilters(r) && (!q || keys.some(h => String(r[h]).toLowerCase().includes(q)))
  );
  // Выбранная работа исчезла из отфильтрованного списка — снимаем выбор,
  // иначе внизу висели бы данные работы, которой на экране нет.
  if (state.selected && !filtered.some(r => norm(r[WORK_KEY]) === state.selected)) {
    state.selected = null;
    state.selectedName = '';
    renderBottomPane();
  }

  const places = groupWorks(filtered);
  let surfaceCount = 0, groupCount = 0;
  places.forEach(p => {
    surfaceCount += p.surfaces.length;
    p.surfaces.forEach(s => { groupCount += s.subgroups.length; });
  });

  document.getElementById('count').textContent =
    filtered.length + ' из ' + rows.length + ' · мест: ' + places.length +
    ' · поверхностей: ' + surfaceCount + ' · групп: ' + groupCount;

  // На «Объемах» у таблицы свой класс — числа в ячейках рисуются мельче.
  document.getElementById('table').classList.toggle('vols', state.screen === 'volumes');

  const theadRow = document.getElementById('thead-row');
  theadRow.innerHTML = '<th class="chev-col"></th>' + cols.map(c => {
    const cls = c.corp ? ' class="num corpcell"'
      : c.total ? ' class="num totcell"'
      : c.num ? ' class="num"'
      : c.vol ? ' class="volcell"'
      : c.unit ? ' class="volcell"'
      : c.tags ? ' class="tags"'
      : (c.key !== WORK_KEY ? ''
      : (c.auto ? ' class="wname wauto"' : ' class="wname"'));
    return '<th' + cls + '>' + escapeHtml(c.label) + '</th>';
  }).join('');

  // Плоский список того, что рисуем: место -> поверхность -> группа работ -> работы,
  // каждый следующий уровень рисуется только если предыдущий развёрнут.
  const items = [];
  places.forEach(p => {
    items.push({ type: 'place', node: p });
    if (state.collapsed.has(p.key)) return;
    p.surfaces.forEach(s => {
      items.push({ type: 'surface', node: s });
      if (state.collapsed.has(s.key)) return;
      s.subgroups.forEach(g => {
        items.push({ type: 'group', node: g });
        if (!state.collapsed.has(g.key)) {
          g.rows.forEach(r => items.push({ type: 'row', row: r }));
        }
      });
    });
  });

  const colspan = cols.length + 1;
  const CHUNK = 300;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let i = 0;
  function renderChunk() {
    const frag = document.createDocumentFragment();
    const end = Math.min(i + CHUNK, items.length);
    for (; i < end; i++) {
      const it = items[i];
      const tr = document.createElement('tr');
      if (it.type === 'place' || it.type === 'surface' || it.type === 'group') {
        const n = it.node;
        const open = !state.collapsed.has(n.key);
        tr.className = it.type === 'place' ? 'plc' : (it.type === 'surface' ? 'srf' : 'grp');
        tr.dataset.grp = n.key;

        // Сумма объёма — только у групп работ и только по работам с галочкой ген. объёма.
        // Показываем её в колонке «Объем работ», единицу — в колонке «Ед. изм. работа»
        // (просьба пользователя 03.08.2026). Если единиц несколько — всё в колонке объёма.
        const parts = (it.type === 'group' && n.flagged) ? n.volParts : [];
        const oneUnit = parts.length === 1;
        const volText = parts.length
          ? (oneUnit
              ? fmtVol(parts[0][1])
              : parts.map(([u, v]) => fmtVol(v) + (u ? ' ' + u : '')).join(' + '))
          : '';
        const unitText = oneUnit ? parts[0][0] : '';

        const label = '<span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
          escapeHtml(n.name) + ' <span class="cnt">' + n.rows.length + '</span>';

        // «Объемы»: в строке группы — сумма по каждому корпусу и итог справа (просьба
        // пользователя 04.08.2026). Как и в «Расценках», считаются только работы
        // с признаком лидерного объёма — иначе одна поверхность сложится дважды.
        let corpSums = null, corpTotal = 0;
        if (state.screen === 'volumes' && it.type === 'group' && n.flagged && state.volsTotals) {
          corpSums = {};
          n.rows.filter(hasVolume).forEach(r => {
            const t = state.volsTotals.get(norm(r[WORK_KEY]));
            if (!t) return;
            ALL_CORPS.forEach(cc => {
              const v = t[cc] || 0;
              if (v) { corpSums[cc] = (corpSums[cc] || 0) + v; corpTotal += v; }
            });
          });
        }

        tr.innerHTML = '<td class="chev-cell"></td>' + cols.map(c => {
          if (c.key === WORK_KEY) return '<td class="wname gname">' + label + '</td>';
          if (corpSums && c.corp) {
            const v = corpSums[c.corp];
            return '<td class="num gsum">' + (v ? escapeHtml(fmtVol(v)) : '') + '</td>';
          }
          if (corpSums && c.total) {
            return '<td class="num gsum">' + (corpTotal ? escapeHtml(fmtVol(corpTotal)) : '') + '</td>';
          }
          if (volText && c.key === VOL_COL) return '<td class="num gsum">' + escapeHtml(volText) + '</td>';
          if (unitText && c.key === UNIT_COL) return '<td class="gsum">' + escapeHtml(unitText) + '</td>';
          return '<td' + (c.num ? ' class="num"' : (c.vol ? ' class="volcell"' : '')) + '></td>';
        }).join('');
      } else {
        const r = it.row;
        const key = norm(r[WORK_KEY]);
        tr.className = key === state.selected ? 'work sel' : 'work';
        tr.dataset.key = key;
        tr.dataset.name = String(r[WORK_KEY] || '');
        tr.innerHTML = '<td class="chev-cell"></td>' + cols.map(c => cellHtml(c, r)).join('');
      }
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    if (i < items.length) requestAnimationFrame(renderChunk);
  }
  renderChunk();
}

function fillSelect(id, key) {
  const sel = document.getElementById(id);
  const prev = sel.value;
  const vals = Array.from(new Set(
    state.works.map(r => String(r[key] || '').trim()).filter(v => v)
  )).sort((a, b) => a.localeCompare(b, 'ru'));
  sel.innerHTML = '<option value="">Все</option>' +
    vals.map(v => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join('');
  if (vals.indexOf(prev) !== -1) sel.value = prev;
}

function fillFilters() {
  fillSelect('f-group', COL_GROUP);
  fillSelect('f-place', COL_PLACE);
  fillSelect('f-surface', COL_SURFACE);
}

/**
 * Сводная «подрядчик × корпус» по одной работе.
 * Данные: state.floors[ключ работы] = [[подрядчик, корпус, расценка, признак СС, мат. расценка], ...].
 * Ячейка зависит от режима (кнопки над таблицей, state.ctrMode): расценка за работу
 * на ед. в бюджет / стоимость материалов на ед. в бюджет / их сумма. Расценки разных
 * корпусов по-прежнему не складываются — суммируются только работа+материалы одной ячейки.
 */
// Корпуса всегда одни и те же — все 12, чтобы колонки не скакали между работами.
const ALL_CORPS = ['К1','К2','К3','К4','К5','К6','К7','К8','К9','К10','К11','К12'];
const BASE_RATE_COL = 'Базовая расценка работа в расчет, руб';
const BASE_MAT_COL = 'Стоимость материалов базовая, за ед';
const CTR_MODES = [['work','Работа'],['mat','Материалы'],['both','Работа + материалы']];
const CTR_CAPTION = {
  work: 'расценка за работу на ед. в бюджет, руб',
  mat:  'стоимость материалов на ед. в бюджет, руб',
  both: 'работа + материалы на ед. в бюджет, руб'
};
// Значение ячейки в текущем режиме; 0/пусто -> undefined (ячейка остаётся пустой)
function ctrCellVal(rate, mat) {
  const v = state.ctrMode === 'work' ? rate
          : state.ctrMode === 'mat'  ? mat
          : (rate || 0) + (mat || 0);
  return v ? v : undefined;
}
const fmtInt = v => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(v);

function contractorsHtml(workKey) {
  if (state.floorsStatus === 'loading') {
    return '<div class="side-note">Сводка по подрядчикам загружается…</div>';
  }
  if (state.floorsStatus === 'error') {
    return '<div class="side-note">Сводку по подрядчикам загрузить не удалось</div>';
  }
  const rows = (state.floors && state.floors[workKey]) || [];
  const corps = ALL_CORPS;
  const head = '<tr><th class="cname">Подрядчик</th>' +
    corps.map(c => '<th class="ccorp">' + escapeHtml(c) + '</th>').join('') + '</tr>';

  // Базовая расценка из строки работы — всегда нижней строкой, но только в корпусах,
  // где не назначен ни подрядчик, ни собственные силы (решение пользователя 03.08.2026).
  // В режимах «Материалы»/«Работа + материалы» берётся базовая мат. расценка работы.
  const work = state.works.find(r => norm(r[WORK_KEY]) === workKey);
  const baseWork = work && typeof work[BASE_RATE_COL] === 'number' ? work[BASE_RATE_COL] : 0;
  const baseMat = work && typeof work[BASE_MAT_COL] === 'number' ? work[BASE_MAT_COL] : 0;
  const base = ctrCellVal(baseWork, baseMat) ?? null;
  const occupied = new Set(rows.map(r => r[1]));

  if (!rows.length && baseWork === 0 && baseMat === 0) {
    return '<div class="side-note">Подрядчики по этой работе в «Поэтажка_работы» не найдены</div>';
  }

  // Два блока: обычные подрядчики и «Собственные силы» (строки с заполненной
  // «Расценка СС работа»). У одного подрядчика бывают и те, и другие расценки
  // (напр. Смирнов) — тогда его ячейки расходятся по обоим блокам.
  const regular = new Map(), own = new Map();
  rows.forEach(([contr, corp, rate, ss, mat]) => {
    const map = ss ? own : regular;
    if (!map.has(contr)) map.set(contr, new Map());
    map.get(contr).set(corp, ctrCellVal(rate, mat));
  });

  // Расценки в сводной — целыми рублями, без копеек (решение пользователя 03.08.2026).
  // Строки кликабельны (class crow): обычный подрядчик -> «Расценки подрядчиков»,
  // из блока собственных сил -> «Расценки СС».
  const rowsOf = (map, isSS) => Array.from(map.keys())
    .sort((a, b) => a.localeCompare(b, 'ru'))
    .map(name => {
      const cells = map.get(name);
      const selCls = state.ctrSel && state.ctrSel.name === name && !!state.ctrSel.ss === !!isSS
        ? ' crow-sel' : '';
      return '<tr class="crow' + selCls + '" data-contr="' + escapeHtml(name) +
        '" data-ss="' + (isSS ? 1 : 0) + '"><td class="cname">' + escapeHtml(name) + '</td>' +
        corps.map(corp => {
          const v = cells.get(corp);
          return '<td class="num">' + (v === undefined ? '' : escapeHtml(fmtInt(v))) + '</td>';
        }).join('') + '</tr>';
    }).join('');

  const sect = title =>
    '<tr class="sect"><td colspan="' + (corps.length + 1) + '">' + title + '</td></tr>';

  let body = rowsOf(regular, false);
  if (own.size) body += sect('Собственные силы') + rowsOf(own, true);
  if (base !== null && corps.some(c => !occupied.has(c))) {
    body += '<tr class="baserow"><td class="cname">Базовая расценка</td>' +
      corps.map(c => '<td class="num">' +
        (occupied.has(c) ? '' : escapeHtml(fmtInt(base))) + '</td>').join('') + '</tr>';
  }

  // Переключатель содержимого ячеек: Работа / Материалы / Работа + материалы (04.08.2026).
  const modeBtns = '<div class="cmode">' + CTR_MODES.map(([m, label]) =>
    '<button type="button" class="cmode-btn' + (state.ctrMode === m ? ' on' : '') +
    '" data-mode="' + m + '">' + label + '</button>').join('') + '</div>';

  return modeBtns +
    '<table class="inner contractors"><thead>' + head + '</thead><tbody>' + body +
    '</tbody></table>' +
    '<div class="side-sub" style="margin-top:6px">' + CTR_CAPTION[state.ctrMode] + '</div>';
}

// Нижняя панель: слева подрядчики × корпуса, справа материалы выбранной работы.
// Без заголовков и без названия работы (решение пользователя 03.08.2026) —
// выбранная работа видна по подсветке строки в дереве.

/**
 * Детали по клику на подрядчика в сводной (в модальном окне).
 * Обычный подрядчик — строки листа «Расценки подрядчиков» (работа + подрядчик).
 * Собственные силы — лист «Расценки СС»; связка (логика пользователя 03.08.2026):
 * Работы.«Название работы СС» -> Справочник СС.«Работа СС» -> его колонка C
 * «Работа для расценок модель отделка АР» -> Расценки СС.«Работа для АР».
 * Показывается ВЕСЬ перечень работ СС по выбранной работе (без фильтра по подрядчику —
 * у конкретного подрядчика строк может не быть, а перечень работ пользователю нужен).
 */
function contractorDetailHtml(name, isSS) {
  if (isSS) {
    // Названия работы СС берём из ПОЭТАЖКИ (кол. J, приходит в floors как ssNames);
    // колонка в листе «Работы» — только запасной источник, она почти пустая.
    const ssNames = new Set(
      ((state.floorsSS && state.floorsSS[state.selected]) || []).map(norm).filter(Boolean)
    );
    const work = state.works.find(r => norm(r[WORK_KEY]) === state.selected);
    const fromWorks = norm(work && work['Название работы СС']);
    if (fromWorks) ssNames.add(fromWorks);
    if (!ssNames.size) {
      return '<div class="side-note">«Название работы СС» не заполнено ни в поэтажке, ни в листе «Работы» — связать с расценками СС нечем</div>';
    }
    // Справочник СС: расширяем набор в обе стороны (A «Работа СС» <-> C «Работа для
    // расценок модель отделка АР»), затем ищем всё это в «Расценки СС».«Работа для АР».
    const targets = new Set(ssNames);
    state.ssMap.forEach(m => {
      const a = norm(m['Работа СС']);
      const c = norm(m['Работа для расценок модель отделка АР']);
      if (a && c) {
        if (ssNames.has(c)) targets.add(a);
        if (ssNames.has(a)) targets.add(c);
      }
    });
    const rows = state.ssRates.filter(r => targets.has(norm(r['Работа для АР'])));
    if (!rows.length) {
      return '<div class="side-note">В «Расценках СС» строк по этой работе не найдено</div>';
    }
    const cols = [
      ['Подрядчик', 'Подрядчик', false],
      ['Работа для АР', 'Работа', false],
      ['SUM из Стоимость работ на руки, руб.', 'На руки', true],
      ['SUM из Стоимость работ с налогами', 'С налогами', true],
      ['SUM из Стоимость накладных расходов (подсоба, бригадиры, патенты, общежития, ПОС, билеты)', 'Накладные', true],
      ['SUM из Стоимость итого', 'Итого', true]
    ];
    return miniTable(cols, rows);
  }

  const rows = state.contrRates.filter(r =>
    norm(r['Подрядчик']) === norm(name) && norm(r['Работа']) === state.selected
  );
  if (!rows.length) {
    return '<div class="side-note">В «Расценках подрядчиков» строк по этой работе и подрядчику не найдено</div>';
  }
  const cols = [
    ['Корпус', 'Корпус', false],
    ['Этаж начало бюджет', 'Этаж с', false],
    ['Этаж конец бюджет', 'Этаж по', false],
    ['Этажи включить', 'Включить', false],
    ['Этажи исключить', 'Исключить', false],
    ['Стоимость работ подрядчика, за ед', 'Работы за ед', true],
    ['Стоимость материалов подрядчика, за ед', 'Мат-лы за ед', true]
  ];
  return miniTable(cols, rows);
}

// Небольшая таблица деталей: cols = [[ключ, заголовок, денежная], ...].
function miniTable(cols, rows) {
  const head = '<tr>' + cols.map(c =>
    '<th' + (c[2] ? ' class="num"' : '') + '>' + escapeHtml(c[1]) + '</th>'
  ).join('') + '</tr>';
  const body = rows.map(r =>
    '<tr>' + cols.map(c => {
      const v = r[c[0]];
      const text = c[2] && typeof v === 'number' ? fmtInt(v) : fmtCell(v);
      return '<td' + (c[2] ? ' class="num"' : '') + '>' + escapeHtml(text) + '</td>';
    }).join('') + '</tr>'
  ).join('');
  return '<table class="inner mini"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

// Объёмы по этажам (вкладка «Объемы») — лениво, при первом заходе на вкладку.
async function loadVols() {
  state.volsStatus = 'loading';
  try {
    const url = GAS_URL + '?action=volumes&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.vols = json.vols || {};
    // Суммы по корпусам считаем один раз, чтобы таблица рисовалась мгновенно.
    state.volsTotals = new Map();
    Object.keys(state.vols).forEach(work => {
      const totals = {};
      Object.keys(state.vols[work]).forEach(corp => {
        totals[corp] = state.vols[work][corp].reduce((acc, p) => acc + p[1], 0);
      });
      state.volsTotals.set(work, totals);
    });
    state.volsStatus = 'ready';
  } catch (e) {
    state.volsStatus = 'error';
  }
  if (state.screen === 'volumes') {
    setStatus(state.volsStatus === 'error' ? 'Не удалось загрузить объёмы. Обновите страницу.' : '',
      state.volsStatus === 'error');
    if (state.volsStatus === 'ready') renderTable();
  }
}

/**
 * Вкладка «Бюджет» (04.08.2026): свод по «Поэтажка_работы» — статья бюджета
 * («Признак для бюджета основной», кол. L) -> сумма «Стоимость материалы + работа
 * для бюджета» (кол. AG). Считается на сервере (action=budget, кэш 6 часов),
 * сюда приходит готовый список [[статья, сумма], ...] по убыванию.
 */
async function loadBudget() {
  state.budgetStatus = 'loading';
  try {
    const url = GAS_URL + '?action=budget&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.budget = json.budget || [];
    state.budgetStatus = 'ready';
  } catch (e) {
    state.budgetStatus = 'error';
  }
  if (state.screen === 'budget') renderBudget();
}

function renderBudget() {
  const el = document.getElementById('budget-screen');
  if (state.budgetStatus === 'idle') loadBudget();
  if (state.budgetStatus !== 'ready') {
    el.innerHTML = '<div class="check-head">Бюджет</div><div class="side-note">' +
      (state.budgetStatus === 'error'
        ? 'Не удалось загрузить бюджет. Обновите страницу.'
        : 'Бюджет считается по поэтажке — на холодном кэше это до полуминуты…') + '</div>';
    return;
  }
  const rows = state.budget;
  const head = '<div class="check-head">Бюджет</div>' +
    '<div class="check-desc">Свод по «Поэтажка_работы»: статья бюджета (признак для ' +
    'бюджета основной) и стоимость материалы + работа для бюджета</div>';
  if (!rows.length) {
    el.innerHTML = head + '<div class="side-note">Данных для свода не нашлось</div>';
    return;
  }
  const total = rows.reduce((acc, r) => acc + r[1], 0);
  const table = '<table class="check budget"><thead><tr>' +
    '<th>Статья бюджета</th><th class="num">Стоимость, руб</th></tr></thead><tbody>' +
    rows.map(r =>
      '<tr><td>' + escapeHtml(String(r[0])) + '</td>' +
      '<td class="num">' + escapeHtml(fmtInt(r[1])) + '</td></tr>'
    ).join('') + '</tbody><tfoot><tr><td>Итого</td>' +
    '<td class="num">' + escapeHtml(fmtInt(total)) + '</td></tr></tfoot></table>';
  el.innerHTML = head + table;
}

// Поэтажная ведомость по корпусам — модальное окно (вкладка «Объемы»).
function openVolModal(key, name) {
  const work = state.works.find(r => norm(r[WORK_KEY]) === key);
  const unit = String((work && work[UNIT_COL]) || '').trim();
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-sub').textContent =
    'Поэтажная ведомость' + (unit ? ' · объёмы в ' + unit : '');
  const byCorp = (state.vols && state.vols[key]) || {};
  const corps = ALL_CORPS;
  let html;
  const floorSet = new Set();
  corps.forEach(c => (byCorp[c] || []).forEach(p => floorSet.add(p[0])));
  if (!floorSet.size) {
    html = '<div class="side-note">Объёмы по этой работе в «Поэтажка_работы» не найдены</div>';
  } else {
    const floors = Array.from(floorSet).sort((a, b) => a - b);
    const volByCorpFloor = {};
    corps.forEach(c => {
      volByCorpFloor[c] = new Map((byCorp[c] || []).map(p => [p[0], p[1]]));
    });
    const head = '<tr><th>Этаж</th>' +
      corps.map(c => '<th class="num">' + escapeHtml(c) + '</th>').join('') + '</tr>';
    const body = floors.map(fl =>
      '<tr><td>' + escapeHtml(fmtCell(fl)) + '</td>' +
      corps.map(c => {
        const v = volByCorpFloor[c].get(fl);
        return '<td class="num">' + (v ? escapeHtml(fmtVol(v)) : '') + '</td>';
      }).join('') + '</tr>'
    ).join('');
    const foot = '<tr class="total"><td>Итого</td>' +
      corps.map(c => {
        const t = (byCorp[c] || []).reduce((acc, p) => acc + p[1], 0);
        return '<td class="num">' + (t ? escapeHtml(fmtVol(t)) : '') + '</td>';
      }).join('') + '</tr>';
    html = '<table class="inner mini vol-table"><thead>' + head + '</thead><tbody>' + body +
      '</tbody><tfoot>' + foot + '</tfoot></table>';
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}

/**
 * Проверка «Расценки работ» (просьба пользователя 04.08.2026): работы, у которых базовая
 * расценка отличается больше чем на 15% от средней по подрядчикам или по собственным силам.
 * Средние считаются по сводке «Поэтажка_работы» (state.floors: [подрядчик, корпус,
 * расценка за ед. в бюджет, признак СС]) — по всем ячейкам «подрядчик × корпус».
 * Отклонение = (базовая − средняя) / средняя. Сортировка — от самого большого отклонения.
 * Считается на странице, без запросов к серверу. null — сводка ещё не загружена.
 */
const DEV_LIMIT = 15;   // порог отклонения, %

function workRateChecks() {
  if (state.floorsStatus !== 'ready') return null;
  const out = [];
  state.works.forEach(w => {
    const base = typeof w[BASE_RATE_COL] === 'number' ? w[BASE_RATE_COL] : null;
    if (base === null) return;
    const key = norm(w[WORK_KEY]);
    const rows = (state.floors && state.floors[key]) || [];
    const cVals = [], sVals = [];
    rows.forEach(r => {
      if (typeof r[2] !== 'number') return;
      (r[3] ? sVals : cVals).push(r[2]);
    });
    const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
    const avgC = avg(cVals), avgS = avg(sVals);
    const dev = a => (a ? (base - a) / a * 100 : null);
    const devC = dev(avgC), devS = dev(avgS);
    const worst = Math.max(devC === null ? 0 : Math.abs(devC),
                           devS === null ? 0 : Math.abs(devS));
    if (worst <= DEV_LIMIT) return;
    const group = String(w[COL_GROUP] || '').trim() || NO_GROUP;
    out.push({ key, name: String(w[WORK_KEY] || ''), group, base, avgC, devC, avgS, devS, worst, rows });
  });
  out.sort((a, b) => b.worst - a.worst);
  return out;
}

// Отклонения — с одним знаком после запятой, чтобы порог 15% читался честно.
const fmtDev = v => new Intl.NumberFormat('ru-RU',
  { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Math.abs(v));

function renderCheckWorkRates() {
  const el = document.getElementById('check-screen');
  const list = workRateChecks();
  const title = '<div class="check-head">Отклонения расценок' +
    (list ? ': найдено — ' + list.length : '') + '</div>';
  if (list === null) {
    el.innerHTML = title + '<div class="side-note">' + (state.floorsStatus === 'error'
      ? 'Сводку по подрядчикам загрузить не удалось — обновите страницу.'
      : 'Сводка по подрядчикам ещё загружается — проверка появится через несколько секунд…') +
      '</div>';
    return;
  }
  const head = title +
    '<div class="check-desc">Базовая расценка отличается от средней по подрядчикам или ' +
    'собственным силам больше чем на ' + DEV_LIMIT + '% (отклонение — от средней; средние — ' +
    'по «Поэтажка_работы»). Клик по строке — все подрядчики с расценками.</div>';
  if (!list.length) {
    el.innerHTML = head + '<div class="side-note">Отклонений больше ' + DEV_LIMIT + '% нет</div>';
    return;
  }
  const devTxt = d => (d === null ? '' : (d > 0 ? '+' : '−') + fmtDev(d) + '%');
  const devCls = d => (d !== null && Math.abs(d) > DEV_LIMIT ? ' class="num dev-bad"' : ' class="num"');
  // Работы сгруппированы по «Группа работ» (просьба пользователя 04.08.2026).
  // Список уже отсортирован по отклонению, поэтому порядок групп — по худшему
  // отклонению внутри группы, работы внутри — тоже от большего к меньшему.
  const groups = [];
  const byGroup = new Map();
  list.forEach(it => {
    if (!byGroup.has(it.group)) {
      const g = { name: it.group, items: [] };
      byGroup.set(it.group, g);
      groups.push(g);
    }
    byGroup.get(it.group).items.push(it);
  });
  const rowHtml = it => {
    const open = state.checkOpen === it.key;
    let html = '<tr class="wrow' + (open ? ' open' : '') + '" data-key="' +
      escapeHtml(it.key) + '">' +
      '<td>' + escapeHtml(it.name) + '</td>' +
      '<td class="num">' + escapeHtml(fmtInt(it.base)) + '</td>' +
      '<td class="num">' + (it.avgC === null ? '' : escapeHtml(fmtInt(it.avgC))) + '</td>' +
      '<td' + devCls(it.devC) + '>' + escapeHtml(devTxt(it.devC)) + '</td>' +
      '<td class="num">' + (it.avgS === null ? '' : escapeHtml(fmtInt(it.avgS))) + '</td>' +
      '<td' + devCls(it.devS) + '>' + escapeHtml(devTxt(it.devS)) + '</td></tr>';
    if (open) html += '<tr class="wdetail"><td colspan="6">' + checkDetailHtml(it) + '</td></tr>';
    return html;
  };
  const table = '<table class="check"><thead><tr>' +
    '<th class="cw-name">Работа</th><th class="num">Баз. расценка</th>' +
    '<th class="num">Ср. подрядчики</th><th class="num">Откл.</th>' +
    '<th class="num">Ср. СС</th><th class="num">Откл.</th></tr></thead><tbody>' +
    groups.map(g => {
      // Группы можно сворачивать кликом по заголовку (просьба пользователя 04.08.2026).
      const closed = state.checkCollapsed.has(g.name);
      return '<tr class="sect" data-grp="' + escapeHtml(g.name) + '"><td colspan="6">' +
        '<span class="chev">' + (closed ? '&#9656;' : '&#9662;') + '</span> ' +
        escapeHtml(g.name) + ' <span class="cnt">' + g.items.length + '</span></td></tr>' +
        (closed ? '' : g.items.map(rowHtml).join(''));
    }).join('') + '</tbody></table>';
  el.innerHTML = head + table;
}

// Раскрытая строка проверки: все подрядчики и собственные силы по работе.
// Поэтажку схлопываем: один подрядчик с одной расценкой на нескольких корпусах — одна строка.
function checkDetailHtml(it) {
  const agg = new Map();
  it.rows.forEach(r => {
    if (typeof r[2] !== 'number') return;
    const k = (r[3] ? 1 : 0) + '|' + r[0] + '|' + r[2];
    if (!agg.has(k)) agg.set(k, { contr: r[0], ss: !!r[3], rate: r[2], corps: [] });
    agg.get(k).corps.push(r[1]);
  });
  const items = Array.from(agg.values());
  if (!items.length) {
    return '<div class="side-note">Подрядчики по этой работе в «Поэтажка_работы» не найдены</div>';
  }
  items.sort((a, b) => (a.ss !== b.ss ? (a.ss ? 1 : -1)
    : (a.contr.localeCompare(b.contr, 'ru') || a.rate - b.rate)));
  const corpsTxt = c => c.slice()
    .sort((x, y) => ALL_CORPS.indexOf(x) - ALL_CORPS.indexOf(y)).join(', ');
  const row = x => '<tr><td>' + escapeHtml(x.contr) + '</td>' +
    '<td>' + escapeHtml(corpsTxt(x.corps)) + '</td>' +
    '<td class="num">' + escapeHtml(fmtInt(x.rate)) + '</td></tr>';
  const sect = t => '<tr class="sect"><td colspan="3">' + t + '</td></tr>';
  const reg = items.filter(x => !x.ss), own = items.filter(x => x.ss);
  let body = reg.map(row).join('');
  if (own.length) body += sect('Собственные силы') + own.map(row).join('');
  return '<table class="inner mini"><thead><tr><th>Подрядчик</th><th>Корпуса</th>' +
    '<th class="num">Расценка</th></tr></thead><tbody>' + body + '</tbody></table>' +
    '<div class="side-sub" style="margin-top:4px">расценка за работу на ед. в бюджет, руб · ' +
    'базовая — ' + escapeHtml(fmtInt(it.base)) + ' руб</div>';
}

/**
 * Вопросы по работам (04.08.2026): кнопка «Вопрос» у работы -> модальное окно ->
 * POST на бэкенд (text/plain, обход CORS-preflight), хранение — JSON-файл на Google
 * Drive владельца скрипта (выбор пользователя). Статусы «Открыт»/«Закрыт», при любой
 * записи фиксируются автор и время. Имя пользователя запоминается в localStorage.
 */
async function postJson(payload) {
  payload.t = state.token;
  const resp = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  });
  const text = await resp.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error('сервер вернул не JSON');
  }
}

async function loadQuestions() {
  state.questionsStatus = 'loading';
  try {
    const url = GAS_URL + '?action=questions&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.questions = json.questions || [];
    state.questionsStatus = 'ready';
  } catch (e) {
    state.questionsStatus = 'error';
  }
  updateCheckBadges();
  if (state.screen === 'check-questions') renderCheckQuestions();
}

function openQuestionModal(workName) {
  document.getElementById('modal-title').textContent = 'Вопрос по работе';
  document.getElementById('modal-sub').textContent = workName;
  document.getElementById('modal-body').innerHTML =
    '<div class="q-form">' +
    '<label for="q-name">Ваше имя</label>' +
    '<input id="q-name" type="text" value="' + escapeHtml(state.userName) +
      '" placeholder="Кто спрашивает — попадёт в список вопросов">' +
    '<label for="q-text">Вопрос</label>' +
    '<textarea id="q-text" rows="4" placeholder="Текст вопроса"></textarea>' +
    '<div class="q-actions"><button id="q-send" type="button">Отправить</button>' +
    '<span id="q-err"></span></div></div>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('q-send').addEventListener('click', () => submitQuestion(workName));
  document.getElementById(state.userName ? 'q-text' : 'q-name').focus();
}

async function submitQuestion(work) {
  const name = document.getElementById('q-name').value.trim();
  const text = document.getElementById('q-text').value.trim();
  const err = document.getElementById('q-err');
  if (!name) { err.textContent = 'Укажите имя'; return; }
  if (!text) { err.textContent = 'Напишите вопрос'; return; }
  state.userName = name;
  try { localStorage.setItem('otdelka_user', name); } catch (e) {}
  const btn = document.getElementById('q-send');
  btn.disabled = true;
  err.textContent = 'Отправка…';
  try {
    const json = await postJson({ action: 'addQuestion', work, text, author: name });
    if (!json.ok) throw new Error(json.message || json.error);
    if (json.question) state.questions.push(json.question);
    updateCheckBadges();
    closeModal();
  } catch (e) {
    err.textContent = 'Не отправилось: ' + e.message + '. Попробуйте ещё раз.';
    btn.disabled = false;
  }
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderCheckQuestions() {
  const el = document.getElementById('check-screen');
  if (state.questionsStatus === 'idle') loadQuestions();
  if (state.questionsStatus === 'loading' || state.questionsStatus === 'idle') {
    el.innerHTML = '<div class="check-head">Вопросы</div>' +
      '<div class="side-note">Вопросы загружаются…</div>';
    return;
  }
  if (state.questionsStatus === 'error') {
    el.innerHTML = '<div class="check-head">Вопросы</div>' +

      'включена — владельцу нужно один раз запустить setupQuestions() в редакторе GAS ' +
      'и принять доступ к Диску. Потом обновите страницу.</div>';

  }
  const list = state.questions.slice().sort((a, b) =>
    ((a.status === 'Закрыт') - (b.status === 'Закрыт')) ||

  const openCnt = list.filter(q => q.status !== 'Закрыт').length;
  const head = '<div class="check-head">Вопросы: открытых — ' + openCnt +
    (list.length ? ' из ' + list.length : '') + '</div>' +

    '«Расценки». Клик по статусу переключает Открыт/Закрыт — фиксируется, кто и когда.</div>';
  if (!list.length) {
    el.innerHTML = head + '<div class="side-note">Вопросов пока нет</div>';
    return;
  }
  const table = '<table class="check qtab"><thead><tr>' +
    '<th class="c-st">Статус</th><th class="c-work">Работа</th><th>Вопрос</th>' +
    '<th class="c-auth">Автор</th><th class="c-date">Когда</th>' +
    '<th class="c-who">Статус менял</th></tr></thead><tbody>' +
    list.map(q => {
      const closed = q.status === 'Закрыт';
      return '<tr><td class="c-st"><button class="qstatus ' + (closed ? 'closed' : 'open') +
        '" type="button" data-id="' + escapeHtml(String(q.id)) + '">' +
        (closed ? 'Закрыт' : 'Открыт') + '</button></td>' +
        '<td>' + escapeHtml(String(q.work || '')) + '</td>' +
        '<td>' + escapeHtml(String(q.text || '')) + '</td>' +
        '<td>' + escapeHtml(String(q.author || '')) + '</td>' +
        '<td>' + escapeHtml(fmtDate(q.created)) + '</td>' +
        '<td>' + (q.statusBy
          ? escapeHtml(String(q.statusBy)) + ' · ' + escapeHtml(fmtDate(q.statusAt))
          : '') + '</td></tr>';
    }).join('') + '</tbody></table>';
  el.innerHTML = head + table;
}

async function toggleQuestionStatus(id) {
  let name = state.userName;
  if (!name) {
    name = (window.prompt('Ваше имя (фиксируется при смене статуса):') || '').trim();
    if (!name) return;
    state.userName = name;
    try { localStorage.setItem('otdelka_user', name); } catch (e) {}
  }
  const q = state.questions.find(x => String(x.id) === String(id));
  if (!q) return;
  const next = q.status === 'Закрыт' ? 'Открыт' : 'Закрыт';
  const prev = { status: q.status, statusBy: q.statusBy, statusAt: q.statusAt };
  // Optimistic UI: меняем сразу, при ошибке откатываем.
  q.status = next;
  q.statusBy = name;
  q.statusAt = new Date().toISOString();
  renderCheckQuestions();
  updateCheckBadges();
  try {
    const json = await postJson({ action: 'setQuestionStatus', id, status: next, author: name });
    if (!json.ok) throw new Error(json.message || json.error);
    if (json.question) Object.assign(q, json.question);
    renderCheckQuestions();
  } catch (e) {
    Object.assign(q, prev);
    renderCheckQuestions();
    updateCheckBadges();
    alert('Статус не сохранился: ' + e.message + '. Попробуйте ещё раз.');
  }
}

function updateCheckBadges() {
  document.getElementById('badge-check-rates').textContent =
    String(state.checkRates.length || '');
  const list = workRateChecks();
  document.getElementById('badge-check-work-rates').textContent =
    (list && list.length) ? String(list.length) : '';
  const openQ = state.questions.filter(q => q.status !== 'Закрыт').length;
  document.getElementById('badge-check-questions').textContent = openQ ? String(openQ) : '';
}

// имя вкладки -> функция отрисовки (новые проверки добавлять сюда).
const CHECK_SCREENS = {
  'check-rates': renderCheckRates,
  'check-work-rates': renderCheckWorkRates,
  'check-questions': renderCheckQuestions
};

function setScreen(screen) {
  if (state.screen === screen) return;
  state.screen = screen;
  document.querySelectorAll('.sb-item').forEach(el =>
    el.classList.toggle('active', el.dataset.screen === screen));

  const isCheck = !!CHECK_SCREENS[screen];
  const isBudget = screen === 'budget';
  document.querySelector('header').style.display = (isCheck || isBudget) ? 'none' : '';
  document.getElementById('check-screen').style.display = isCheck ? 'block' : 'none';
  document.getElementById('budget-screen').style.display = isBudget ? 'block' : 'none';
  if (isCheck || isBudget) {
    document.getElementById('pane-top').style.display = 'none';
    document.getElementById('pane-bottom').style.display = 'none';
    document.getElementById('status').style.display = 'none';
    if (isCheck) CHECK_SCREENS[screen]();
    else renderBudget();
    return;
  }

  if (screen === 'volumes' && state.volsStatus === 'idle') loadVols();
  if (screen === 'volumes' && state.volsStatus !== 'ready') {
    setStatus(state.volsStatus === 'error'
      ? 'Не удалось загрузить объёмы. Обновите страницу.' : 'Объёмы загружаются…',
      state.volsStatus === 'error');
    return;
  }
  setStatus('');
  if (state.works.length) renderTable();
}

});

// Таблица материалов для всплывающего окна.
function materialsHtml(list) {
  if (!list.length) {
    return '<div class="no-detail">Материалы для этой работы в листе «Расходы» не найдены</div>';
  }
  const valueOf = (col, row) => (col.calc ? col.calc(row) : row[col.key]);
  const numeric = DETAIL_COLS.map(col =>
    NUM_HINT.test(col.label) || typeof valueOf(col, list[0]) === 'number'
  );
  const money = DETAIL_COLS.map(col => MONEY_HINT.test(col.label));

  // Узкие колонки: числовые + помеченные fix (Ед. изм. материала, Слои).
  const clsOf = i => {
    const c = [];
    if (numeric[i]) c.push('num');
    if (DETAIL_COLS[i].fix) c.push('fixw');
    if (DETAIL_COLS[i].nar) c.push('narw');
    if (DETAIL_COLS[i].name) c.push('mname');
    return c.length ? ' class="' + c.join(' ') + '"' : '';
  };

  const head = '<tr>' + DETAIL_COLS.map((c, i) =>
    '<th' + clsOf(i) + '>' + escapeHtml(c.label) + '</th>'
  ).join('') + '</tr>';
  const body = list.map(row =>
    '<tr>' + DETAIL_COLS.map((col, i) =>
      '<td' + clsOf(i) + '>' + escapeHtml(fmtCell(valueOf(col, row), money[i])) + '</td>'
    ).join('') + '</tr>'
  ).join('');

  // Итог по стоимости материалов на единицу работы.
  const sumIdx = DETAIL_COLS.findIndex(c => c.key === SUM_COL);
  let foot = '';
  if (sumIdx !== -1) {
    const total = list.reduce((acc, row) => {
      const v = row[SUM_COL];
      return acc + (typeof v === 'number' ? v : 0);
    }, 0);
    foot = '<tr class="total">' + DETAIL_COLS.map((col, i) => {
      if (i === 0) return '<td>Итого материалов на ед. работы</td>';
      if (i === sumIdx) return '<td class="num">' + escapeHtml(fmtCell(total, true)) + '</td>';
      return '<td' + clsOf(i) + '></td>';
    }).join('') + '</tr>';
  }

  return '<table class="inner"><thead>' + head + '</thead><tbody>' + body +
    '</tbody><tfoot>' + foot + '</tfoot></table>';
}

// Клик по работе: подсветка строки + нижняя панель с подрядчиками.
function selectWork(tr) {
  state.selected = tr.dataset.key;
  state.selectedName = tr.dataset.name || '';
  document.querySelectorAll('tr.work.sel').forEach(el => el.classList.remove('sel'));
  tr.classList.add('sel');
  renderBottomPane();
}


function toggleGroup(name) {
  if (state.collapsed.has(name)) state.collapsed.delete(name);
  else state.collapsed.add(name);
  renderTable();
}

document.getElementById('tbody').addEventListener('click', e => {
  // Кнопка «Вопрос» — раньше выбора работы, чтобы клик не проваливался в строку.
  const qb = e.target.closest('button.qbtn');
  if (qb) {
    const trq = e.target.closest('tr.work');
    if (trq) openQuestionModal(trq.dataset.name || '');
    return;
  }
  const hdr = e.target.closest('tr.plc, tr.srf, tr.grp');
  if (hdr) { toggleGroup(hdr.dataset.grp); return; }
  const tr = e.target.closest('tr.work');
  if (!tr) return;
  // В «Объемах» клик по работе открывает поэтажную ведомость, в «Расценках» — выбор.
  if (state.screen === 'volumes') openVolModal(tr.dataset.key, tr.dataset.name || '');
  else selectWork(tr);
});

['f-group', 'f-place', 'f-surface'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const which = id === 'f-group' ? 'group' : (id === 'f-place' ? 'place' : 'surface');
    state.filters[which] = e.target.value;
    if (state.works.length) renderTable();
  });
});

document.getElementById('f-toggle-all').addEventListener('click', e => {
  const expandAll = state.collapsed.size > 0;
  state.collapsed = expandAll ? new Set() : new Set(allGroupKeys(groupWorks(state.works)));
  e.target.textContent = expandAll ? 'Свернуть все' : 'Развернуть все';
  if (state.works.length) renderTable();
});

document.getElementById('f-reset').addEventListener('click', () => {
  state.filters = { group: '', place: '', surface: '' };
  state.query = '';
  ['f-group', 'f-place', 'f-surface'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('search').value = '';
  if (state.works.length) renderTable();
});

function setStatus(text, isError) {
  const el = document.getElementById('status');
  el.style.display = text ? 'block' : 'none';
  el.textContent = text || '';
  el.className = isError ? 'error' : '';
  document.getElementById('pane-top').style.display = text ? 'none' : 'block';
  // Нижняя панель (подрядчики/материалы) — только на вкладке «Расценки».
  document.getElementById('pane-bottom').style.display =
    (text || state.screen !== 'rates') ? 'none' : 'block';
}

async function fetchWithRetry(url, attempts) {
  attempts = attempts || 3;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const resp = await fetch(url);
      const text = await resp.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error('Сервер вернул не JSON (возможно, ошибка доступа к таблице)');
      }
      return json;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw lastErr;
}

async function loadData() {
  setStatus('Загрузка данных...');
  try {
    const url = GAS_URL + '?action=load&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url);
    if (!json.ok) {
      if (json.error === 'unauthorized') {
        showGate('Неверный пароль');
        return;
      }
      setStatus('Ошибка загрузки: ' + (json.message || json.error), true);
      return;
    }
    state.works = json.works || [];
    state.byWork = buildIndex(json.expenses || []);
    state.contrRates = json.contrRates || [];
    state.ssRates = json.ssRates || [];
    state.ssMap = json.ssMap || [];
    state.checkRates = json.checkRates || [];
    // На старте все места и группы свёрнуты (решение пользователя 03.08.2026).
    state.collapsed = new Set(allGroupKeys(groupWorks(state.works)));
    state.unitByMaterial = new Map(
      (json.materials || [])
        .filter(m => norm(m['Материал']))
        .map(m => [norm(m['Материал']), String(m['Ед. изм'] || '').trim()])
    );
    setStatus('');
    fillFilters();
    renderTable();
    updateCheckBadges();
    loadFloors();      // сводка по подрядчикам — фоном, чтобы не тормозить открытие витрины
    loadQuestions();   // вопросы — тоже фоном: файл маленький, нужен бейдж-счётчик
  } catch (e) {
    setStatus('Не удалось связаться с сервером. Проверьте интернет и обновите страницу.', true);
  }
}

/**
 * Сводка «подрядчик × корпус» считается по листу «Поэтажка_работы» (25 тыс. строк) —
 * это ~25 сек на холодном кэше сервера, поэтому грузим её отдельно и не блокируем таблицу.
 * После загрузки обновляем нижнюю панель — «загружается…» сменится данными.
 */
async function loadFloors() {
  try {
    const url = GAS_URL + '?action=floors&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.floors = json.floors || {};
    state.floorsSS = json.ssNames || {};
    state.floorsStatus = 'ready';
  } catch (e) {
    state.floorsStatus = 'error';
  }
  renderBottomPane();
  // Проверка «Расценки работ» считается по этой сводке: обновляем бейдж,
  // а если пользователь уже на вкладке — и саму таблицу.
  updateCheckBadges();
  if (state.screen === 'check-work-rates') renderCheckWorkRates();
}

function showGate(err) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pwErr').textContent = err || '';
  localStorage.removeItem('otdelka_token');
}

function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

document.getElementById('pwBtn').addEventListener('click', submitPassword);
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

function submitPassword() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  state.token = pw;
  localStorage.setItem('otdelka_token', pw);
  showApp();
  loadData();
}

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    if (state.works.length) renderTable();
  }, 150);
});

if (state.token) {
  showApp();
  loadData();
} else {
  showGate();
}
</script>
</body>
