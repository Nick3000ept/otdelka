<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отделка — витрина расценок</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel2: #eef0f4;
    --border: #d7dbe3;
    --text: #1c2028;
    --text-dim: #6b7280;
    --accent: #2f6fed;
    --danger: #d92d2d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #gate {
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 320px; text-align: center;
  }
  #gate h1 { font-size: 18px; margin: 0 0 16px; }
  #gate input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 15px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
  }
  #gate button:disabled { opacity: .6; cursor: default; }
  #gate .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

  #app { display: none; height: 100%; flex-direction: column; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  .toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .hint { color: var(--text-dim); font-size: 12px; }

  .filters { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .flt { display: flex; align-items: center; gap: 6px; }
  .flt label { color: var(--text-dim); font-size: 12px; }
  .flt select {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; max-width: 260px;
  }
  #f-reset, #f-toggle-all {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  #f-reset:hover, #f-toggle-all:hover { color: var(--text); }
  .search-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #search {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; width: 260px;
  }
  #count { color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  main { flex: 1; overflow: auto; padding: 0 16px 16px; }
  /* table-layout: fixed — ширины колонок берутся ТОЛЬКО из заголовков и не зависят
     от того, какие строки сейчас раскрыты. Иначе столбцы скачут при разворачивании
     уровней (жалоба пользователя 03.08.2026). Все ширины заданы у th ниже. */
  table { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
  /* Всё по центру, кроме названия работы и локации (просьба пользователя 03.08.2026). */
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--panel); text-align: center;
    padding: 7px 8px; border-bottom: 2px solid var(--border); white-space: nowrap;
    color: var(--text-dim); font-weight: 600;
  }
  tbody td {
    padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  th.wname, td.wname, th.tags, td.tags { text-align: left; }

  /* Ширины колонок задаются только здесь (см. table-layout: fixed выше). */
  thead th { width: 96px; }
  thead th.chev-col { width: 8px; }
  thead th.wname { width: 38%; }
  thead th.tags { width: 200px; }
  thead th.volcell { width: 62px; }
  tbody tr.work { cursor: pointer; }
  tbody tr.work:hover { background: var(--panel2); }
  tbody tr.work.open { background: var(--panel2); }
  .num { text-align: center; font-variant-numeric: tabular-nums; }

  /* Служебная первая колонка (под пустой заголовок). Стрелки у всех уровней и у работы
     живут внутри ячейки с названием, поэтому здесь только узкий отступ. */
  td.chev-cell { padding: 0; overflow: visible; text-overflow: clip; }
  .cnt { color: var(--text-dim); font-size: 11px; }

  /* Место · поверхность · локация — тегами в одной ячейке. */
  td.tags { white-space: normal; overflow: visible; text-overflow: clip; }
  .tag {
    display: inline-block; margin: 1px 4px 1px 0; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel2); color: var(--text-dim); font-size: 12px; white-space: nowrap;
  }

  th.volcell, td.volcell { text-align: center; white-space: nowrap; }
  .check { color: #4ccf7a; font-size: 15px; }

  thead th.num { white-space: normal; }
  /* Во внутренней таблице узкие: числовые + Ед. изм. материала и Слои. */
  table.inner th.num, table.inner th.fixw { width: 84px; }
  table.inner th.fixw { white-space: normal; }
  table.inner th.mname { width: 460px; }

  /* Название работы — с переносом строк, без обрезки многоточием. */
  td.wname, th.wname {
    white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word;
  }

  /* Заголовки уровней дерева: место -> поверхность -> группа работ.
     Отступ задаётся только ячейке с названием (.gname), чтобы остальные колонки
     оставались на своих местах: 8 / 24 / 40px, работа — 56px (td.wname). */
  tbody tr.plc td, tbody tr.srf td, tbody tr.grp td {
    border-bottom: 1px solid var(--border);
    cursor: pointer; white-space: normal; max-width: none;
  }
  tbody tr.plc .chev, tbody tr.srf .chev, tbody tr.grp .chev {
    color: var(--accent); margin-right: 4px;
  }

  tbody tr.plc td {
    background: var(--panel2); border-top: 1px solid var(--border);
    padding: 9px 8px; font-weight: 700;
  }
  tbody tr.plc:hover td { background: #e2e5eb; }
  tbody tr.plc td.gname { padding-left: 8px; }

  tbody tr.srf td {
    background: #f2f4f7; padding: 7px 8px; font-weight: 650; font-size: 13px;
  }
  tbody tr.srf:hover td { background: #e8ebf0; }
  tbody tr.srf td.gname { padding-left: 24px; }

  tbody tr.grp td {
    background: #f9fafb; padding: 6px 8px; font-weight: 600; font-size: 13px;
  }
  tbody tr.grp:hover td { background: #eef0f4; }
  tbody tr.grp td.gname { padding-left: 40px; }

  /* Работа — четвёртый уровень, правее заголовка группы работ. */
  tbody tr.work td.wname { padding-left: 56px; }
  /* Итог по объёму в заголовке группы — в своих колонках, не рядом с названием. */
  td.gsum { font-weight: 600; color: var(--text); }
  /* Фиксированная раскладка: список материалов одинаков у всех работ и не «дышит». */
  table.inner {
    table-layout: fixed; width: 964px; max-width: 100%;
    margin: 10px 0 14px; border: 1px solid var(--border);
  }
  table.inner th {
    position: static; background: var(--panel2); color: var(--text-dim);
    font-size: 12px; padding: 5px 8px; border-bottom: 1px solid var(--border);
    text-align: center;
  }
  table.inner td {
    font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border);
    text-align: center;
  }
  /* Название материала — по левому краю, как и название работы. */
  table.inner th.mname, table.inner td.mname, table.inner tfoot td:first-child {
    text-align: left;
  }
  table.inner tbody tr:last-child td { border-bottom: none; }

  /* Экран: верхние 2/3 — дерево работ, нижняя треть — подрядчики выбранной работы. */
  main { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #pane-top { flex: 1 1 0; overflow: auto; padding: 0 16px; }
  #pane-bottom {
    flex: 0 0 33%; overflow: auto; padding: 10px 16px 16px;
    border-top: 2px solid var(--border); background: var(--panel);
  }
  .pane-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .pane-caption {
    font-size: 11px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .4px; white-space: nowrap;
  }
  .pane-work { font-size: 13px; font-weight: 600; color: var(--text); }
  .side-sub { display: block; font-weight: 400; color: var(--text-dim); font-size: 11px; }
  .side-note { font-size: 12px; color: var(--text-dim); padding: 12px 0; }

  /* Выбранная работа в дереве. */
  tbody tr.work { cursor: pointer; }
  tbody tr.work.sel td { background: #dbe7ff; }
  tbody tr.work:hover td { background: var(--panel2); }
  tbody tr.work.sel:hover td { background: #d0dffc; }

  /* Ссылка «показать материалы» в колонке базовой расценки материалов. */
  a.mat-link { color: var(--accent); text-decoration: underline; cursor: pointer; }
  a.mat-link:hover { text-decoration: none; }

  /* Всплывающее окно с материалами. */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 17, 21, .45);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    max-width: min(1040px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(15, 17, 21, .25);
  }
  .modal-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
  }
  .modal-title {
    font-size: 11px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .4px;
  }
  .modal-sub { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 2px; }
  #modal-close {
    border: 1px solid var(--border); background: var(--panel2); color: var(--text-dim);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; flex: none;
  }
  #modal-close:hover { color: var(--text); }
  #modal-body { padding: 4px 18px 16px; overflow: auto; }

  table.inner.contractors { width: auto; margin: 0; }
  table.inner.contractors th.cname, table.inner.contractors td.cname {
    width: 220px; text-align: left; white-space: normal;
  }
  table.inner.contractors th.ccorp, table.inner.contractors td.num { width: 46px; }
  table.inner.contractors td { font-size: 11px; }
  /* Разделитель «Собственные силы» внутри таблицы подрядчиков. */
  table.inner.contractors tr.sect td {
    background: var(--panel2); font-size: 11px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .4px; text-align: left; padding: 6px 8px;
  }
  table.inner tfoot td {
    font-size: 12px; padding: 6px 8px; font-weight: 600;
    background: var(--panel2); border-top: 1px solid var(--border);
  }
  .no-detail { color: var(--text-dim); font-size: 12px; padding: 10px 0 12px; }

  #status { padding: 40px; text-align: center; color: var(--text-dim); }
  #status.error { color: var(--danger); }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Отделка — витрина расценок</h1>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="pwBtn">Войти</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="toolbar">
      <h1>Отделка СБ3 — работы</h1>
      <span class="hint">Клик по работе — подрядчики внизу · клик по «Баз. расценка мат.» — материалы</span>
      <div class="search-wrap">
        <span id="count"></span>
        <input id="search" type="text" placeholder="Поиск...">
      </div>
    </div>
    <div class="filters">
      <span class="flt"><label for="f-group">Группа работ</label><select id="f-group"></select></span>
      <span class="flt"><label for="f-place">Место</label><select id="f-place"></select></span>
      <span class="flt"><label for="f-surface">Поверхность</label><select id="f-surface"></select></span>
      <button id="f-toggle-all" type="button">Развернуть все</button>
      <button id="f-reset" type="button">Сбросить</button>
    </div>
  </header>
  <main>
    <div id="status">Загрузка данных...</div>
    <!-- Верхняя треть: дерево работ. Нижние 2/3: подрядчики × корпуса выбранной работы. -->
    <div id="pane-top" style="display:none">
      <table id="table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="pane-bottom" style="display:none">
      <div class="pane-head">
        <span class="pane-caption">Подрядчики и собственные силы</span>
        <span id="ctr-work" class="pane-work"></span>
      </div>
      <div id="ctr-body"><div class="side-note">Выберите работу в списке выше</div></div>
    </div>
  </main>
</div>

<!-- Всплывающее окно с материалами работы -->
<div id="modal-overlay" style="display:none">
  <div id="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">Материалы</div>
        <div id="modal-work" class="modal-sub"></div>
      </div>
      <button id="modal-close" type="button" title="Закрыть (Esc)">&#10005;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyo6f-OGca1loM1aBXtHkcx7nq8tlJWBreGepxp0KTwq7GvDdDPKo-tuFjXQqKs1nZfdQ/exec';

// Колонки листа «Работы», которые на витрине не показываем (решение пользователя 03.08.2026).
const HIDDEN_COLS = [
  'Название работы СС',
  'ИД факт',
  'Признак для бюджета основной',
  'Признак для бюджета дополнительный',
  'Признак для бюджета дополнительный объем',
  'Признак Уровень 1 ДГП для увязки',
  'Материалы',
  'Место',        // не показываем: 1-й уровень группировки, значение в заголовке
  'Поверхность',  // не показываем: 2-й уровень группировки, значение в заголовке
  'Группа работ'  // не показываем: 3-й уровень группировки, значение в заголовке
];

// Колонка, по которой работа связывается с материалами из листа «Расходы».
const WORK_KEY = 'Название работы из АР';

// Колонки для группировки и фильтров.
const COL_GROUP = 'Группа работ';
const COL_PLACE = 'Место';
const COL_SURFACE = 'Поверхность';
// Список группируется в два уровня: Место -> Группа работ (решение пользователя 03.08.2026).
const NO_PLACE = '— без места —';
const NO_SURFACE = '— без поверхности —';
const NO_GROUP = '— без группы —';

// Раскрытый список материалов: что показываем и в каком порядке (решение пользователя
// 03.08.2026). Место, Тип работ, Объем работ и Объем материала не показываем.
const RUCH = 'Ручной расход';
const AVTO = 'Расход автомат';

function filled(v) {
  return v !== '' && v !== null && v !== undefined;
}

// fix: true — колонка той же узкой ширины, что и числовые (просьба пользователя 03.08.2026).
const DETAIL_COLS = [
  { label: 'Материалы', key: 'Материалы', name: true },
  // Единица измерения самого материала — из справочника «Материалы» по названию.
  { label: 'Ед. изм. материала', fix: true, calc: r => state.unitByMaterial.get(norm(r['Материалы'])) || '' },
  { label: 'Слои', key: 'Слои', fix: true },
  // Ручной расход имеет приоритет над автоматическим; своей колонки у него больше нет.
  { label: 'Расход', calc: r => (filled(r[RUCH]) ? r[RUCH] : r[AVTO]) },
  { label: 'Расход итого', key: 'Расход в рачет' },
  { label: 'Расценка', key: 'Расценка' },
  { label: 'Стоимость материала в ед работы', key: 'Стоимость материала в ед работы' }
];

// Колонка, по которой в раскрытом списке считается итог.
const SUM_COL = 'Стоимость материала в ед работы';

const state = {
  token: localStorage.getItem('otdelka_token') || '',
  works: [],
  byWork: new Map(),           // название работы -> строки листа «Расходы»
  unitByMaterial: new Map(),   // название материала -> ед. изм. из справочника «Материалы»
  floors: null,                // сводка подрядчик × корпус, грузится отдельным запросом
  floorsStatus: 'loading',     // loading | ready | error
  selected: null,              // ключ выбранной работы -> нижняя панель подрядчиков
  selectedName: '',
  query: '',
  filters: { group: '', place: '', surface: '' },
  collapsed: new Set()         // свёрнутые группы работ
};

// Клик по значению этой колонки открывает окно с материалами работы.
const MAT_RATE_COL = 'Стоимость материалов базовая, за ед';

const NUM_HINT = /(расценк|цена|стоимост|объем|объём|расход|процент)/i;
// Денежные колонки — всегда ровно 2 знака после запятой.
const MONEY_HINT = /(расценк|цена|стоимост|руб)/i;

// Локация показывается тегом в конце строки. Место и Группа работ туда не входят —
// они теперь заголовки уровней группировки (см. groupWorks).
const TAG_COLS = ['Локация'];
const TAG_LABEL = 'Локация';

// Работа участвует в расчёте генерального объёма, если этот признак заполнен
// (в колонке лежит не «да/нет», а название группы — 73 работы из 321).
const VOL_FLAG = 'Признак для бюджета дополнительный объем';
const VOL_LABEL = 'Ген. объем';

const VOL_COL = 'Объем работ';
const UNIT_COL = 'Ед. изм. работа';

function hasVolume(r) {
  return String(r[VOL_FLAG] === null || r[VOL_FLAG] === undefined ? '' : r[VOL_FLAG]).trim() !== '';
}

// Короткие заголовки колонок работ (решение пользователя 03.08.2026).
// Ключ — как в Sheets, значение — как показываем.
const RENAME = {
  'Базовая расценка работа в расчет, руб': 'Баз. расценка раб.',
  'Стоимость материалов базовая, за ед': 'Баз. расценка мат.',
  'Плановый процент переделки': '% переделки'
};

function norm(v) {
  return String(v === null || v === undefined ? '' : v).trim().toLowerCase();
}

function fmtCell(val, money) {
  if (typeof val === 'number') {
    return new Intl.NumberFormat('ru-RU', money
      ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
      : { maximumFractionDigits: 4 }
    ).format(val);
  }
  return val === null || val === undefined ? '' : String(val);
}

function isNumericColumn(key, rows) {
  if (NUM_HINT.test(key)) return true;
  return rows.length > 0 && typeof rows[0][key] === 'number';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Колонки, по которым идёт поиск (все непрятанные, включая источники тегов).
function searchKeys(rows) {
  if (!rows.length) return [];
  return Object.keys(rows[0]).filter(h => HIDDEN_COLS.indexOf(h) === -1);
}

// Колонки таблицы работ: обычные + одна собранная из Места/Поверхности/Локации.
function workColumns(rows) {
  if (!rows.length) return [];
  const cols = [];
  let hasTags = false;
  Object.keys(rows[0]).forEach(h => {
    if (HIDDEN_COLS.indexOf(h) !== -1) return;
    if (TAG_COLS.indexOf(h.trim()) !== -1) { hasTags = true; return; }
    cols.push({
      label: RENAME[h.trim()] || h,     // признаки «числовая»/«денежная» — по имени из Sheets
      key: h,
      num: isNumericColumn(h, rows),
      money: MONEY_HINT.test(h)
    });
    // Галочка «участвует в расчёте объёма» — сразу за названием работы.
    if (h === WORK_KEY) cols.push({ label: VOL_LABEL, vol: true });
  });
  // Место · поверхность · локация — последней колонкой.
  if (hasTags) cols.push({ label: TAG_LABEL, tags: true });
  return cols;
}

function cellHtml(col, r) {
  if (col.vol) {
    return '<td class="volcell">' + (hasVolume(r) ? '<span class="check">&#10003;</span>' : '') + '</td>';
  }
  if (col.tags) {
    const tags = TAG_COLS
      .map(k => String(r[k] === null || r[k] === undefined ? '' : r[k]).trim())
      .filter(v => v);
    return '<td class="tags">' +
      tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</td>';
  }
  // Название с отступом (лесенка иерархии); раскрытия больше нет, клик выбирает работу.
  if (col.key === WORK_KEY) {
    return '<td class="wname">' + escapeHtml(fmtCell(r[col.key], col.money)) + '</td>';
  }
  // Базовая расценка материалов — ссылка на всплывающее окно с материалами.
  if (col.key === MAT_RATE_COL) {
    const text = fmtCell(r[col.key], col.money);
    const hasMats = (state.byWork.get(norm(r[WORK_KEY])) || []).length > 0;
    if (!hasMats) return '<td class="num">' + escapeHtml(text) + '</td>';
    return '<td class="num"><a class="mat-link">' + (text ? escapeHtml(text) : 'материалы') + '</a></td>';
  }
  const cls = col.num ? ' class="num"' : '';
  return '<td' + cls + '>' + escapeHtml(fmtCell(r[col.key], col.money)) + '</td>';
}

function buildIndex(expenses) {
  const map = new Map();
  expenses.forEach(row => {
    const key = norm(row[WORK_KEY]);
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  });
  return map;
}

function passesFilters(r) {
  const f = state.filters;
  if (f.group && String(r[COL_GROUP] || '').trim() !== f.group) return false;
  if (f.place && String(r[COL_PLACE] || '').trim() !== f.place) return false;
  if (f.surface && String(r[COL_SURFACE] || '').trim() !== f.surface) return false;
  return true;
}

// Три уровня группировки: Место -> Поверхность -> Группа работ. Порядок — как в листе
// «Работы» (порядок таблицы осмыслен), не по алфавиту.
function groupWorks(rows) {
  const places = [];
  const byPlace = new Map();
  rows.forEach(r => {
    const placeName = String(r[COL_PLACE] || '').trim() || NO_PLACE;
    if (!byPlace.has(placeName)) {
      const p = { name: placeName, key: 'p:' + placeName, rows: [], surfaces: [], bySurface: new Map() };
      byPlace.set(placeName, p);
      places.push(p);
    }
    const p = byPlace.get(placeName);
    p.rows.push(r);

    const surfaceName = String(r[COL_SURFACE] || '').trim() || NO_SURFACE;
    if (!p.bySurface.has(surfaceName)) {
      const s = { name: surfaceName, key: p.key + '›s:' + surfaceName, rows: [], subgroups: [], byGroup: new Map() };
      p.bySurface.set(surfaceName, s);
      p.surfaces.push(s);
    }
    const s = p.bySurface.get(surfaceName);
    s.rows.push(r);

    const groupName = String(r[COL_GROUP] || '').trim() || NO_GROUP;
    if (!s.byGroup.has(groupName)) {
      const g = { name: groupName, key: s.key + '›g:' + groupName, rows: [] };
      s.byGroup.set(groupName, g);
      s.subgroups.push(g);
    }
    s.byGroup.get(groupName).rows.push(r);
  });

  // Итог по объёму — только на уровне «Группа работ» (решение пользователя 03.08.2026):
  // сумма `Объем работ` по работам с признаком ген. объёма. Считаем раздельно по единицам
  // измерения: сейчас внутри групп они однородны, но при изменении данных м2 и м.п.
  // не должны молча сложиться в одно число.
  places.forEach(p => p.surfaces.forEach(s => s.subgroups.forEach(g => {
    const flagged = g.rows.filter(hasVolume);
    g.flagged = flagged.length;
    const byUnit = new Map();
    flagged.forEach(r => {
      const u = String(r[UNIT_COL] || '').trim();
      const v = typeof r[VOL_COL] === 'number' ? r[VOL_COL] : 0;
      byUnit.set(u, (byUnit.get(u) || 0) + v);
    });
    g.volParts = Array.from(byUnit.entries());
  })));

  return places;
}

// Плоский список всех ключей группировки (мест, поверхностей, подгрупп) — нужен
// для «свернуть/развернуть всё» и для стартового состояния (всё свёрнуто).
function allGroupKeys(places) {
  const keys = [];
  places.forEach(p => {
    keys.push(p.key);
    p.surfaces.forEach(s => {
      keys.push(s.key);
      s.subgroups.forEach(g => keys.push(g.key));
    });
  });
  return keys;
}

function renderTable() {
  const rows = state.works;
  const cols = workColumns(rows);
  const keys = searchKeys(rows);
  const q = state.query.trim().toLowerCase();
  const filtered = rows.filter(r =>
    passesFilters(r) && (!q || keys.some(h => String(r[h]).toLowerCase().includes(q)))
  );
  // Выбранная работа исчезла из отфильтрованного списка — снимаем выбор,
  // иначе внизу висели бы данные работы, которой на экране нет.
  if (state.selected && !filtered.some(r => norm(r[WORK_KEY]) === state.selected)) {
    state.selected = null;
    state.selectedName = '';
    renderBottomPane();
  }

  const places = groupWorks(filtered);
  let surfaceCount = 0, groupCount = 0;
  places.forEach(p => {
    surfaceCount += p.surfaces.length;
    p.surfaces.forEach(s => { groupCount += s.subgroups.length; });
  });

  document.getElementById('count').textContent =
    filtered.length + ' из ' + rows.length + ' · мест: ' + places.length +
    ' · поверхностей: ' + surfaceCount + ' · групп: ' + groupCount;

  const theadRow = document.getElementById('thead-row');
  theadRow.innerHTML = '<th class="chev-col"></th>' + cols.map(c => {
    const cls = c.num ? ' class="num"'
      : c.vol ? ' class="volcell"'
      : c.tags ? ' class="tags"'
      : (c.key === WORK_KEY ? ' class="wname"' : '');
    return '<th' + cls + '>' + escapeHtml(c.label) + '</th>';
  }).join('');

  // Плоский список того, что рисуем: место -> поверхность -> группа работ -> работы,
  // каждый следующий уровень рисуется только если предыдущий развёрнут.
  const items = [];
  places.forEach(p => {
    items.push({ type: 'place', node: p });
    if (state.collapsed.has(p.key)) return;
    p.surfaces.forEach(s => {
      items.push({ type: 'surface', node: s });
      if (state.collapsed.has(s.key)) return;
      s.subgroups.forEach(g => {
        items.push({ type: 'group', node: g });
        if (!state.collapsed.has(g.key)) {
          g.rows.forEach(r => items.push({ type: 'row', row: r }));
        }
      });
    });
  });

  const colspan = cols.length + 1;
  const CHUNK = 300;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let i = 0;
  function renderChunk() {
    const frag = document.createDocumentFragment();
    const end = Math.min(i + CHUNK, items.length);
    for (; i < end; i++) {
      const it = items[i];
      const tr = document.createElement('tr');
      if (it.type === 'place' || it.type === 'surface' || it.type === 'group') {
        const n = it.node;
        const open = !state.collapsed.has(n.key);
        tr.className = it.type === 'place' ? 'plc' : (it.type === 'surface' ? 'srf' : 'grp');
        tr.dataset.grp = n.key;

        // Сумма объёма — только у групп работ и только по работам с галочкой ген. объёма.
        // Показываем её в колонке «Объем работ», единицу — в колонке «Ед. изм. работа»
        // (просьба пользователя 03.08.2026). Если единиц несколько — всё в колонке объёма.
        const parts = (it.type === 'group' && n.flagged) ? n.volParts : [];
        const oneUnit = parts.length === 1;
        const volText = parts.length
          ? (oneUnit
              ? fmtCell(parts[0][1], true)
              : parts.map(([u, v]) => fmtCell(v, true) + (u ? ' ' + u : '')).join(' + '))
          : '';
        const unitText = oneUnit ? parts[0][0] : '';

        const label = '<span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
          escapeHtml(n.name) + ' <span class="cnt">' + n.rows.length + '</span>';

        tr.innerHTML = '<td class="chev-cell"></td>' + cols.map(c => {
          if (c.key === WORK_KEY) return '<td class="wname gname">' + label + '</td>';
          if (volText && c.key === VOL_COL) return '<td class="num gsum">' + escapeHtml(volText) + '</td>';
          if (unitText && c.key === UNIT_COL) return '<td class="gsum">' + escapeHtml(unitText) + '</td>';
          return '<td' + (c.num ? ' class="num"' : (c.vol ? ' class="volcell"' : '')) + '></td>';
        }).join('');
      } else {
        const r = it.row;
        const key = norm(r[WORK_KEY]);
        tr.className = key === state.selected ? 'work sel' : 'work';
        tr.dataset.key = key;
        tr.dataset.name = String(r[WORK_KEY] || '');
        tr.innerHTML = '<td class="chev-cell"></td>' + cols.map(c => cellHtml(c, r)).join('');
      }
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    if (i < items.length) requestAnimationFrame(renderChunk);
  }
  renderChunk();
}

function fillSelect(id, key) {
  const sel = document.getElementById(id);
  const prev = sel.value;
  const vals = Array.from(new Set(
    state.works.map(r => String(r[key] || '').trim()).filter(v => v)
  )).sort((a, b) => a.localeCompare(b, 'ru'));
  sel.innerHTML = '<option value="">Все</option>' +
    vals.map(v => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join('');
  if (vals.indexOf(prev) !== -1) sel.value = prev;
}

function fillFilters() {
  fillSelect('f-group', COL_GROUP);
  fillSelect('f-place', COL_PLACE);
  fillSelect('f-surface', COL_SURFACE);
}

/**
 * Сводная «подрядчик × корпус» по одной работе.
 * Данные: state.floors[ключ работы] = [[подрядчик, корпус, расценка, признак СС], ...].
 * В ячейке — расценка за работу на единицу в бюджет (не сумма: складывать расценки нельзя).
 */
function contractorsHtml(workKey) {
  if (state.floorsStatus === 'loading') {
    return '<div class="side-note">Сводка по подрядчикам загружается…</div>';
  }
  if (state.floorsStatus === 'error') {
    return '<div class="side-note">Сводку по подрядчикам загрузить не удалось</div>';
  }
  const rows = (state.floors && state.floors[workKey]) || [];
  if (!rows.length) {
    return '<div class="side-note">Подрядчики по этой работе в «Поэтажка_работы» не найдены</div>';
  }

  // Корпуса — по номеру (К1, К2, … К12), а не по алфавиту.
  const corpNum = c => {
    const m = String(c).match(/\d+/);
    return m ? parseInt(m[0], 10) : 9999;
  };
  const corps = Array.from(new Set(rows.map(r => r[1])))
    .sort((a, b) => corpNum(a) - corpNum(b) || String(a).localeCompare(String(b), 'ru'));

  // Два блока: обычные подрядчики и «Собственные силы» (строки с заполненной
  // «Расценка СС работа»). У одного подрядчика бывают и те, и другие расценки
  // (напр. Смирнов) — тогда его ячейки расходятся по обоим блокам.
  const regular = new Map(), own = new Map();
  rows.forEach(([contr, corp, rate, ss]) => {
    const map = ss ? own : regular;
    if (!map.has(contr)) map.set(contr, new Map());
    map.get(contr).set(corp, rate);
  });

  const head = '<tr><th class="cname">Подрядчик</th>' +
    corps.map(c => '<th class="ccorp">' + escapeHtml(c) + '</th>').join('') + '</tr>';

  // Расценки в сводной — целыми рублями, без копеек (решение пользователя 03.08.2026).
  const fmtInt = v => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(v);
  const rowsOf = map => Array.from(map.keys())
    .sort((a, b) => a.localeCompare(b, 'ru'))
    .map(name => {
      const cells = map.get(name);
      return '<tr><td class="cname">' + escapeHtml(name) + '</td>' +
        corps.map(corp => {
          const v = cells.get(corp);
          return '<td class="num">' + (v === undefined ? '' : escapeHtml(fmtInt(v))) + '</td>';
        }).join('') + '</tr>';
    }).join('');

  const sect = title =>
    '<tr class="sect"><td colspan="' + (corps.length + 1) + '">' + title + '</td></tr>';

  let body = rowsOf(regular);
  if (own.size) body += sect('Собственные силы') + rowsOf(own);

  return '<div class="side-sub" style="margin-bottom:6px">расценка за работу на ед. в бюджет, руб</div>' +
    '<table class="inner contractors"><thead>' + head + '</thead><tbody>' + body +
    '</tbody></table>';
}

// Нижняя панель (2/3 экрана): подрядчики × корпуса выбранной работы.
function renderBottomPane() {
  const title = document.getElementById('ctr-work');
  const bodyEl = document.getElementById('ctr-body');
  if (!state.selected) {
    title.textContent = '';
    bodyEl.innerHTML = '<div class="side-note">Выберите работу в списке выше</div>';
    return;
  }
  title.textContent = state.selectedName;
  bodyEl.innerHTML = contractorsHtml(state.selected);
}

// Таблица материалов для всплывающего окна.
function materialsHtml(list) {
  if (!list.length) {
    return '<div class="no-detail">Материалы для этой работы в листе «Расходы» не найдены</div>';
  }
  const valueOf = (col, row) => (col.calc ? col.calc(row) : row[col.key]);
  const numeric = DETAIL_COLS.map(col =>
    NUM_HINT.test(col.label) || typeof valueOf(col, list[0]) === 'number'
  );
  const money = DETAIL_COLS.map(col => MONEY_HINT.test(col.label));

  // Узкие колонки: числовые + помеченные fix (Ед. изм. материала, Слои).
  const clsOf = i => {
    const c = [];
    if (numeric[i]) c.push('num');
    if (DETAIL_COLS[i].fix) c.push('fixw');
    if (DETAIL_COLS[i].name) c.push('mname');
    return c.length ? ' class="' + c.join(' ') + '"' : '';
  };

  const head = '<tr>' + DETAIL_COLS.map((c, i) =>
    '<th' + clsOf(i) + '>' + escapeHtml(c.label) + '</th>'
  ).join('') + '</tr>';
  const body = list.map(row =>
    '<tr>' + DETAIL_COLS.map((col, i) =>
      '<td' + clsOf(i) + '>' + escapeHtml(fmtCell(valueOf(col, row), money[i])) + '</td>'
    ).join('') + '</tr>'
  ).join('');

  // Итог по стоимости материалов на единицу работы.
  const sumIdx = DETAIL_COLS.findIndex(c => c.key === SUM_COL);
  let foot = '';
  if (sumIdx !== -1) {
    const total = list.reduce((acc, row) => {
      const v = row[SUM_COL];
      return acc + (typeof v === 'number' ? v : 0);
    }, 0);
    foot = '<tr class="total">' + DETAIL_COLS.map((col, i) => {
      if (i === 0) return '<td>Итого материалов на ед. работы</td>';
      if (i === sumIdx) return '<td class="num">' + escapeHtml(fmtCell(total, true)) + '</td>';
      return '<td' + clsOf(i) + '></td>';
    }).join('') + '</tr>';
  }

  return '<table class="inner"><thead>' + head + '</thead><tbody>' + body +
    '</tbody><tfoot>' + foot + '</tfoot></table>';
}

// Клик по работе: подсветка строки + нижняя панель с подрядчиками.

function setStatus(text, isError) {
  const el = document.getElementById('status');
  el.style.display = text ? 'block' : 'none';
  el.textContent = text || '';
  el.className = isError ? 'error' : '';
  document.getElementById('pane-top').style.display = text ? 'none' : 'block';
  document.getElementById('pane-bottom').style.display = text ? 'none' : 'block';
}

async function fetchWithRetry(url, attempts) {
  attempts = attempts || 3;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const resp = await fetch(url);
      const text = await resp.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error('Сервер вернул не JSON (возможно, ошибка доступа к таблице)');
      }
      return json;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw lastErr;
}

async function loadData() {
  setStatus('Загрузка данных...');
  try {
    const url = GAS_URL + '?action=load&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url);
    if (!json.ok) {
      if (json.error === 'unauthorized') {
        showGate('Неверный пароль');
        return;
      }
      setStatus('Ошибка загрузки: ' + (json.message || json.error), true);
      return;
    }
    state.works = json.works || [];
    state.byWork = buildIndex(json.expenses || []);
    // На старте все места и группы свёрнуты (решение пользователя 03.08.2026).
    state.collapsed = new Set(allGroupKeys(groupWorks(state.works)));
    state.unitByMaterial = new Map(
      (json.materials || [])
        .filter(m => norm(m['Материал']))
        .map(m => [norm(m['Материал']), String(m['Ед. изм'] || '').trim()])
    );
    setStatus('');
    fillFilters();
    renderTable();
    loadFloors();   // сводка по подрядчикам — фоном, чтобы не тормозить открытие витрины
  } catch (e) {
    setStatus('Не удалось связаться с сервером. Проверьте интернет и обновите страницу.', true);
  }
}

/**
 * Сводка «подрядчик × корпус» считается по листу «Поэтажка_работы» (25 тыс. строк) —
 * это ~25 сек на холодном кэше сервера, поэтому грузим её отдельно и не блокируем таблицу.
 * После загрузки обновляем нижнюю панель — «загружается…» сменится данными.
 */
async function loadFloors() {
  try {
    const url = GAS_URL + '?action=floors&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.floors = json.floors || {};
    state.floorsStatus = 'ready';
  } catch (e) {
    state.floorsStatus = 'error';
  }
  renderBottomPane();
}

function submitPassword() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  state.token = pw;
  localStorage.setItem('otdelka_token', pw);
  showApp();
  loadData();
}

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    if (state.works.length) renderTable();
  }, 150);
});

if (state.token) {
  showApp();
  loadData();
} else {
  showGate();
}
</script>
</body>
</html>
