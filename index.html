            '<td class="num bsep">' + (redo ? escapeHtml(fmtCell(redo)) : '') + '</td>' +
            redoTd(sumsR[wi]) + '</tr>';
          if (wOpen) {
            const ssOnly = cellsW.length > 0 && cellsW.every(c => String(c[1]) === 'СС');
            h += '<tr class="bdetail" data-bi="' + i + '" data-wi="' + wi +
              '"><td colspan="' + (4 + (hasRedo ? 1 : 0) + (hasSplit ? 2 : 0) +
              (hasBase ? 1 : 0) + (hasFactSplit ? 2 : 0) +
              (hasFact ? 1 : 0) + (hasLk ? 1 : 0) + (hasKp ? 1 : 0)) + '">' +
              (ssOnly ? budgetSSHtml(w) : budgetWorkHtml(w)) + '</td></tr>';
          }
          return h;
        };
        const grps = [];
        const byG = new Map();
        works.forEach((w, wi) => {
          if ((active || q) && !sums[wi]) return;   // не прошла фильтры — скрываем
          const g = String(w[3] || '— без группы —');
          if (!byG.has(g)) {
            const o = { name: g, total: 0, totalB: 0, totalR: 0, totalW: 0, totalF: 0, totalFW: 0, totalFM: 0, items: [] };
            byG.set(g, o);
            grps.push(o);
          }
          const o = byG.get(g);
          o.total += sums[wi];
          o.totalB += sumsB[wi];
          o.totalR += sumsR[wi];
          o.totalW += sumsW[wi];
          o.totalF += sumsF[wi];
          o.totalFW += sumsFW[wi];
          o.totalFM += sumsFM[wi];
          o.items.push([w, wi]);
        });
        grps.sort((a, b) => b.total - a.total);
        html += grps.map(g => {
          const gKey = i + '|' + g.name;
          // Базовый экран (просьба 25.08.2026): при раскрытии статьи группы
          // СВЕРНУТЫ, работы видны только после клика; поиск раскрывает сам.
          const gOpen = q ? true : state.budgetGrpOpen.has(gKey);
          let h = '<tr class="bgrp' + ic + '" data-bi="' + i + '" data-grp="' + escapeHtml(g.name) +
            '"><td><span class="chev">' + (gOpen ? '&#9662;' : '&#9656;') + '</span> ' +
            escapeHtml(g.name) + ' <span class="cnt">' + g.items.length + '</span></td>' +
            '<td class="num"></td>' + splitTd(g.total, g.totalW) +
            '<td class="num">' + escapeHtml(fmtInt(g.total)) + '</td>' + baseTd(g.totalB) +
            factSplitTd(g.totalFW, g.totalFM) + factTd(g.totalF) + lkTd(0) + kpTd(0) +
            '<td class="num bsep"></td>' + redoTd(g.totalR) + '</tr>';
          if (gOpen) {
            // Подгруппы-поверхности (паркинг, 25.08.2026): у работ паркинга
            // бэкенд отдаёт поверхность в w[4] (Полы/Стены/Потолок…) — работы
            // группируются вложенным уровнем. У остальных статей w[4] нет —
            // рисуются как раньше, плоским списком.
            const hasSub = g.items.some(p => String(p[0][4] || ''));
            if (!hasSub) {
              h += g.items.map(p => workRowHtml(p[0], p[1])).join('');
            } else {
              const subs = [];
              const byS = new Map();
              g.items.forEach(p => {
                const s = String(p[0][4] || '— прочее —');
                if (!byS.has(s)) {
                  const o = { name: s, items: [] };
                  byS.set(s, o);
                  subs.push(o);
                }
                byS.get(s).items.push(p);
              });
              const subTot = (o, arr) => o.items.reduce((a, p) => a + arr[p[1]], 0);
              subs.sort((a, b) => subTot(b, sums) - subTot(a, sums));
              h += subs.map(sg => {
                const sKey = i + '|' + g.name + '|' + sg.name;
                const sOpen = q ? true : state.budgetSubOpen.has(sKey);
                let sh = '<tr class="bgrp bsub' + ic + '" data-bi="' + i + '" data-grp="' +
                  escapeHtml(g.name) + '" data-sub="' + escapeHtml(sg.name) +
                  '"><td><span class="chev">' + (sOpen ? '&#9662;' : '&#9656;') + '</span> ' +
                  escapeHtml(sg.name) + ' <span class="cnt">' + sg.items.length + '</span></td>' +
                  '<td class="num"></td>' + splitTd(subTot(sg, sums), subTot(sg, sumsW)) +
                  '<td class="num">' + escapeHtml(fmtInt(subTot(sg, sums))) + '</td>' +
                  baseTd(subTot(sg, sumsB)) +
                  factSplitTd(subTot(sg, sumsFW), subTot(sg, sumsFM)) +
                  factTd(subTot(sg, sumsF)) + lkTd(0) + kpTd(0) +
                  '<td class="num bsep"></td>' + redoTd(subTot(sg, sumsR)) + '</tr>';
                if (sOpen) sh += sg.items.map(p => workRowHtml(p[0], p[1], true)).join('');
                return sh;
              }).join('');
            }
          }
          return h;
        }).join('');
      }
      return { html, t: { sum: rSum, b: rSumB, r: rSumR, w: rSumW, f: rSumF,
        fw: rSumFW, fm: rSumFM, lk: lkByItem[norm(String(r[0]))] || 0,
        kp: kpByItem[norm(String(r[0]))] || 0 } };
      };
      // Секции статей (просьба 25.08.2026): «Квартиры» — статьи с MR Base,
      // «МОП» — статьи «СБ3 - МОП - …»; остальные (Паркинг, Лобби, СС Шамова,
      // НР) — отдельными строками, как были. Секции сворачиваются, по
      // умолчанию свернуты; суммы секции — по всем колонкам.
      const sectOf = nm => {
        const s = norm(String(nm));
        if (s.includes('mr base')) return 'Квартиры';
        if (s.includes('- моп -')) return 'МОП';
        return null;
      };
      const entries = [];
      const sectMap = new Map();
      order.forEach(pair => {
        // При галочке «Собственные силы» накладные расходы исключены (25.08.2026)
        if (state.budgetSS && String(pair[0][0]) === 'Накладные расходы') return;
        const sect = sectOf(pair[0][0]);
        if (!sect) { entries.push({ name: String(pair[0][0]), pair }); return; }
        if (!sectMap.has(sect)) {
          const o = { name: sect, items: [] };
          sectMap.set(sect, o);
          entries.push(o);
        }
        sectMap.get(sect).items.push(pair);
      });
      entries.sort((a, b) => {
        const bot = x => x.name === 'Накладные расходы';
        if (bot(a) !== bot(b)) return bot(a) ? 1 : -1;
        return a.name.localeCompare(b.name, 'ru');
      });
      return entries.map(en => {
        if (!en.items) {
          const one = renderItem(en.pair);
          return one ? one.html : '';
        }
        const parts = en.items.map(p => renderItem(p, true)).filter(Boolean);
        if (!parts.length) return '';   // по фильтрам в секции пусто
        const t = parts.reduce((a, x) => {
          Object.keys(x.t).forEach(k => { a[k] = (a[k] || 0) + x.t[k]; });
          return a;
        }, {});
        const sOpen = q ? true : state.budgetSectOpen.has(en.name);
        let h = '<tr class="bsect" data-sect="' + escapeHtml(en.name) + '"><td>' +
          '<span class="chev">' + (sOpen ? '&#9662;' : '&#9656;') + '</span> ' +
          escapeHtml(en.name) + ' <span class="cnt">' + parts.length + '</span></td>' +
          '<td class="num"></td>' + splitTd(t.sum, t.w) +
          '<td class="num">' + escapeHtml(fmtInt(t.sum)) + '</td>' + baseTd(t.b) +
          factSplitTd(t.fw, t.fm) + factTd(t.f) + lkTd(t.lk) + kpTd(t.kp) +
          '<td class="num bsep"></td>' + redoTd(t.r) + '</tr>';
        if (sOpen) h += parts.map(x => x.html).join('');
        return h;
      }).join('');
    })() + '</tbody><tfoot><tr><td>Итого</td>' +
    '<td class="num"></td>' + splitTd(total, totalW) +
    '<td class="num">' + escapeHtml(fmtInt(total)) + '</td>' + baseTd(totalB) +
    factSplitTd(totalFW, totalFM) + factTd(totalF) + lkTd(totalLk) + kpTd(totalKp) +
    '<td class="num bsep"></td>' + redoTd(totalR) +
    '</tr></tfoot></table>';
  el.innerHTML = head + table;
  alignBudgetHead();
}

/**
 * Вкладка «Аналитика» (26.08.2026): накопительная динамика «затраты —
 * поступления». Затраты — лист «МОРС» (факт платежей, месяц из «Даты
 * проводки»), поступления — месячные колонки закрытия у заказчика из «Формы
 * КП» (с кол. X). Бэкенд отдаёт список месяцев и словари статья -> {месяц:
 * сумма} (action=analytics, кэш 6 ч); накопительные линии строятся здесь.
 * С 27.08.2026 линия затрат одна — МОРС + ТУЗИО, под ней двухслойная заливка
 * (снизу МОРС, сверху ТУЗИО). График — рукописный SVG, без библиотек
 * (как весь проект).
 */
// Статьи, относящиеся к отделке (список пользователя 26.08.2026, скриншот из
// сводника) — только они входят в линии «Аналитики»; остальные статьи МОРС
// (фасады, монолит, инженерка и т.п.) отбрасываются. Сравнение после norm()
// с заменой длинного тире на дефис; статьи с началом «паркинг»/«лобби»
// проходят по префиксу (в «Форме КП» это «Паркинг - МОП - …»).
// Новая статья отделки в МОРС/КП — дописать сюда.
const AN_ITEMS = [
  'СБ3 - МОП - Стяжка', 'СБ3 - МОП - Чистовая отделка - ПОЛ', 'СБ3 - МОП - ГКЛ',
  'СБ3 - МОП - Двери, люки', 'СБ3 - МОП - Декоративные элементы',
  'СБ3 - МОП - Чистовая отделка - СТЕНЫ', 'СБ3 - МОП - Чистовая отделка - ПОТОЛОК',
  'СБ3 - МОП - Штукатурка',
  'СБ3 - Отделка MR Base Стяжка', 'СБ3 - Отделка MR Base ГКЛ перегородки',
  'СБ3 - Отделка MR Base Шпатлевка стен', 'СБ3 - Отделка MR Base Штукатурка стен',
  'СБ3 - Отделка MR Base Грунтовка потолка',
  'Собственные силы факт на 01.08.2026 (табели и премии) почасовщики',
  'Собственные силы выше 0,000 план с 01.08. Почасовщики',
  'Затраты на сдельщиков', 'Собственные силы ниже 0,000. Почасовщики',
  'Содержание Овчинников', 'Содержание Смирнов', 'Содержание Джамал',
  'Содержание Элшод',
  'Отделка МОП', 'Отделка МОП (перенос)',
  'Отделка квартир MR Base', 'Отделка квартир MR Base (перенос)',
  'Содержание отделки',
  // Статьи свода «Бюджет», которых не было в списке (27.08.2026) — чтобы
  // «Прогнозный бюджет» в аналитике сходился с «Итого» вкладки «Бюджет».
  'Подсоба Шамов', 'Накладные расходы'
];
const anNorm = s => norm(s).replace(/–/g, '-');
const AN_SET = new Set(AN_ITEMS.map(anNorm));
const anMatch = name => {
  const k = anNorm(name);
  return AN_SET.has(k) || k.startsWith('паркинг') || k.startsWith('лобби');
};
// Ключ статьи для сопоставления МОРС ↔ КП: паркинг- и лобби-статьи схлопываются
// в одну строку «Паркинг»/«Лобби» (в «Форме КП» они разбиты: «Паркинг - МОП - …»).
const anKey = name => {
  const k = anNorm(name);
  if (k.startsWith('паркинг')) return 'паркинг';
  if (k.startsWith('лобби')) return 'лобби';
  return k;
};

async function loadAnalytics() {
  state.analyticsStatus = 'loading';
  try {
    const url = GAS_URL + '?action=analytics&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.analytics = json.analytics || null;
    state.analyticsStatus = 'ready';
  } catch (e) {
    state.analyticsStatus = 'error';
  }
  if (state.screen === 'analytics') renderAnalytics();
}

function renderAnalytics() {
  const el = document.getElementById('analytics-screen');
  if (state.analyticsStatus === 'idle') loadAnalytics();
  // Пояснительные подписи и комментарии убраны с экрана (просьба 27.08.2026) —
  // описание источников и подсказки живут в CLAUDE.md, на экране только данные.
  const head = '<div class="check-head">Аналитика</div>';
  if (state.analyticsStatus !== 'ready') {
    el.innerHTML = head + '<div class="side-note">' +
      (state.analyticsStatus === 'error'
        ? 'Не удалось загрузить данные. Обновите страницу.'
        : 'Данные считаются по «МОРС» и «Форме КП» — на холодном кэше это может занять до полуминуты…') +
      '</div>';
    return;
  }
  const a = state.analytics || {};
  const allMonths = a.months || [];
  let months = allMonths;
  if (!months.length) {
    el.innerHTML = head + '<div class="side-note">Данных пока нет — проверьте листы «МОРС» и «Форма КП».</div>';
    return;
  }
  // Помесячные суммы по статьям отделки (AN_ITEMS), затем накопительный итог.
  // Если в таблице ниже выбрана статья (state.anSel) — линии только по ней.
  const selK = state.anSel;
  const keyOk = it => anMatch(it) && (!selK || anKey(it) === selK);
  const sumSrc = src => {
    const keys = Object.keys(src || {}).filter(keyOk);
    return months.map(m => keys.reduce((acc, it) => acc + ((src[it] || {})[m] || 0), 0));
  };
  let costs = sumSrc(a.mors);
  let income = sumSrc(a.kp);
  // «ТУЗИО» (26.08.2026): тот же фильтр отделочных статей и выбранной статьи,
  // что у МОРС/КП. С 27.08 не отдельная линия, а часть общей линии затрат:
  // одна накопительная «МОРС + ТУЗИО», заливка под ней двумя слоями —
  // снизу доля МОРС, сверху доля ТУЗИО (просьба пользователя 27.08).
  let tuz = sumSrc(a.tuzio);
  const hasTuz = tuz.some(v => v);
  // Пустые месяцы в начале (до первых движений по отделке) не показываем.
  let start = 0;
  while (start < months.length - 1 && !costs[start] && !income[start] &&
         !(hasTuz && tuz[start])) start++;
  months = months.slice(start);
  costs = costs.slice(start);
  income = income.slice(start);
  tuz = tuz.slice(start);
  const cum = arr => { let s = 0; return arr.map(v => (s += v)); };
  const cCosts = cum(costs);
  const cIncome = cum(income);
  const cTuz = cum(tuz);
  // Общая линия затрат: накопительно МОРС + ТУЗИО.
  const cTotal = cCosts.map((v, i) => v + cTuz[i]);

  // Геометрия: график вписывается в ширину экрана без прокрутки (просьба 26.08.2026) —
  // шаг между месяцами считается от ширины контейнера, при resize перерисовка.
  const padL = 92, padR = 28, padT = 16, padB = 64, H = 440;
  const availW = Math.max(480, (el.clientWidth || 900) - 44);
  const stepX = Math.max(8, (availW - padL - padR) / Math.max(1, months.length - 1));
  const W = Math.round(padL + padR + stepX * Math.max(1, months.length - 1));
  const maxV = Math.max(cTotal[cTotal.length - 1], cIncome[cIncome.length - 1], 1) * 1.06;
  const x = i => padL + i * stepX;
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const fmtM = v => fmtInt(Math.round(v / 1e6)) + ' млн';
  const mLabel = m => m.slice(5) + '.' + m.slice(2, 4);

  // Горизонтальная сетка с «круглым» шагом.
  const rawStep = maxV / 5;
  const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const niceStep = [1, 2, 2.5, 5, 10].map(k => k * pow).find(s => s >= rawStep);
  let grid = '';
  for (let v = 0; v <= maxV; v += niceStep) {
    grid += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) +
      '" stroke="#e3e8ef"/>' +
      '<text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" ' +
      'fill="#667">' + fmtM(v) + '</text>';
  }

  // Выделение ряда кликом по легенде (просьба пользователя 27.08.2026):
  // state.anHl — 'cost' (общая линия затрат) | 'mors' | 'tuz' (заливки) |
  // 'in' (поступления); выбранный ряд ярче/толще, остальные приглушены.
  const hl = state.anHl;
  const lineOp = k => !hl ? 1 : (hl === k ? 1 : 0.22);
  const lineW = k => hl === k ? 4 : 2.5;
  const bandOp = k => !hl ? 0.16 : (hl === k ? 0.42 : 0.05);
  const line = (arr, color, w, op) =>
    '<polyline fill="none" stroke="' + color + '" stroke-width="' + (w || 2.5) +
    '" opacity="' + (op == null ? 1 : op) + '" points="' +
    arr.map((v, i) => x(i) + ',' + y(v)).join(' ') + '"/>';
  // Заливка между двумя накопительными рядами (27.08): полигон — верхняя
  // граница слева направо, затем нижняя справа налево.
  const band = (lowArr, highArr, color, op) => {
    const top = highArr.map((v, i) => x(i) + ',' + y(v));
    const bottom = lowArr.map((v, i) => x(i) + ',' + y(v)).reverse();
    return '<polygon fill="' + color + '" opacity="' + (op == null ? 0.16 : op) +
      '" stroke="none" points="' + top.concat(bottom).join(' ') + '"/>';
  };
  const zeros = months.map(() => 0);
  // Точки и подписи месяцев кликабельны (просьба 26.08.2026): клик выбирает
  // месяц — таблица «По статьям» и модалка «Платежи» показывают только его.
  const dotR = stepX < 22 ? 2.5 : 3.5;
  const dots = (arr, monthly, color, name) => arr.map((v, i) =>
    '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + dotR + '" fill="' + color +
    '" data-m="' + months[i] + '" style="cursor:pointer">' +
    '<title>' + name + ' на ' + mLabel(months[i]) + ': ' + fmtM(v) +
    ' (за месяц ' + fmtM(monthly[i]) + '). Клик — детали месяца в таблице ниже</title></circle>').join('');
  // Точки общей линии затрат — в подсказке разбивка месяца на МОРС и ТУЗИО.
  const dotsCost = cTotal.map((v, i) =>
    '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + dotR + '" fill="' + '#b42121' +
    '" data-m="' + months[i] + '" style="cursor:pointer">' +
    '<title>Затраты (МОРС + ТУЗИО) на ' + mLabel(months[i]) + ': ' + fmtM(v) +
    ' (за месяц ' + fmtM(costs[i] + tuz[i]) + ': МОРС ' + fmtM(costs[i]) +
    ', ТУЗИО ' + fmtM(tuz[i]) + '). Клик — детали месяца в таблице ниже</title></circle>').join('');
  // Подписи месяцев прореживаются, чтобы не налезали при сжатом шаге.
  const labelEvery = Math.max(1, Math.ceil(34 / stepX));
  let labels = '';
  months.forEach((m, i) => {
    if (i % labelEvery !== 0 && i !== months.length - 1) return;
    labels += '<text x="' + x(i) + '" y="' + (H - padB + 18) + '" text-anchor="end" ' +
      'font-size="10" fill="' + (state.anMonth === m ? '#1857b8' : '#667') + '" data-m="' + m +
      '" style="cursor:pointer" transform="rotate(-45 ' + x(i) + ' ' + (H - padB + 18) + ')">' +
      mLabel(m) + '</text>';
  });
  // Подсветка выбранного месяца — вертикальная полоса под линиями.
  const selMIdx = state.anMonth ? months.indexOf(state.anMonth) : -1;
  const selBand = selMIdx >= 0
    ? '<rect x="' + (x(selMIdx) - Math.min(12, stepX / 2)) + '" y="' + padT +
      '" width="' + Math.min(24, stepX) + '" height="' + (H - padT - padB) +
      '" fill="#8fb4e8" opacity="0.3"/>'
    : '';

  const COL_COST = '#b42121', COL_IN = '#1d7d38', COL_TUZ = '#1857b8';
  const svg = '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    grid + selBand +
    '<line x1="' + padL + '" y1="' + y(0) + '" x2="' + (W - padR) + '" y2="' + y(0) +
    '" stroke="#99a"/>' +
    band(zeros, cCosts, COL_COST, bandOp('mors')) +
    (hasTuz ? band(cCosts, cTotal, COL_TUZ, bandOp('tuz')) : '') +
    line(cTotal, COL_COST, lineW('cost'), lineOp('cost')) +
    line(cIncome, COL_IN, lineW('in'), lineOp('in')) +
    '<g opacity="' + lineOp('cost') + '">' + dotsCost + '</g>' +
    '<g opacity="' + lineOp('in') + '">' + dots(cIncome, income, COL_IN, 'Поступления') + '</g>' +
    labels + '</svg>';

  const tCost = cTotal[cTotal.length - 1];
  const tMors = cCosts[cCosts.length - 1];
  const tTuz = cTuz[cTuz.length - 1];
  const tIn = cIncome[cIncome.length - 1];
  const diff = tIn - tCost;
  // Элемент легенды кликабелен (27.08): клик выделяет свой ряд на графике,
  // повторный клик снимает выделение (обработчик по data-hl ниже).
  const leg = (k, dotStyle, text) =>
    '<span data-hl="' + k + '" title="Клик — выделить на графике" style="cursor:pointer' +
    (hl === k ? ';font-weight:700;text-decoration:underline' : (hl ? ';opacity:.45' : '')) +
    '"><span class="an-dot" style="' + dotStyle + '"></span>' + text + '</span>';
  const summary = '<div class="an-legend">' +
    leg('cost', 'background:' + COL_COST, 'Затраты (МОРС + ТУЗИО): ' + fmtM(tCost)) +
    leg('mors', 'background:' + COL_COST + ';opacity:.3', 'МОРС (нижняя заливка): ' + fmtM(tMors)) +
    (hasTuz ? leg('tuz', 'background:' + COL_TUZ + ';opacity:.3', 'ТУЗИО (верхняя заливка): ' + fmtM(tTuz)) : '') +
    leg('in', 'background:' + COL_IN, 'Поступления (Форма КП): ' + fmtM(tIn)) +
    '<span>Разница: <b style="color:' + (diff >= 0 ? COL_IN : COL_COST) + '">' +
    fmtM(diff) + '</b></span></div>';

  // Таблица «По статьям» (просьба 26.08.2026, вместо нечитаемых столбцов):
  // накопительные затраты (МОРС) и поступления (КП) по каждой статье с разницей.
  // Итоги — по ВСЕМ месяцам (независимо от выбранной статьи и обрезки). Пустая
  // ячейка = в этом источнике статьи нет — так видно корректность попадания.
  // Клик по строке — линии сверху перестраиваются только по этой статье.
  // Выбран месяц (клик по графику) — таблица за него, иначе за всё время.
  const tblMonths = state.anMonth ? [state.anMonth] : allMonths;
  const perItem = (src, mList) => {
    const out = new Map();   // anKey(статья) -> { name, total }
    Object.keys(src || {}).filter(anMatch).forEach(it => {
      const k = anKey(it);
      const nm = k === 'паркинг' ? 'Паркинг' : (k === 'лобби' ? 'Лобби' : it);
      if (!out.has(k)) out.set(k, { name: nm, total: 0 });
      const o = out.get(k);
      (mList || tblMonths).forEach(m => { o.total += (src[it] || {})[m] || 0; });
    });
    return out;
  };
  const morsItems = perItem(a.mors);
  const kpItems = perItem(a.kp);
  // Колонка ТУЗИО в разбивке по статьям (просьба пользователя 27.08.2026);
  // при выбранном месяце (tblMonths) — суммы ТУЗИО только за него.
  const tuzItems = perItem(a.tuzio);
  // «Прогнозный бюджет» по статьям (27.08.2026) — свод экрана «Бюджет»
  // (state.budget: [статья, сумма, работы]) без фильтров, паркинг/лобби
  // схлопнуты тем же anKey. «Остаток» = бюджет − МОРС − ТУЗИО, всегда по
  // накопительным затратам за всё время (даже при выбранном месяце — иначе
  // цифра теряет смысл). Свод ещё не загружен — колонки пустые, дорисуются.
  if (state.budgetStatus === 'idle') loadBudget();
  const budgetReady = state.budgetStatus === 'ready';
  const budItems = new Map();   // anKey -> сумма
  const budNames = new Map();   // anKey -> название (для статей только из бюджета)
  (budgetReady ? state.budget : []).forEach(r0 => {
    const nm = String(r0[0] || '');
    if (!anMatch(nm)) return;
    const k = anKey(nm);
    budItems.set(k, (budItems.get(k) || 0) + (r0[1] || 0));
    if (!budNames.has(k)) budNames.set(k, k === 'паркинг' ? 'Паркинг' : (k === 'лобби' ? 'Лобби' : nm));
  });
  const morsAll = state.anMonth ? perItem(a.mors, allMonths) : morsItems;
  const tuzAll = state.anMonth ? perItem(a.tuzio, allMonths) : tuzItems;
  // Статьи, которые есть только в бюджете (затрат ещё нет), тоже в таблице —
  // у них остаток равен всему прогнозу.
  const tRows = Array.from(new Set([...morsItems.keys(), ...tuzItems.keys(), ...kpItems.keys(),
                                    ...budItems.keys()]))
    .map(k => {
      const c = morsItems.get(k), t = tuzItems.get(k), p = kpItems.get(k);
      const bud = budItems.get(k) || 0;
      const cAll = morsAll.get(k), tAll = tuzAll.get(k);
      return { k, name: (c || t || p || { name: budNames.get(k) }).name, cost: c ? c.total : 0,
               tuz: t ? t.total : 0, inc: p ? p.total : 0, bud,
               rest: bud - (cAll ? cAll.total : 0) - (tAll ? tAll.total : 0) };
    });
  // Худшее отклонение (затраты сильнее всего превышают поступления) — сверху.
  // Затраты статьи с 27.08 — МОРС + ТУЗИО.
  const rowDiff = r0 => r0.inc - r0.cost - r0.tuz;
  tRows.sort((r1, r2) => rowDiff(r1) - rowDiff(r2));
  const sumOf = (rows, f) => rows.reduce((s, r0) => s + f(r0), 0);
  const totC = sumOf(tRows, r0 => r0.cost);
  const totT = sumOf(tRows, r0 => r0.tuz);
  const totI = sumOf(tRows, r0 => r0.inc);
  const totB = sumOf(tRows, r0 => r0.bud);
  const totR = sumOf(tRows, r0 => r0.rest);
  const nTd = v => '<td class="num">' + (v ? escapeHtml(fmtInt(Math.round(v))) : '') + '</td>';
  const dTd = d => '<td class="num" style="color:' + (d < 0 ? COL_COST : COL_IN) +
    ';font-weight:600">' + escapeHtml(fmtInt(Math.round(d))) + '</td>';
  // Остаток: пусто, пока бюджет не загружен или статьи в нём нет (нет прогноза —
  // нет и остатка); иначе цветом, как разница.
  const restTd = r0 => (budgetReady && budItems.has(r0.k)) ? dTd(r0.rest) : '<td class="num"></td>';
  const rowHtml = r0 =>
    '<tr class="anrow' + (selK === r0.k ? ' sel' : '') + '" data-key="' + escapeHtml(r0.k) + '">' +
    '<td>' + escapeHtml(r0.name) + '</td>' +
    nTd(r0.bud) + nTd(r0.cost) + nTd(r0.tuz) + restTd(r0) + nTd(r0.inc) +
    dTd(rowDiff(r0)) +
    '<td class="num">' + (r0.cost ? '<button type="button" class="anpay" data-key="' +
      escapeHtml(r0.k) + '" data-name="' + escapeHtml(r0.name) +
      '" title="Показать платежи МОРС по статье">Платежи</button>' : '') + '</td></tr>';
  // Статьи без поступлений — отдельным блоком внизу (просьба 26.08.2026):
  // по ним нет закрытия у заказчика, т.е. их нет в бюджете с заказчиком.
  const withInc = tRows.filter(r0 => r0.inc);
  const noInc = tRows.filter(r0 => !r0.inc);
  const noIncC = sumOf(noInc, r0 => r0.cost);
  const noIncT = sumOf(noInc, r0 => r0.tuz);
  const noIncB = sumOf(noInc, r0 => r0.bud);
  const noIncR = sumOf(noInc, r0 => r0.rest);
  const noIncBlock = noInc.length
    ? '<tr class="an-noinc"><td>Нет в бюджете с Заказчиком (' + noInc.length + ')</td>' +
      nTd(noIncB) + nTd(noIncC) + nTd(noIncT) +
      (budgetReady ? dTd(noIncR) : '<td class="num"></td>') +
      '<td class="num"></td>' + dTd(-noIncC - noIncT) + '<td></td></tr>' +
      noInc.map(rowHtml).join('')
    : '';
  const tbl = '<table class="check anitems"><thead><tr><th>Статья</th>' +
    '<th class="num">Прогнозный бюджет, руб</th>' +
    '<th class="num">Затраты (МОРС), руб</th><th class="num">ТУЗИО, руб</th>' +
    '<th class="num">Остаток, руб</th>' +
    '<th class="num">Поступления (КП), руб</th>' +
    '<th class="num">Разница, руб</th><th></th></tr></thead><tbody>' +
    withInc.map(rowHtml).join('') + noIncBlock +
    '</tbody><tfoot><tr><td>Итого</td>' + nTd(totB) + nTd(totC) + nTd(totT) +
    (budgetReady ? dTd(totR) : '<td class="num"></td>') + nTd(totI) +
    dTd(totI - totC - totT) + '<td></td></tr></tfoot></table>';
  const mTitle = state.anMonth ? mLabel(state.anMonth) : '';
  // При выбранном месяце оставлена только рабочая ссылка сброса — без комментариев.
  el.innerHTML = head + summary + '<div class="an-chart">' + svg + '</div>' +
    '<div class="check-head" style="margin-top:18px">По статьям (' +
    (mTitle ? 'за ' + mTitle : 'накопительно за всё время') + ')</div>' +
    (mTitle
      ? '<div class="check-desc"><span id="an-month-reset" ' +
        'style="color:var(--accent);cursor:pointer">показать всё время</span></div>'
      : '') +
    '<div class="bdetail-wrap">' + tbl + '</div>';
}

// Клик по строке таблицы статей «Аналитики» — линии только по этой статье
// (повторный клик по той же строке — снова все статьи). Кнопка «Платежи» —
// раньше строки, чтобы клик по ней не переключал выбор.
document.getElementById('analytics-screen').addEventListener('click', e => {
  const pb = e.target.closest('button.anpay');
  if (pb) { openAnPayments(pb.dataset.key, pb.dataset.name); return; }
  // Клик по элементу легенды — выделить ряд на графике (27.08.2026),
  // повторный клик по нему же — снять выделение.
  const hlEl = e.target.closest('[data-hl]');
  if (hlEl) {
    state.anHl = state.anHl === hlEl.dataset.hl ? null : hlEl.dataset.hl;
    renderAnalytics();
    return;
  }
  // Клик по точке/подписи месяца на графике — таблица за этот месяц (26.08.2026).
  const mEl = e.target.closest('[data-m]');
  if (mEl && mEl.dataset && mEl.dataset.m) {
    state.anMonth = state.anMonth === mEl.dataset.m ? null : mEl.dataset.m;
    renderAnalytics();
    return;
  }
  if (e.target.id === 'an-month-reset') {
    state.anMonth = null;
    renderAnalytics();
    return;
  }
  const tr = e.target.closest('tr.anrow');
  if (!tr) return;
  state.anSel = state.anSel === tr.dataset.key ? null : tr.dataset.key;
  renderAnalytics();
});

// Листовые виды ГКЛ сводятся в одну строку. Правило берётся ИЗ ТАБЛИЦЫ
// (уточнение пользователя 28.08.2026): объединяем всё, у чего в справочнике
// «Материалы» колонка «Тип материала» = ГКЛ — на 28.08 это ГКЛ 12.5, ГКЛВ 12.5,
// ГКЛ 9.5, ГВЛ 12.5, ГВЛ НГ 12.5. Состав меняется прямо в листе «Материалы»,
// код править не нужно. «Гипрок Файер» тип не проставлен — идёт отдельно.
const GKL_TYPE = 'гкл';
const GKL_TITLE = 'ГКЛ (все виды по типу материала)';
const isGkl = name => norm((state.typeByMaterial || new Map()).get(norm(name)) || '') === GKL_TYPE;
// Ключ материала для сведения списания и норм расхода: у ГКЛ — общий.
const matKey = name => isGkl(name) ? 'гкл-листы' : norm(name);
const matTitle = (key, name) => key === 'гкл-листы' ? GKL_TITLE : name;

// Материально ответственные — они же подрядчики собственных сил в поэтажке
// (те же имена, что в BUDGET_SS_CONTRS). Порядок — как просил пользователь.
const MOL_LIST = ['Овчинников', 'Смирнов', 'Джамал', 'Элшод'];

/**
 * Расшифровка материалов по листу «Расходы» (28.08.2026).
 * Для каждого материала — объём (норма расхода × объём работ), стоимость
 * («Стоимость материала в ед работы» × объём работ) и список работ, из которых
 * это сложилось. Объёмы работ можно взять не из «Расходов», а из бюджета по
 * конкретному подрядчику — тогда получается расчёт в разрезе МОЛ (volByWork).
 * Ключ материала — matKey, поэтому все виды ГКЛ сводятся в одну строку.
 * ⚠️ Названия колонок листа: «Расход в рачет» (кол. J, опечатка в заголовке),
 * «Объем работ» (L), «Стоимость материала в ед работы» (K), «Расценка» (I).
 */
function buildMaterialCalc(volByWork, factVolByWork) {
  const out = new Map();   // ключ -> { name, unit, vol, done, cost, works: [] }
  (state.expenses || []).forEach(row => {
    const name = String(row['Материалы'] || '').trim();
    if (!name) return;
    const work = String(row['Название работы из АР'] || '').trim();
    const rate = Number(row['Расход в рачет']);
    // Объём работ: из бюджета по МОЛ (если передан) либо из самого листа.
    const vol = volByWork ? (volByWork.get(norm(work)) || 0) : Number(row['Объем работ']);
    if (!rate || !vol || !isFinite(rate) || !isFinite(vol)) return;
    // Натурально выполнено (28.08.2026): та же норма расхода, но на ФАКТИЧЕСКИЙ
    // объём работ — «Объем к закрытию» (кол. Z поэтажки), cell[15] бюджета.
    const factVol = factVolByWork ? (factVolByWork.get(norm(work)) || 0) : 0;
    const priceUnit = Number(row['Стоимость материала в ед работы']) || 0;
    const price = Number(row['Расценка']) || 0;
    const k = matKey(name);
    if (!out.has(k)) {
      out.set(k, {
        name: matTitle(k, name),
        unit: (state.unitByMaterial && state.unitByMaterial.get(norm(name))) || '',
        vol: 0, done: 0, cost: 0, works: []
      });
    }
    const o = out.get(k);
    o.vol += rate * vol;
    o.done += rate * factVol;
    o.cost += priceUnit * vol;
    o.works.push({ work, rate, vol, price, matVol: rate * vol,
                   done: rate * factVol, cost: priceUnit * vol, name });
  });
  return out;
}

/**
 * Объёмы работ конкретного МОЛ (28.08.2026) — из свода бюджета: в каждой
 * ячейке [подрядчик, корпус, стоимость, объём, …], подрядчики собственных сил
 * совпадают по имени с МОЛ. Возвращает Map: norm(работа) -> объём.
 * Проверено 28.08: сумма объёмов ячеек работы = «Объем работ» листа «Расходы».
 */
function molWorkVolumes(mol, idx) {
  const out = new Map();
  const key = norm(mol);
  const at = idx === undefined ? 3 : idx;   // 3 — плановый объём, 15 — факт (Z)
  (state.budget || []).forEach(item => {
    (item[2] || []).forEach(w => {
      const wk = norm(String(w[0] || ''));
      if (!wk) return;
      (w[2] || []).forEach(c => {
        if (mol && norm(String(c[0] || '')) !== key) return;
        out.set(wk, (out.get(wk) || 0) + (c[at] || 0));
      });
    });
  });
  return out;
}

/** Фактически выполненный объём по всем работам (без разреза по МОЛ). */
function allFactVolumes() { return molWorkVolumes(null, 15); }

/**
 * Свод бюджета по статьям для одного МОЛ — по ячейкам с его именем.
 * Факт показываем ДВУМЯ колонками (просьба 28.08.2026):
 *  · «Факт (модель)» — «К оплате» из поэтажки (cell[6]), считает бэкенд;
 *  · «Факт (ЛК)» — лист «Личные_кабинеты» (МОЛ × статья -> выполнено итого),
 *    приходит в ответе budget как `lk`; сопоставление по имени МОЛ и статье.
 */
function molBudget(mol) {
  const key = norm(mol);
  // Факт из личных кабинетов: статья -> сумма по этому МОЛ.
  const lk = new Map();
  (state.budgetLk || []).forEach(r => {
    if (norm(String(r[0] || '')) !== key) return;
    const it = norm(String(r[1] || ''));
    lk.set(it, (lk.get(it) || 0) + (r[2] || 0));
  });
  const rows = [];
  const usedLk = new Set();
  (state.budget || []).forEach(item => {
    let cost = 0, work = 0, fact = 0, factW = 0, factM = 0;
    (item[2] || []).forEach(w => (w[2] || []).forEach(c => {
      if (norm(String(c[0] || '')) !== key) return;
      cost += c[2] || 0;
      work += c[5] || 0;
      fact += c[6] || 0;
      factW += c[7] || 0;   // факт работы (объём к закрытию × расценка работ)
      factM += c[8] || 0;   // факт материалы
    }));
    const itKey = norm(String(item[0]));
    const factLk = lk.get(itKey) || 0;
    if (factLk) usedLk.add(itKey);
    if (!cost && !fact && !factLk) return;
    rows.push({ item: String(item[0]), cost, work, mat: cost - work,
                fact, factW, factM, factLk });
  });
  // Статьи ЛК, которых нет в своде бюджета, — отдельными строками, иначе
  // сумма колонки «Факт (ЛК)» молча теряла бы часть данных.
  lk.forEach((v, k) => {
    if (usedLk.has(k) || !v) return;
    const src = (state.budgetLk || []).find(r =>
      norm(String(r[0] || '')) === key && norm(String(r[1] || '')) === k);
    rows.push({ item: (src ? String(src[1]) : k) + ' (только в ЛК)',
                cost: 0, work: 0, mat: 0, fact: 0, factW: 0, factM: 0, factLk: v });
  });
  rows.sort((a, b) => b.cost - a.cost || b.factLk - a.factLk);
  return rows;
}

async function loadWriteoff() {
  state.writeoffStatus = 'loading';
  try {
    const url = GAS_URL + '?action=writeoff&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.writeoff = json.writeoff || [];
    state.writeoffStatus = 'ready';
  } catch (e) {
    state.writeoffStatus = 'error';
  }
  if (state.screen === 'mol') renderMol();
  // «Материалы» ждут списание для колонки «Списано итого» (28.08.2026).
  if (state.screen === 'materials') renderMaterials();
}

// Объёмы дробные — два знака, ноль показываем пустой ячейкой.
const fmtQ = v => v ? new Intl.NumberFormat('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v) : '';
const fmtR = v => v ? fmtInt(Math.round(v)) : '';

/**
 * Вкладка «МОЛ» (28.08.2026, бывшая «Материалы») — четыре материально
 * ответственных, у каждого два раздела:
 *  · «Бюджет» — те же суммы, что на вкладке «Бюджет», но только по ячейкам
 *    этого МОЛ (он же подрядчик собственных сил): статья × стоимость/работы/
 *    материалы/факт;
 *  · «Материалы» — расчётный объём по его работам (норма расхода × объём
 *    работ ЭТОГО МОЛ), списано из листа «Списание материалов» и стоимость
 *    материала; сортировка по убыванию стоимости. Все виды ГКЛ — одной строкой
 *    (matKey), она и сравнивается со списанием.
 */
function renderMol() {
  const el = document.getElementById('mol-screen');
  if (state.writeoffStatus === 'idle') loadWriteoff();
  if (state.budgetStatus === 'idle') loadBudget();
  const head = '<div class="check-head">МОЛ</div>';
  if (state.writeoffStatus !== 'ready') {
    el.innerHTML = head + '<div class="side-note">' +
      (state.writeoffStatus === 'error'
        ? 'Не удалось загрузить списание материалов. Обновите страницу.'
        : 'Данные списания загружаются…') + '</div>';
    return;
  }
  const budgetReady = state.budgetStatus === 'ready';
  // Списание: ключ материала -> МОЛ -> сумма (все виды ГКЛ сведены matKey).
  const offByMat = new Map();
  const unitByMat = new Map();
  (state.writeoff || []).forEach(r => {
    const k = matKey(r[1]);
    if (!offByMat.has(k)) offByMat.set(k, { name: matTitle(k, r[1]), mols: new Map() });
    const o = offByMat.get(k);
    o.mols.set(r[5], (o.mols.get(r[5]) || 0) + (r[4] || 0));
    if (r[2] && !unitByMat.has(k)) unitByMat.set(k, r[2]);
  });
  // Все группы сворачиваемые (просьба 28.08.2026): на старте блоки МОЛ свёрнуты,
  // внутри раскрытого МОЛ разделы открыты, пока их не свернули отдельно.
  const chev = o => '<span class="chev">' + (o ? '▾' : '▸') + '</span> ';
  let html = head;
  MOL_LIST.forEach(mol => {
    const molOpen = state.molOpen.has(mol);
    html += '<div class="mol-block"><div class="mol-name" data-mol="' + escapeHtml(mol) + '">' +
      chev(molOpen) + escapeHtml(mol) + '</div>';
    if (!molOpen) { html += '</div>'; return; }
    const secOpen = sec => !state.molSecClosed.has(mol + '|' + sec);

    // --- Раздел «Бюджет» ---
    const bOpen = secOpen('budget');
    html += '<div class="mol-sec" data-sec="' + escapeHtml(mol) + '|budget">' +
      chev(bOpen) + 'Бюджет</div>';
    if (!bOpen) {
      // раздел свёрнут — содержимое не строим
    } else if (!budgetReady) {
      html += '<div class="side-note">Свод бюджета загружается…</div>';
    } else {
      const bRows = molBudget(mol);
      if (!bRows.length) {
        html += '<div class="side-note">В бюджете нет строк по этому МОЛ.</div>';
      } else {
        const sum = f => bRows.reduce((s, r) => s + f(r), 0);
        // Колонки сгруппированы (просьба 28.08.2026): «Бюджет» и «Факт (модель)» —
        // по три (материалы · работы · итого), «Личный кабинет» — один итог.
        // Шапка в два ряда; первая колонка каждой группы помечена bsep — как на
        // вкладке «Бюджет», это вертикальный разделитель.
        const trio = (m, w, t) =>
          '<td class="num bsep">' + escapeHtml(fmtR(m)) + '</td>' +
          '<td class="num">' + escapeHtml(fmtR(w)) + '</td>' +
          '<td class="num">' + escapeHtml(fmtR(t)) + '</td>';
        html += '<div class="bdetail-wrap"><table class="check mtab mbud"><thead>' +
          '<tr><th rowspan="2">Статья бюджета</th>' +
          '<th colspan="3" class="bsep grphead">Бюджет</th>' +
          '<th colspan="3" class="bsep grphead">Факт (модель)</th>' +
          '<th class="bsep grphead lk">Личный кабинет</th></tr>' +
          '<tr class="sub"><th class="num bsep">Материалы, руб</th>' +
          '<th class="num">Работы, руб</th><th class="num">Итого, руб</th>' +
          '<th class="num bsep">Материалы, руб</th>' +
          '<th class="num">Работы, руб</th><th class="num">Итого, руб</th>' +
          '<th class="num bsep">Итого, руб</th></tr></thead><tbody>' +
          bRows.map(r => '<tr><td>' + escapeHtml(r.item) + '</td>' +
            trio(r.mat, r.work, r.cost) +
            trio(r.factM, r.factW, r.fact) +
            '<td class="num bsep">' + escapeHtml(fmtR(r.factLk)) + '</td></tr>').join('') +
          '</tbody><tfoot><tr><td>Итого</td>' +
          trio(sum(r => r.mat), sum(r => r.work), sum(r => r.cost)) +
          trio(sum(r => r.factM), sum(r => r.factW), sum(r => r.fact)) +
          '<td class="num bsep">' + escapeHtml(fmtR(sum(r => r.factLk))) +
          '</td></tr></tfoot></table></div>';
      }
    }

    // --- Раздел «Материалы» ---
    const mOpen = secOpen('materials');
    html += '<div class="mol-sec" data-sec="' + escapeHtml(mol) + '|materials">' +
      chev(mOpen) + 'Материалы</div>';
    if (!mOpen) {
      // раздел свёрнут — содержимое не строим
    } else if (!budgetReady) {
      html += '<div class="side-note">Расчёт появится после загрузки бюджета…</div>';
    } else {
      const calc = buildMaterialCalc(molWorkVolumes(mol), molWorkVolumes(mol, 15));
      // Материалы этого МОЛ: расчётные по его работам + те, что ему списаны.
      const keys = new Set([...calc.keys()]);
      offByMat.forEach((o, k) => { if (o.mols.get(mol)) keys.add(k); });
      const list = Array.from(keys).map(k => {
        const c = calc.get(k);
        const off = offByMat.get(k);
        return {
          k,
          name: (c && c.name) || (off && off.name) || k,
          unit: (c && c.unit) || unitByMat.get(k) || '',
          vol: c ? c.vol : 0,
          done: c ? c.done : 0,
          cost: c ? c.cost : 0,
          off: off ? (off.mols.get(mol) || 0) : 0
        };
      }).filter(r => r.vol || r.off)
        .sort((a, b) => b.cost - a.cost || b.vol - a.vol);
      if (!list.length) {
        html += '<div class="side-note">Материалов по этому МОЛ не нашлось.</div>';
      } else {
        const tCost = list.reduce((s, r) => s + r.cost, 0);
        html += '<div class="bdetail-wrap"><table class="check mtab"><thead><tr>' +
          '<th>Материал</th><th class="c-unit">Ед. изм</th>' +
          '<th class="num">Объем итого по модели</th>' +
          '<th class="num">Выполнено натурально</th><th class="num">Остаток</th>' +
          '<th class="num">К списанию ЛК</th>' +
          '<th class="num">Стоимость материала итого, руб</th></tr></thead><tbody>' +
          list.map(r => '<tr><td>' + escapeHtml(r.name) + '</td>' +
            '<td>' + escapeHtml(r.unit) + '</td>' +
            '<td class="num">' + escapeHtml(fmtQ(r.vol)) + '</td>' +
            '<td class="num">' + escapeHtml(fmtQ(r.done)) + '</td>' +
            '<td class="num">' + escapeHtml(fmtQ(r.vol - r.done)) + '</td>' +
            '<td class="num">' + escapeHtml(fmtQ(r.off)) + '</td>' +
            '<td class="num">' + escapeHtml(fmtR(r.cost)) + '</td></tr>').join('') +
          '</tbody><tfoot><tr><td>Итого</td><td></td><td class="num"></td>' +
          '<td class="num"></td><td class="num"></td><td class="num"></td>' +
          '<td class="num">' + escapeHtml(fmtR(tCost)) +
          '</td></tr></tfoot></table></div>';
      }
    }
    html += '</div>';
  });
  el.innerHTML = html;
}

/**
 * Вкладка «Материалы» (28.08.2026) — как формируется стоимость материалов
 * в бюджете. Строка материала (по убыванию итоговой стоимости) раскрывается
 * в список работ: объём работ × норма расхода = объём материала, × цену =
 * стоимость. Источник — лист «Расходы» (нормы и цены), объёмы работ оттуда же.
 * ⚠️ Итог этой расшифровки МЕНЬШЕ колонки «Материалы» на вкладке «Бюджет»:
 * бюджет считает материалы по поэтажке (своя цена материалов на единицу и
 * коэффициент переделки), а здесь — по нормативной модели. Расхождение
 * показано в подписи под таблицей.
 */
function renderMaterials() {
  const el = document.getElementById('materials-screen');
  if (state.writeoffStatus === 'idle') loadWriteoff();
  const head = '<div class="check-head">Материалы</div>';
  if (!(state.expenses || []).length) {
    el.innerHTML = head + '<div class="side-note">Данные листа «Расходы» загружаются…</div>';
    return;
  }
  // «Списано итого» (просьба 28.08.2026) — сумма по всем МОЛ из листа
  // «Списание материалов»; ключ тот же matKey, поэтому ГКЛ сравнивается целиком.
  const offTotal = new Map();
  (state.writeoff || []).forEach(r => {
    const k = matKey(r[1]);
    offTotal.set(k, (offTotal.get(k) || 0) + (r[4] || 0));
  });
  const calc = buildMaterialCalc(null, allFactVolumes());
  const list = Array.from(calc.entries())
    .map(([k, o]) => ({ k, ...o }))
    .filter(r => r.cost || r.vol)
    .sort((a, b) => b.cost - a.cost);
  const total = list.reduce((s, r) => s + r.cost, 0);
  const open = state.matOpen;
  let body = '';
  list.forEach(r => {
    const isOpen = open === r.k;
    body += '<tr class="mrow' + (isOpen ? ' open' : '') + '" data-mat="' + escapeHtml(r.k) + '">' +
      '<td><span class="chev">' + (isOpen ? '▾' : '▸') + '</span> ' + escapeHtml(r.name) + '</td>' +
      '<td>' + escapeHtml(r.unit) + '</td>' +
      '<td class="num">' + escapeHtml(fmtQ(r.vol)) + '</td>' +
      '<td class="num">' + escapeHtml(fmtQ(r.done)) + '</td>' +
      '<td class="num">' + escapeHtml(fmtQ(r.vol - r.done)) + '</td>' +
      '<td class="num">' + escapeHtml(fmtQ(offTotal.get(r.k) || 0)) + '</td>' +
      '<td class="num">' + escapeHtml(fmtR(r.cost)) + '</td></tr>';
    if (!isOpen) return;
    // Расшифровка: из каких работ сложилась стоимость этого материала.
    const works = r.works.slice().sort((a, b) => b.cost - a.cost);
    body += '<tr class="mdetail"><td colspan="7">' +
      '<table class="check inner"><thead><tr><th>Работа</th>' +
      '<th class="num">Объем работ</th><th class="num">Норма расхода на ед.</th>' +
      '<th class="num">Объем по модели</th><th class="num">Выполнено натурально</th>' +
      '<th class="num">Остаток</th><th class="num">Цена за ед., руб</th>' +
      '<th class="num">Стоимость, руб</th></tr></thead><tbody>' +
      works.map(w => '<tr><td>' + escapeHtml(w.work) +
        (matKey(w.name) === 'гкл-листы' ? ' <i>(' + escapeHtml(w.name) + ')</i>' : '') +
        '</td>' +
        '<td class="num">' + escapeHtml(fmtQ(w.vol)) + '</td>' +
        '<td class="num">' + escapeHtml(fmtQ(w.rate)) + '</td>' +
        '<td class="num">' + escapeHtml(fmtQ(w.matVol)) + '</td>' +
        '<td class="num">' + escapeHtml(fmtQ(w.done)) + '</td>' +
        '<td class="num">' + escapeHtml(fmtQ(w.matVol - w.done)) + '</td>' +
        '<td class="num">' + escapeHtml(fmtQ(w.price)) + '</td>' +
        '<td class="num">' + escapeHtml(fmtR(w.cost)) + '</td></tr>').join('') +
      '</tbody></table></td></tr>';
  });
  const tbl = '<table class="check mtab"><thead><tr>' +
    '<th>Материал</th><th class="c-unit">Ед. изм</th>' +
    '<th class="num">Объем итого по модели</th>' +
    '<th class="num">Выполнено натурально</th>' +
    '<th class="num">Остаток</th>' +
    '<th class="num">К списанию ЛК</th>' +
    '<th class="num">Стоимость материала итого, руб</th></tr></thead><tbody>' +
    body + '</tbody><tfoot><tr><td>Итого</td><td></td><td class="num"></td>' +
    '<td class="num"></td><td class="num"></td><td class="num"></td>' +
    '<td class="num">' + escapeHtml(fmtR(total)) + '</td></tr></tfoot></table>';
  el.innerHTML = head + '<div class="bdetail-wrap">' + tbl + '</div>';
}

/**
 * Модалка «Платежи» (26.08.2026): все строки МОРС по статье, все колонки листа
 * как есть (action=morsRows, грузится по клику). Сортировка — свежие сверху.
 */
async function openAnPayments(key, name) {
  // Выбран месяц на графике — показываем платежи только за него (26.08.2026).
  const month = state.anMonth;
  const mTxt = month ? month.slice(5) + '.' + month.slice(2, 4) : '';
  document.getElementById('modal-title').textContent = 'Платежи МОРС';
  document.getElementById('modal-sub').textContent = name + (mTxt ? ' · ' + mTxt : '');
  document.getElementById('modal-body').innerHTML =
    '<div class="side-note">Загрузка платежей…</div>';
  document.getElementById('modal-overlay').style.display = 'flex';
  try {
    const url = GAS_URL + '?action=morsRows&item=' + encodeURIComponent(key) +
      '&t=' + encodeURIComponent(state.token);
    let json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    if (month) {
      // Месяц даты считаем как на бэке (getMonth в местном времени) — простое
      // сравнение начала ISO-строки промахивается на последних днях месяца.
      const headP = json.header || [];
      const diP = headP.findIndex(h => String(h).trim() === 'Дата проводки');
      const siP = headP.findIndex(h => String(h).trim() === 'Сумма расход');
      const ymP = s => {
        const d = new Date(s);
        return isNaN(d) ? '' : d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
      };
      const rowsP = (json.rows || []).filter(r0 => diP >= 0 && ymP(r0[diP]) === month);
      json = {
        ok: true, header: headP, rows: rowsP, count: rowsP.length,
        sum: Math.round(rowsP.reduce((acc, r0) =>
          acc + (siP >= 0 && typeof r0[siP] === 'number' ? r0[siP] : 0), 0)),
        truncated: json.truncated
      };
    }
    document.getElementById('modal-body').innerHTML = anPaymentsHtml(json);
  } catch (e2) {
    document.getElementById('modal-body').innerHTML =
      '<div class="side-note">Не удалось загрузить платежи: ' + escapeHtml(e2.message) + '</div>';
  }
}

// Служебные колонки МОРС в модалке не показываем (просьба 26.08.2026):
// статья и очередь и так заданы фильтром, договорные колонки дублируют назначение.
const AN_PAY_HIDDEN = new Set(['статья бюджета', 'договор контрагента',
  'договор корректировка', 'очередь']);

function anPaymentsHtml(json) {
  const head = json.header || [];
  const rows = (json.rows || []).slice();
  const di = head.findIndex(h => String(h).trim() === 'Дата проводки');
  if (di >= 0) rows.sort((r1, r2) => String(r2[di] || '').localeCompare(String(r1[di] || '')));
  const vis = head.map((h, i) => i).filter(i => !AN_PAY_HIDDEN.has(norm(head[i])));
  const fmtN = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
  const cellV = v => {
    if (typeof v === 'number') return fmtN.format(v);
    const s = String(v == null ? '' : v);
    const dm = s.match(/^(\d{4})-(\d{2})-(\d{2})T/);   // даты приходят ISO-строкой
    return dm ? dm[3] + '.' + dm[2] + '.' + dm[1] : s;
  };
  return '<div class="side-note">Платежей: ' + (json.count || rows.length) +
    ' · сумма ' + escapeHtml(fmtInt(json.sum || 0)) + ' руб' +
    (json.truncated ? ' · показаны первые ' + rows.length : '') + '</div>' +
    '<div class="bdetail-wrap"><table class="check anpays"><thead><tr>' +
    vis.map(i => '<th>' + escapeHtml(String(head[i])) + '</th>').join('') +
    '</tr></thead><tbody>' +
    rows.map(r0 => '<tr>' + vis.map(i => {
      const v = r0[i];
      return '<td' + (typeof v === 'number' ? ' class="num"' : '') + '>' +
        escapeHtml(cellV(v)) + '</td>';
    }).join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

/* ===== Вкладка «ТУЗИО» (31.08.2026) =====
   Оплата почасовщикам: накопительная диаграмма по месяцам, цвет сегмента —
   статья бюджета; клик по месяцу раскрывает расшифровку под диаграммой.
