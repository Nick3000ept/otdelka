/**
 * Проверка «Расценки работ» (просьба пользователя 04.08.2026): работы, у которых базовая
 * расценка отличается больше чем на 15% от средней по подрядчикам или по собственным силам.
 * Средние считаются по сводке «Поэтажка_работы» (state.floors: [подрядчик, корпус,
 * расценка за ед. в бюджет, признак СС]) — по всем ячейкам «подрядчик × корпус».
 * Отклонение = (базовая − средняя) / средняя. Сортировка — от самого большого отклонения.
 * Считается на странице, без запросов к серверу. null — сводка ещё не загружена.
 */
const DEV_LIMIT = 15;   // порог отклонения, %

function workRateChecks() {
  if (state.floorsStatus !== 'ready') return null;
  const out = [];
  state.works.forEach(w => {
    const base = typeof w[BASE_RATE_COL] === 'number' ? w[BASE_RATE_COL] : null;
    if (base === null) return;
    const key = norm(w[WORK_KEY]);
    const rows = (state.floors && state.floors[key]) || [];
    const cVals = [], sVals = [];
    rows.forEach(r => {
      if (typeof r[2] !== 'number') return;
      (r[3] ? sVals : cVals).push(r[2]);
    });
    const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
    const avgC = avg(cVals), avgS = avg(sVals);
    const dev = a => (a ? (base - a) / a * 100 : null);
    const devC = dev(avgC), devS = dev(avgS);
    const worst = Math.max(devC === null ? 0 : Math.abs(devC),
                           devS === null ? 0 : Math.abs(devS));
    if (worst <= DEV_LIMIT) return;
    const group = String(w[COL_GROUP] || '').trim() || NO_GROUP;
    out.push({ key, name: String(w[WORK_KEY] || ''), group, base, avgC, devC, avgS, devS, worst, rows });
  });
  out.sort((a, b) => b.worst - a.worst);
  return out;
}

// Отклонения — с одним знаком после запятой, чтобы порог 15% читался честно.
const fmtDev = v => new Intl.NumberFormat('ru-RU',
  { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Math.abs(v));

function renderCheckWorkRates() {
  const el = document.getElementById('check-screen');
  const list = workRateChecks();
  const title = '<div class="check-head">Отклонения расценок' +
    (list ? ': найдено — ' + list.length : '') + '</div>';
  if (list === null) {
    el.innerHTML = title + '<div class="side-note">' + (state.floorsStatus === 'error'
      ? 'Сводку по подрядчикам загрузить не удалось — обновите страницу.'
      : 'Сводка по подрядчикам ещё загружается — проверка появится через несколько секунд…') +
      '</div>';
    return;
  }
  const head = title +
    '<div class="check-desc">Базовая расценка отличается от средней по подрядчикам или ' +
    'собственным силам больше чем на ' + DEV_LIMIT + '% (отклонение — от средней; средние — ' +
    'по «Поэтажка_работы»). Клик по строке — все подрядчики с расценками.</div>';
  if (!list.length) {
    el.innerHTML = head + '<div class="side-note">Отклонений больше ' + DEV_LIMIT + '% нет</div>';
    return;
  }
  const devTxt = d => (d === null ? '' : (d > 0 ? '+' : '−') + fmtDev(d) + '%');
  const devCls = d => (d !== null && Math.abs(d) > DEV_LIMIT ? ' class="num dev-bad"' : ' class="num"');
  // Работы сгруппированы по «Группа работ» (просьба пользователя 04.08.2026).
  // Список уже отсортирован по отклонению, поэтому порядок групп — по худшему
  // отклонению внутри группы, работы внутри — тоже от большего к меньшему.
  const groups = [];
  const byGroup = new Map();
  list.forEach(it => {
    if (!byGroup.has(it.group)) {
      const g = { name: it.group, items: [] };
      byGroup.set(it.group, g);
      groups.push(g);
    }
    byGroup.get(it.group).items.push(it);
  });
  const rowHtml = it => {
    const open = state.checkOpen === it.key;
    let html = '<tr class="wrow' + (open ? ' open' : '') + '" data-key="' +
      escapeHtml(it.key) + '">' +
      '<td>' + escapeHtml(it.name) + '</td>' +
      '<td class="num">' + escapeHtml(fmtInt(it.base)) + '</td>' +
      '<td class="num">' + (it.avgC === null ? '' : escapeHtml(fmtInt(it.avgC))) + '</td>' +
      '<td' + devCls(it.devC) + '>' + escapeHtml(devTxt(it.devC)) + '</td>' +
      '<td class="num">' + (it.avgS === null ? '' : escapeHtml(fmtInt(it.avgS))) + '</td>' +
      '<td' + devCls(it.devS) + '>' + escapeHtml(devTxt(it.devS)) + '</td></tr>';
    if (open) html += '<tr class="wdetail"><td colspan="6">' + checkDetailHtml(it) + '</td></tr>';
    return html;
  };
  const table = '<table class="check"><thead><tr>' +
    '<th class="cw-name">Работа</th><th class="num">Баз. расценка</th>' +
    '<th class="num">Ср. подрядчики</th><th class="num">Откл.</th>' +
    '<th class="num">Ср. СС</th><th class="num">Откл.</th></tr></thead><tbody>' +
    groups.map(g => {
      // Группы можно сворачивать кликом по заголовку (просьба пользователя 04.08.2026).
      const closed = state.checkCollapsed.has(g.name);
      return '<tr class="sect" data-grp="' + escapeHtml(g.name) + '"><td colspan="6">' +
        '<span class="chev">' + (closed ? '&#9656;' : '&#9662;') + '</span> ' +
        escapeHtml(g.name) + ' <span class="cnt">' + g.items.length + '</span></td></tr>' +
        (closed ? '' : g.items.map(rowHtml).join(''));
    }).join('') + '</tbody></table>';
  el.innerHTML = head + table;
}

// Раскрытая строка проверки: все подрядчики и собственные силы по работе.
// Поэтажку схлопываем: один подрядчик с одной расценкой на нескольких корпусах — одна строка.
function checkDetailHtml(it) {
  const agg = new Map();
  it.rows.forEach(r => {
    if (typeof r[2] !== 'number') return;
    const k = (r[3] ? 1 : 0) + '|' + r[0] + '|' + r[2];
    if (!agg.has(k)) agg.set(k, { contr: r[0], ss: !!r[3], rate: r[2], corps: [] });
    agg.get(k).corps.push(r[1]);
  });
  const items = Array.from(agg.values());
  if (!items.length) {
    return '<div class="side-note">Подрядчики по этой работе в «Поэтажка_работы» не найдены</div>';
  }
  items.sort((a, b) => (a.ss !== b.ss ? (a.ss ? 1 : -1)
    : (a.contr.localeCompare(b.contr, 'ru') || a.rate - b.rate)));
  const corpsTxt = c => c.slice()
    .sort((x, y) => ALL_CORPS.indexOf(x) - ALL_CORPS.indexOf(y)).join(', ');
  const row = x => '<tr><td>' + escapeHtml(x.contr) + '</td>' +
    '<td>' + escapeHtml(corpsTxt(x.corps)) + '</td>' +
    '<td class="num">' + escapeHtml(fmtInt(x.rate)) + '</td></tr>';
  const sect = t => '<tr class="sect"><td colspan="3">' + t + '</td></tr>';
  const reg = items.filter(x => !x.ss), own = items.filter(x => x.ss);
  let body = reg.map(row).join('');
  if (own.length) body += sect('Собственные силы') + own.map(row).join('');
  return '<table class="inner mini"><thead><tr><th>Подрядчик</th><th>Корпуса</th>' +
    '<th class="num">Расценка</th></tr></thead><tbody>' + body + '</tbody></table>' +
    '<div class="side-sub" style="margin-top:4px">расценка за работу на ед. в бюджет, руб · ' +
    'базовая — ' + escapeHtml(fmtInt(it.base)) + ' руб</div>';
}

/**
 * Проверка «Без стоимости» (просьба пользователя 04.08.2026): работы из справочника
 * «Работы», у которых не заполнена базовая расценка работ ИЛИ базовая стоимость
 * материалов. Только работы с «Объем работ» > 0 — без объёма стоимость не нужна
 * (уточнение пользователя 05.08.2026). Считается на странице по уже загруженным
 * works, без запросов. Пустым считается всё, что не число, и ноль.
 */
function noCostChecks() {
  const out = [];
  state.works.forEach(w => {
    const vol = typeof w[VOL_COL] === 'number' ? w[VOL_COL] : 0;
    if (vol <= 0) return;
    const rw = (typeof w[BASE_RATE_COL] === 'number' && w[BASE_RATE_COL] !== 0)
      ? w[BASE_RATE_COL] : null;
    const rm = (typeof w[BASE_MAT_COL] === 'number' && w[BASE_MAT_COL] !== 0)
      ? w[BASE_MAT_COL] : null;
    if (rw !== null && rm !== null) return;
    out.push({
      name: String(w[WORK_KEY] || ''),
      group: String(w[COL_GROUP] || '').trim() || NO_GROUP,
      unit: String(w[UNIT_COL] || '').trim(),
      rateW: rw, rateM: rm,
      missing: (rw === null ? 1 : 0) + (rm === null ? 1 : 0)
    });
  });
  out.sort((a, b) => b.missing - a.missing);   // сперва работы, где нет обеих стоимостей
  return out;
}

function renderCheckNoCost() {
  const el = document.getElementById('check-screen');
  const list = noCostChecks();
  const head = '<div class="check-head">Без стоимости: найдено — ' + list.length + '</div>' +
    '<div class="check-desc">Работы из справочника «Работы» с объёмом больше нуля, ' +
    'у которых не назначена базовая расценка работ или базовая стоимость материалов. ' +
    'Клик по группе — список работ.</div>';
  if (!list.length) {
    el.innerHTML = head + '<div class="side-note">У всех работ обе стоимости заполнены</div>';
    return;
  }
  // Группировка по «Группа работ», по умолчанию всё свернуто (просьба 04.08.2026);
  // внутри группы первыми — работы без обеих стоимостей (list уже так отсортирован).
  const groups = [];
  const byGroup = new Map();
  list.forEach(it => {
    if (!byGroup.has(it.group)) {
      const g = { name: it.group, items: [] };
      byGroup.set(it.group, g);
      groups.push(g);
    }
    byGroup.get(it.group).items.push(it);
  });
  groups.sort((a, b) => b.items.length - a.items.length);
  const cell = v => (v === null
    ? '<span class="flag">не задана</span>'
    : escapeHtml(fmtCell(v, true)));
  const table = '<table class="check"><thead><tr>' +
    '<th class="cw-name">Работа</th><th class="num">Ед. изм</th>' +
    '<th class="num">Баз. расценка раб.</th><th class="num">Баз. расценка мат.</th>' +
    '</tr></thead><tbody>' +
    groups.map(g => {
      const open = state.noCostOpen.has(g.name);
      return '<tr class="sect" data-ncgrp="' + escapeHtml(g.name) + '"><td colspan="4">' +
        '<span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span> ' +
        escapeHtml(g.name) + ' <span class="cnt">' + g.items.length + '</span></td></tr>' +
        (open ? g.items.map(it =>
          '<tr><td>' + escapeHtml(it.name) + '</td>' +
          '<td class="num">' + escapeHtml(it.unit) + '</td>' +
          '<td class="num">' + cell(it.rateW) + '</td>' +
          '<td class="num">' + cell(it.rateM) + '</td></tr>').join('') : '');
    }).join('') + '</tbody></table>';
  el.innerHTML = head + table;
}

/**
 * Проверка «Формулы» (просьба пользователя 05.08.2026): работы, в строках которых
 * остались ошибки формул — Google отдаёт их в выгрузке текстом (#N/A, #REF!,
 * #DIV/0!, #VALUE!, #NAME?, #NUM!, #NULL!, #ERROR!). Смотрим строку работы в листе
 * «Работы» И её материалы в листе «Расходы» (по данным на 05.08.2026 все ошибки —
 * именно там). Считается на странице по уже загруженным данным, без запросов.
 */
const FORMULA_ERR_RE = /^#(N\/A|REF!|DIV\/0!|VALUE!|NAME\?|NUM!|NULL!|ERROR!?)$/i;

function formulaChecks() {
  const byName = new Map();   // norm(работа) -> { name, group, errs: [строки-описания] }
  const add = (rawName, group, label) => {
    const key = norm(rawName);
    if (!key) return;
    if (!byName.has(key)) {
      byName.set(key, { name: String(rawName), group: group || '', errs: [] });
    }
    const it = byName.get(key);
    if (group && !it.group) it.group = group;
    it.errs.push(label);
  };
  state.works.forEach(w => {
    Object.keys(w).forEach(col => {
      const v = w[col];
      if (typeof v === 'string' && FORMULA_ERR_RE.test(v.trim())) {
        add(w[WORK_KEY], String(w[COL_GROUP] || '').trim() || NO_GROUP,
          'Работы · ' + col + ': ' + v.trim());
      }
    });
  });
  state.byWork.forEach(rows => {
    rows.forEach(r => {
      Object.keys(r).forEach(col => {
        const v = r[col];
        if (typeof v === 'string' && FORMULA_ERR_RE.test(v.trim())) {
          const mat = String(r['Материалы'] || '').trim();
          add(r[WORK_KEY], '',
            'Расходы' + (mat ? ' · ' + mat : '') + ' · ' + col + ': ' + v.trim());
        }
      });
    });
  });
  const out = Array.from(byName.values());
  // Группа для работ, найденных только через «Расходы», — из справочника «Работы».
  out.forEach(it => {
    if (!it.group) {
      const w = state.works.find(r => norm(r[WORK_KEY]) === norm(it.name));
      it.group = w ? (String(w[COL_GROUP] || '').trim() || NO_GROUP) : NO_GROUP;
    }
  });
  out.sort((a, b) => b.errs.length - a.errs.length);
  return out;
}

function renderCheckFormulas() {
  const el = document.getElementById('check-screen');
  const list = formulaChecks();
  const head = '<div class="check-head">Формулы: работ с ошибками — ' + list.length + '</div>' +
    '<div class="check-desc">Работы, в строках которых есть ошибки формул (#N/A, #REF! ' +
    'и т.п.) — в самом справочнике «Работы» или в материалах работы (лист «Расходы»). ' +
    'У каждой работы — где именно ошибка.</div>';
  if (!list.length) {
    el.innerHTML = head + '<div class="side-note">Ошибок формул не найдено</div>';
    return;
  }
  const table = '<table class="check"><thead><tr>' +
    '<th class="cw-name">Работа</th><th>Группа работ</th><th>Где ошибка</th>' +
    '</tr></thead><tbody>' +
    list.map(it =>
      '<tr><td>' + escapeHtml(it.name) + '</td>' +
      '<td>' + escapeHtml(it.group) + '</td>' +
      '<td>' + it.errs.map(e =>
        '<span class="flag">' + escapeHtml(e) + '</span>'
      ).join(' ') + '</td></tr>'
    ).join('') + '</tbody></table>';
  el.innerHTML = head + table;
}

/**
 * Проверка «Изменения» (просьба пользователя 05.08.2026): дифф текущей поэтажки
 * против БАЗОВОГО РАСЧЁТА — слепка «работа|корпус|этаж -> [стоимость, объём,
 * подрядчик, расц. работы, расц. материалов]», который хранится файлом на Google
 * Диске. Разрез до этажа — видно смену подрядчика и точечные изменения объёмов
 * и расценок. Кнопка на экране фиксирует текущее состояние как новую базу.
 */
const CHANGE_FIELDS = ['стоимость', 'объём', 'подрядчик', 'расц. работы', 'расц. материалов'];
const fmtChangeVal = (i, v) => {
  if (i === 0) return fmtInt(v || 0);
  if (i === 1) return fmtCell(v || 0);
  return String(v === '' || v === null || v === undefined ? '—' : v);
};

async function loadChanges() {
  state.changesStatus = 'loading';
  if (state.screen === 'check-changes') renderCheckChanges();
  try {
    const url = GAS_URL + '?action=changes&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.changes = json;
    state.changesStatus = 'ready';
  } catch (e) {
    state.changesStatus = 'error';
  }
  updateCheckBadges();
  if (state.screen === 'check-changes') renderCheckChanges();
}

function renderCheckChanges() {
  const el = document.getElementById('check-screen');
  if (state.changesStatus === 'idle') { loadChanges(); return; }
  if (state.changesStatus === 'loading') {
    el.innerHTML = '<div class="check-head">Изменения</div>' +
      '<div class="side-note">Сравниваем поэтажку с базовым расчётом — на холодном ' +
      'кэше это до полуминуты…</div>';
    return;
  }
  if (state.changesStatus === 'error') {
    el.innerHTML = '<div class="check-head">Изменения</div>' +
      '<div class="side-note">Не удалось получить сравнение. Обновите страницу.</div>';
    return;
  }
  const d = state.changes;
  const btn = '<button id="baseline-save" type="button" class="baseline-btn">' +
    '📌 Зафиксировать текущее состояние как базовый расчёт</button>';
  if (d.noBaseline) {
    el.innerHTML = '<div class="check-head">Изменения</div>' +
      '<div class="check-desc">Базовый расчёт ещё не зафиксирован. Нажмите кнопку — ' +
      'текущее состояние поэтажки станет базой, и проверка начнёт показывать все ' +
      'отклонения от неё.</div>' + btn;
    return;
  }
  const list = d.changes || [];
  const head = '<div class="check-head">Изменения: ' + list.length + '</div>' +
    '<div class="check-desc">Отличия актуальной поэтажки от базового расчёта, ' +
    'зафиксированного ' + escapeHtml(fmtDate(d.date)) + '. Сгруппированы как во ' +
    'вкладке «Бюджет»: статья бюджета → группа работ → работа; клик по работе ' +
    'раскрывает строки корпус × этаж. «Δ стоимости» — на сколько изменилась ' +
    'стоимость против базы. Кнопка перезапишет базу текущим состоянием.</div>' + btn;
  if (!list.length) {
    el.innerHTML = head +
      '<div class="side-note">Изменений нет — данные совпадают с базовым расчётом</div>';
    return;
  }
  // Группировка как во вкладке «Бюджет» (просьба 14.08.2026): соответствие
  // «работа -> статья/группа» берём из свода бюджета — грузим его, если ещё не.
  if (state.budgetStatus === 'idle') loadBudget();
  if (state.budgetStatus === 'loading') {
    el.innerHTML = head +
      '<div class="side-note">Загружаем свод бюджета для группировки…</div>';
    return;
  }
  const typeTag = t => (t === 'add'
    ? '<span class="chg chg-add">новое</span>'
    : t === 'del'
      ? '<span class="chg chg-del">удалено</span>'
      : '<span class="chg chg-mod">изменение</span>');
  const detail = ch => {
    if (ch.t === 'add') {
      return 'подрядчик ' + escapeHtml(fmtChangeVal(2, ch.n[2])) +
        ' · объём ' + escapeHtml(fmtCell(ch.n[1])) +
        ' · стоимость ' + escapeHtml(fmtInt(ch.n[0]));
    }
    if (ch.t === 'del') {
      return 'было: подрядчик ' + escapeHtml(fmtChangeVal(2, ch.o[2])) +
        ' · объём ' + escapeHtml(fmtCell(ch.o[1])) +
        ' · стоимость ' + escapeHtml(fmtInt(ch.o[0]));
    }
    return ch.d.map(x =>
      '<span class="flag">' + escapeHtml(CHANGE_FIELDS[x[0]] + ': ' +
        fmtChangeVal(x[0], x[1]) + ' → ' + fmtChangeVal(x[0], x[2])) + '</span>'
    ).join(' ');
  };
  if (state.budgetStatus === 'error') {
    // Свод не загрузился — показываем изменения плоским списком, как раньше.
    const flat = '<table class="check"><thead><tr>' +
      '<th style="width:90px">Тип</th><th class="cw-name">Работа</th>' +
      '<th style="width:70px">Корпус</th><th style="width:60px">Этаж</th>' +
      '<th>Что изменилось</th></tr></thead><tbody>' +
      list.map(ch => {
        const parts = String(ch.k).split('|');
        return '<tr><td>' + typeTag(ch.t) + '</td>' +
          '<td>' + escapeHtml(parts[0] || '') + '</td>' +
          '<td>' + escapeHtml(parts[1] || '') + '</td>' +
          '<td>' + escapeHtml(parts[2] || '') + '</td>' +
          '<td>' + detail(ch) + '</td></tr>';
      }).join('') + '</tbody></table>';
    el.innerHTML = head + '<div class="side-note">Свод бюджета не загрузился — ' +
      'изменения показаны без группировки, плоским списком.</div>' + flat;
    return;
  }
  // Работа (нормализованная) -> [статья бюджета, группа работ] из свода бюджета.
  const wMap = new Map();
  (state.budget || []).forEach(r => (r[2] || []).forEach(w => {
    const k = norm(String(w[0]));
    if (!wMap.has(k)) wMap.set(k, [String(r[0]), String(w[3] || '— без группы —')]);
  }));
  // Сдвиг стоимости по одной записи диффа: новое +, удалённое −, у изменений —
  // разница по полю «стоимость» (индекс 0 в CHANGE_FIELDS).
  const chDelta = ch => {
    if (ch.t === 'add') return ch.n[0] || 0;
    if (ch.t === 'del') return -(ch.o[0] || 0);
    const c = ch.d.find(x => x[0] === 0);
    return c ? (c[2] || 0) - (c[1] || 0) : 0;
  };
  const OUTSIDE = '— вне бюджета —';
  const arts = [], byArt = new Map();
  list.forEach(ch => {
    const parts = String(ch.k).split('|');
    const wName = parts[0] || '';
    const m = wMap.get(norm(wName)) || [OUTSIDE, '— без группы —'];
    let a = byArt.get(m[0]);
    if (!a) { a = { name: m[0], cnt: 0, delta: 0, grps: [], byG: new Map() }; byArt.set(m[0], a); arts.push(a); }
    let g = a.byG.get(m[1]);
    if (!g) { g = { name: m[1], cnt: 0, delta: 0, works: [], byW: new Map() }; a.byG.set(m[1], g); a.grps.push(g); }
    let w = g.byW.get(wName);
    if (!w) { w = { name: wName, cnt: 0, delta: 0, rows: [] }; g.byW.set(wName, w); g.works.push(w); }
    const dv = chDelta(ch);
    a.cnt++; g.cnt++; w.cnt++;
    a.delta += dv; g.delta += dv; w.delta += dv;
    w.rows.push({ ch, corp: parts[1] || '', floor: parts[2] || '' });
  });
  // Статьи — по алфавиту (как в «Бюджете»), «вне бюджета» — в конец;
  // группы и работы — крупные сдвиги стоимости сверху.
  arts.sort((x, y) => {
    if (x.name === OUTSIDE) return 1;
    if (y.name === OUTSIDE) return -1;
    return x.name.localeCompare(y.name, 'ru');
  });
  const byImpact = (x, y) => Math.abs(y.delta) - Math.abs(x.delta) || y.cnt - x.cnt;
  const fmtDelta = v => Math.round(v) ? (v > 0 ? '+' : '') + fmtInt(v) : '';
  // Изменения — отдельными столбцами (просьба 14.08.2026): подрядчик, стоимость
  // материалов/работ (за ед., как в поэтажке), объём и итоговая стоимость.
  // Индексы полей — как в CHANGE_FIELDS; «было → стало» красным, у новых
  // и удалённых строк — просто значения.
  const CH_COLS = [
    [2, 'Подрядчик', 220],
    [4, 'Стоимость материалов, за ед.', 170],
    [3, 'Стоимость работ, за ед.', 170],
    [1, 'Объём', 140],
    [0, 'Стоимость, руб', 180]
  ];
  const fieldCell = (ch, fi) => {
    if (ch.t === 'mod') {
      const x = ch.d.find(p => p[0] === fi);
      if (!x) return '';
      return '<span class="dev-bad">' +
        escapeHtml(fmtChangeVal(fi, x[1]) + ' → ' + fmtChangeVal(fi, x[2])) + '</span>';
    }
    const arr = ch.t === 'add' ? ch.n : ch.o;
    const txt = fmtChangeVal(fi, arr ? arr[fi] : null);
    return txt === '—' ? '' : escapeHtml(txt);
  };
  const rowsTable = rows => '<div class="bdetail-wrap">' +
    '<table class="inner mini"><thead><tr><th style="width:90px">Тип</th>' +
    '<th style="width:140px">Корпус</th><th style="width:120px">Этаж</th>' +
    CH_COLS.map(c => '<th style="width:' + c[2] + 'px">' + c[1] + '</th>').join('') +
    '</tr></thead><tbody>' +
    rows.map(rw => '<tr><td>' + typeTag(rw.ch.t) + '</td>' +
      '<td class="num">' + escapeHtml(rw.corp) + '</td>' +
      '<td class="num">' + escapeHtml(rw.floor) + '</td>' +
      CH_COLS.map(c => '<td class="num">' + fieldCell(rw.ch, c[0]) + '</td>').join('') +
      '</tr>').join('') +
    '</tbody></table></div>';
  const table = '<table class="check budget"><thead><tr>' +
    '<th>Статья бюджета / группа / работа</th>' +
    '<th class="num" style="width:110px">Изменений</th>' +
    '<th class="num" style="width:150px">Δ стоимости, руб</th></tr></thead><tbody>' +
    arts.map(a => {
      const open = state.chgOpen.has(a.name);
      let h = '<tr class="brow" data-chgart="' + escapeHtml(a.name) + '"><td>' +
        '<span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span> ' +
        escapeHtml(a.name) + '</td>' +
        '<td class="num">' + a.cnt + '</td>' +
        '<td class="num">' + escapeHtml(fmtDelta(a.delta)) + '</td></tr>';
      if (!open) return h;
      a.grps.sort(byImpact);
      h += a.grps.map(g => {
        const gKey = a.name + '|' + g.name;
        const gOpen = !state.chgGrpCollapsed.has(gKey);
        let gh = '<tr class="bgrp" data-chggrp="' + escapeHtml(gKey) + '"><td>' +
          '<span class="chev">' + (gOpen ? '&#9662;' : '&#9656;') + '</span> ' +
          escapeHtml(g.name) + '</td>' +
          '<td class="num">' + g.cnt + '</td>' +
          '<td class="num">' + escapeHtml(fmtDelta(g.delta)) + '</td></tr>';
        if (!gOpen) return gh;
        g.works.sort(byImpact);
        gh += g.works.map(w => {
          const wKey = gKey + '|' + w.name;
          const wOpen = state.chgWorkOpen.has(wKey);
          let wh = '<tr class="bwork' + (wOpen ? ' open' : '') + '" data-chgwork="' +
            escapeHtml(wKey) + '"><td>' +
            '<span class="chev">' + (wOpen ? '&#9662;' : '&#9656;') + '</span> ' +
            escapeHtml(w.name) + '</td>' +
            '<td class="num">' + w.cnt + '</td>' +
            '<td class="num">' + escapeHtml(fmtDelta(w.delta)) + '</td></tr>';
          if (wOpen) {
            wh += '<tr class="bdetail"><td colspan="3">' + rowsTable(w.rows) + '</td></tr>';
          }
          return wh;
        }).join('');
        return gh;
      }).join('');
      return h;
    }).join('') + '</tbody><tfoot><tr><td>Итого</td>' +
    '<td class="num">' + list.length + '</td>' +
    '<td class="num">' + escapeHtml(fmtDelta(arts.reduce((s, a) => s + a.delta, 0))) +
    '</td></tr></tfoot></table>';
  el.innerHTML = head + table;
}

async function saveBaseline(btnEl) {
  // Фиксация базы — только для администратора (просьба 18.08.2026): бэкенд требует
  // отдельный пароль (Script Properties ADMIN_PASSWORD). Спрашиваем один раз,
  // после удачной фиксации держим в localStorage; неверный — стираем и просим снова.
  let admin = '';
  try { admin = localStorage.getItem('otdelka_admin') || ''; } catch (e) {}
  if (!admin) {
    admin = (window.prompt('Фиксировать базовый расчёт может только администратор.\n' +
      'Пароль администратора:') || '').trim();
    if (!admin) return;
  }
  if (!window.confirm('Зафиксировать текущее состояние поэтажки как базовый расчёт? ' +
    'Прежняя база будет перезаписана, список изменений обнулится.')) return;
  btnEl.disabled = true;
  btnEl.textContent = 'Фиксируем…';
  try {
    const json = await postJson({ action: 'saveBaseline', at: admin });
    if (!json.ok) {
      if (json.error === 'admin_only') {
        try { localStorage.removeItem('otdelka_admin'); } catch (e) {}
      }
      throw new Error(json.message || json.error);
    }
    try { localStorage.setItem('otdelka_admin', admin); } catch (e) {}
    state.changes = null;
    state.changesStatus = 'idle';
    renderCheckChanges();
  } catch (e) {
    btnEl.disabled = false;
    btnEl.textContent = '📌 Зафиксировать текущее состояние как базовый расчёт';
    alert('Не получилось зафиксировать базу: ' + e.message);
  }
}

/**
 * Вопросы по работам (04.08.2026): кнопка «Вопрос» у работы -> модальное окно ->
 * POST на бэкенд (text/plain, обход CORS-preflight), хранение — JSON-файл на Google
 * Drive владельца скрипта (выбор пользователя). Статусы «Открыт»/«Закрыт», при любой
 * записи фиксируются автор и время. Имя пользователя запоминается в localStorage.
 */
async function postJson(payload) {
  payload.t = state.token;
  const resp = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  });
  const text = await resp.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error('сервер вернул не JSON');
  }
}

    state.questions = json.questions || [];
    state.questionsStatus = 'ready';

  document.getElementById('modal-body').innerHTML =
    '<div class="q-form">' +
    '<label for="q-name">Ваше имя</label>' +
    '<input id="q-name" type="text" value="' + escapeHtml(state.userName) +
      '" placeholder="Кто спрашивает — попадёт в список вопросов">' +
    '<label for="q-text">Вопрос</label>' +
    '<textarea id="q-text" rows="4" placeholder="Текст вопроса"></textarea>' +
    '<div class="q-actions"><button id="q-send" type="button">Отправить</button>' +
    '<span id="q-err"></span></div></div>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('q-send').addEventListener('click', () => submitQuestion(workName));
  document.getElementById(state.userName ? 'q-text' : 'q-name').focus();
}

async function submitQuestion(work) {
  const name = document.getElementById('q-name').value.trim();
  const text = document.getElementById('q-text').value.trim();
  const err = document.getElementById('q-err');
  if (!name) { err.textContent = 'Укажите имя'; return; }
  if (!text) { err.textContent = 'Напишите вопрос'; return; }
  state.userName = name;
  try { localStorage.setItem('otdelka_user', name); } catch (e) {}
  const btn = document.getElementById('q-send');
  btn.disabled = true;
  err.textContent = 'Отправка…';
  try {
    const json = await postJson({ action: 'addQuestion', work, text, author: name });
    if (!json.ok) throw new Error(json.message || json.error);
    if (json.question) state.questions.push(json.question);
    updateCheckBadges();
    closeModal();
  } catch (e) {
    err.textContent = 'Не отправилось: ' + e.message + '. Попробуйте ещё раз.';
    btn.disabled = false;
  }
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderCheckQuestions() {
  const el = document.getElementById('check-screen');
  if (state.questionsStatus === 'idle') loadQuestions();
  if (state.questionsStatus === 'loading' || state.questionsStatus === 'idle') {
    el.innerHTML = '<div class="check-head">Вопросы</div>' +
      '<div class="side-note">Вопросы загружаются…</div>';
    return;
  }
  if (state.questionsStatus === 'error') {
    el.innerHTML = '<div class="check-head">Вопросы</div>' +
      '<div class="side-note">Не удалось загрузить вопросы. Если функция только что ' +
      'включена — владельцу нужно один раз запустить setupQuestions() в редакторе GAS ' +
      'и принять доступ к Диску. Потом обновите страницу.</div>';
    return;
  }
  const list = state.questions.slice().sort((a, b) =>
    ((a.status === 'Закрыт') - (b.status === 'Закрыт')) ||
    String(b.created || '').localeCompare(String(a.created || '')));
  const openCnt = list.filter(q => q.status !== 'Закрыт').length;
  const head = '<div class="check-head">Вопросы: открытых — ' + openCnt +
    (list.length ? ' из ' + list.length : '') + '</div>' +
    '<div class="check-desc">Вопросы к работам, заданные кнопкой «Вопрос» на вкладке ' +
    '«Расценки». Клик по статусу переключает Открыт/Закрыт — фиксируется, кто и когда.</div>';
  if (!list.length) {
    el.innerHTML = head + '<div class="side-note">Вопросов пока нет</div>';
    return;
  }
  const table = '<table class="check qtab"><thead><tr>' +
    '<th class="c-st">Статус</th><th class="c-work">Работа</th><th>Вопрос</th>' +
    '<th class="c-auth">Автор</th><th class="c-date">Когда</th>' +
    '<th class="c-who">Статус менял</th></tr></thead><tbody>' +
    list.map(q => {
      const closed = q.status === 'Закрыт';
      return '<tr><td class="c-st"><button class="qstatus ' + (closed ? 'closed' : 'open') +
        '" type="button" data-id="' + escapeHtml(String(q.id)) + '">' +
        (closed ? 'Закрыт' : 'Открыт') + '</button></td>' +
        '<td>' + escapeHtml(String(q.work || '')) + '</td>' +
        '<td>' + escapeHtml(String(q.text || '')) + '</td>' +
        '<td>' + escapeHtml(String(q.author || '')) + '</td>' +
        '<td>' + escapeHtml(fmtDate(q.created)) + '</td>' +
        '<td>' + (q.statusBy
          ? escapeHtml(String(q.statusBy)) + ' · ' + escapeHtml(fmtDate(q.statusAt))
          : '') + '</td></tr>';
    }).join('') + '</tbody></table>';
  el.innerHTML = head + table;
}

async function toggleQuestionStatus(id) {
  let name = state.userName;
  if (!name) {
    name = (window.prompt('Ваше имя (фиксируется при смене статуса):') || '').trim();
    if (!name) return;
    state.userName = name;
    try { localStorage.setItem('otdelka_user', name); } catch (e) {}
  }
  const q = state.questions.find(x => String(x.id) === String(id));
  if (!q) return;
  const next = q.status === 'Закрыт' ? 'Открыт' : 'Закрыт';
  const prev = { status: q.status, statusBy: q.statusBy, statusAt: q.statusAt };
  // Optimistic UI: меняем сразу, при ошибке откатываем.
  q.status = next;
  q.statusBy = name;
  q.statusAt = new Date().toISOString();
  renderCheckQuestions();
  updateCheckBadges();
  try {
    const json = await postJson({ action: 'setQuestionStatus', id, status: next, author: name });
    if (!json.ok) throw new Error(json.message || json.error);
    if (json.question) Object.assign(q, json.question);
    renderCheckQuestions();
  } catch (e) {
    Object.assign(q, prev);
    renderCheckQuestions();
    updateCheckBadges();
    alert('Статус не сохранился: ' + e.message + '. Попробуйте ещё раз.');
  }
}

function updateCheckBadges() {
  document.getElementById('badge-check-rates').textContent =
    String(state.checkRates.length || '');
  const list = workRateChecks();
  document.getElementById('badge-check-work-rates').textContent =
    (list && list.length) ? String(list.length) : '';
  const openQ = state.questions.filter(q => q.status !== 'Закрыт').length;
  document.getElementById('badge-check-questions').textContent = openQ ? String(openQ) : '';
  const noCost = state.works.length ? noCostChecks().length : 0;
  document.getElementById('badge-check-no-cost').textContent = noCost ? String(noCost) : '';
  const frm = state.works.length ? formulaChecks().length : 0;
  document.getElementById('badge-check-formulas').textContent = frm ? String(frm) : '';
  const chg = state.changes && state.changes.changes ? state.changes.changes.length : 0;
  document.getElementById('badge-check-changes').textContent = chg ? String(chg) : '';
}

// имя вкладки -> функция отрисовки (новые проверки добавлять сюда).
const CHECK_SCREENS = {
  'check-rates': renderCheckRates,
  'check-work-rates': renderCheckWorkRates,
  'check-no-cost': renderCheckNoCost,
  'check-formulas': renderCheckFormulas,

function setScreen(screen) {
  if (state.screen === screen) return;
  state.screen = screen;
  document.querySelectorAll('.sb-item').forEach(el =>
    el.classList.toggle('active', el.dataset.screen === screen));

  const isCheck = !!CHECK_SCREENS[screen];
  const isBudget = screen === 'budget';
  const isAnalytics = screen === 'analytics';
  const isMaterials = screen === 'materials';   // вкладка «Материалы» (28.08.2026)
  const isMol = screen === 'mol';               // вкладка «МОЛ» (28.08.2026)
  const isTuzio = screen === 'tuzio';           // вкладка «ТУЗИО» (31.08.2026)
  // Шапка с масштабом и поиском — на всех экранах, кроме «Аналитики»
  // (просьба 26.08.2026); на «Бюджете»/«Проверках» — без фильтров дерева работ.
  const hdr = document.querySelector('header');
  hdr.style.display = (isAnalytics || isMaterials || isMol || isTuzio) ? 'none' : '';
  hdr.classList.toggle('compact', isCheck);
  hdr.classList.toggle('bmode', isBudget);
  // Поле поиска на каждом экране своё: дерево работ / фильтр бюджета / проверки.
  document.getElementById('search').value =
    isBudget ? state.budgetQuery : (isCheck ? state.checkQuery : state.query);
  // Фильтр «Подрядчик» на «Проверках» не действует — там его прячем.
  document.getElementById('flt-contr-wrap').style.display = isCheck ? 'none' : '';
  document.getElementById('search-dd').style.display = 'none';   // список работ закрыть
  document.getElementById('check-screen').style.display = isCheck ? 'block' : 'none';
  document.getElementById('budget-screen').style.display = isBudget ? 'block' : 'none';
  document.getElementById('analytics-screen').style.display = isAnalytics ? 'block' : 'none';
  document.getElementById('materials-screen').style.display = isMaterials ? 'block' : 'none';
  document.getElementById('mol-screen').style.display = isMol ? 'block' : 'none';
  document.getElementById('tuzio-screen').style.display = isTuzio ? 'block' : 'none';
  if (isCheck || isBudget || isAnalytics || isMaterials || isMol || isTuzio) {
    document.getElementById('pane-top').style.display = 'none';
    document.getElementById('pane-bottom').style.display = 'none';
    document.getElementById('status').style.display = 'none';
    if (isCheck) CHECK_SCREENS[screen]();
    else if (isBudget) renderBudget();
    else if (isAnalytics) renderAnalytics();
    else if (isMaterials) renderMaterials();
    else if (isTuzio) renderTuzio();
    else renderMol();
    return;
  }

  // «Факт»: нужны объёмы поэтажки (веса) и отметки из журнала; справка из поэтажки —
  // фоном, она только для подсказок в ячейках.
  if (screen === 'fact') {
    if (state.volsStatus === 'idle') loadVols();
    if (state.factStatus === 'idle') loadFact();
    if (state.factRefStatus === 'idle') loadFactRef();
    refreshFactScreen();
    return;
  }

  if (screen === 'volumes' && state.volsStatus === 'idle') loadVols();
  if (screen === 'volumes' && state.volsStatus !== 'ready') {
    setStatus(state.volsStatus === 'error'
      ? 'Не удалось загрузить объёмы. Обновите страницу.' : 'Объёмы загружаются…',
      state.volsStatus === 'error');
    return;
  }
  setStatus('');
  if (state.works.length) renderTable();
}

  el.addEventListener('click', () => setScreen(el.dataset.screen));

    if (state.chgGrpCollapsed.has(k)) state.chgGrpCollapsed.delete(k);

  const cw = e.target.closest('tr.bwork[data-chgwork]');

    if (state.chgWorkOpen.has(k)) state.chgWorkOpen.delete(k);
    else state.chgWorkOpen.add(k);
    renderCheckChanges();
    return;

  const nc = e.target.closest('tr.sect[data-ncgrp]');

  const sect = e.target.closest('tr.sect[data-grp]');

    if (state.checkCollapsed.has(g)) state.checkCollapsed.delete(g);

// Таблица материалов для всплывающего окна.
function materialsHtml(list) {
  if (!list.length) {
    return '<div class="no-detail">Материалы для этой работы в листе «Расходы» не найдены</div>';
  }
  const valueOf = (col, row) => (col.calc ? col.calc(row) : row[col.key]);
  const numeric = DETAIL_COLS.map(col =>
    NUM_HINT.test(col.label) || typeof valueOf(col, list[0]) === 'number'
  );
  const money = DETAIL_COLS.map(col => MONEY_HINT.test(col.label));

  // Узкие колонки: числовые + помеченные fix (Ед. изм. материала, Слои).
  const clsOf = i => {
    const c = [];
    if (numeric[i]) c.push('num');
    if (DETAIL_COLS[i].fix) c.push('fixw');
    if (DETAIL_COLS[i].nar) c.push('narw');
    if (DETAIL_COLS[i].name) c.push('mname');
    return c.length ? ' class="' + c.join(' ') + '"' : '';
  };

  const head = '<tr>' + DETAIL_COLS.map((c, i) =>
    '<th' + clsOf(i) + '>' + escapeHtml(c.label) + '</th>'
  ).join('') + '</tr>';
  const body = list.map(row =>
    '<tr>' + DETAIL_COLS.map((col, i) =>
      '<td' + clsOf(i) + '>' + escapeHtml(fmtCell(valueOf(col, row), money[i])) + '</td>'
    ).join('') + '</tr>'
  ).join('');

  // Итог по стоимости материалов на единицу работы.
  const sumIdx = DETAIL_COLS.findIndex(c => c.key === SUM_COL);
  let foot = '';
  if (sumIdx !== -1) {
    const total = list.reduce((acc, row) => {
      const v = row[SUM_COL];
      return acc + (typeof v === 'number' ? v : 0);
    }, 0);
    foot = '<tr class="total">' + DETAIL_COLS.map((col, i) => {
      if (i === 0) return '<td>Итого материалов на ед. работы</td>';
      if (i === sumIdx) return '<td class="num">' + escapeHtml(fmtCell(total, true)) + '</td>';
      return '<td' + clsOf(i) + '></td>';
    }).join('') + '</tr>';
  }

  return '<table class="inner"><thead>' + head + '</thead><tbody>' + body +
    '</tbody><tfoot>' + foot + '</tfoot></table>';
}

// Масштаб текста таблиц (просьба 14.08.2026): А− / А+ меняют размер шрифта ячеек
// (60–120% шагом 10%), чтобы длинные значения помещались в узкие колонки целиком;
// 100% — исходный вид (правило убирается). Ширины колонок не меняются — меняется
// только шрифт. Значение хранится в localStorage и действует на всех экранах
// (на «Бюджете» и «Проверках» шапка скрыта, но масштаб применяется и там).
const zoomStyle = document.createElement('style');
document.head.appendChild(zoomStyle);
function applyZoom(z) {
  z = Math.round(z * 10) / 10;
  z = Math.min(1.2, Math.max(0.6, z));
  state.zoom = z;
  zoomStyle.textContent = z === 1 ? '' :
    'main table th, main table td, main .fpct { font-size: ' +
    Math.round(12 * z) + 'px !important; }';
  requestAnimationFrame(alignBudgetHead);   // высота шапки бюджета изменилась
  document.getElementById('zoom-reset').textContent = Math.round(z * 100) + '%';
  try { localStorage.setItem('otdelka_zoom', String(z)); } catch (e) {}
}
document.getElementById('zoom-out').addEventListener('click', () => applyZoom(state.zoom - 0.1));
document.getElementById('zoom-in').addEventListener('click', () => applyZoom(state.zoom + 0.1));
document.getElementById('zoom-reset').addEventListener('click', () => applyZoom(1));
applyZoom(parseFloat(localStorage.getItem('otdelka_zoom')) || 1);

// Кнопка «Развернуть все» убрана по просьбе пользователя 26.08.2026
// (уровни по-прежнему раскрываются кликом по строке).

// Фильтр «Подрядчик» в шапке (26.08.2026): на дереве работ (Расценки/Объемы/
// Факт) остаются работы, где у подрядчика есть ячейки в поэтажке (по сводке
// floors); на «Бюджете» выбор транслируется в фильтр бюджета по подрядчикам.
document.getElementById('f-contr').addEventListener('change', e => {
  state.contrSel = e.target.value;
  if (state.screen === 'budget') {
    // «— не назначено —» на бюджете = строки без подрядчика (ключ ячейки
    // «— без подрядчика —», в старом выпадающем списке звался «Не определен»).
    state.budgetContr = new Set(
      state.contrSel === '__none__' ? ['— без подрядчика —']
        : state.contrSel ? [state.contrSel] : []);
    renderBudget();
  } else if (state.works.length) {
    renderTable();
  }
});

// Галочка «Собственные силы» в шапке (26.08.2026): на дереве работ добавляет
// СС-четвёрку к фильтру, на «Бюджете» управляет budgetSS.
document.getElementById('f-ss').addEventListener('change', e => {
  state.ssSel = e.target.checked;
  if (state.screen === 'budget') {
    state.budgetSS = e.target.checked;
    renderBudget();
  } else if (state.works.length) {
    renderTable();
  }
});

function populateContrFilter() {
  const sel = document.getElementById('f-contr');
  if (!sel || state.floorsStatus !== 'ready') return;
  const set = new Set();
  Object.keys(state.floors).forEach(w => {
    (state.floors[w] || []).forEach(c => {
      const n = String(c[0]).trim();
      if (n) set.add(n);
    });
  });
  // «— не назначено —» (просьба 26.08.2026): на дереве — работы без единого
  // подрядчика в поэтажке, на «Бюджете» — строки «— без подрядчика —».
  sel.innerHTML = '<option value="">— все —</option>' +
    '<option value="__none__"' + (state.contrSel === '__none__' ? ' selected' : '') +
    '>— не назначено —</option>' + Array.from(set)
    .sort((a, b) => a.localeCompare(b, 'ru'))
    .map(n => '<option value="' + escapeHtml(n) + '"' +
      (n === state.contrSel ? ' selected' : '') + '>' + escapeHtml(n) + '</option>').join('');
}

document.getElementById('f-reset').addEventListener('click', () => {
  state.filters = { group: '', place: '', surface: '' };
  state.query = '';
  state.contrSel = '';
  state.ssSel = false;
  state.workSel.clear();
  // Бюджетные фильтры управляются той же шапкой — сбрасываем и их (26.08.2026).
  state.budgetContr = new Set();
  state.budgetSS = false;
  state.budgetQuery = '';
  ['f-group', 'f-place', 'f-surface', 'f-contr'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-ss').checked = false;
  document.getElementById('search').value = '';
  if (state.screen === 'budget') renderBudget();
  else if (state.works.length) renderTable();
});

function setStatus(text, isError) {
  const el = document.getElementById('status');
  el.style.display = text ? 'block' : 'none';
  el.textContent = text || '';
  el.className = isError ? 'error' : '';
  document.getElementById('pane-top').style.display = text ? 'none' : 'block';
  // Нижняя панель (подрядчики/материалы) — только на вкладке «Расценки».
  document.getElementById('pane-bottom').style.display =
    (text || state.screen !== 'rates') ? 'none' : 'block';
}

async function fetchWithRetry(url, attempts) {
  attempts = attempts || 3;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const resp = await fetch(url);
      const text = await resp.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error('Сервер вернул не JSON (возможно, ошибка доступа к таблице)');
      }
      return json;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw lastErr;
}

async function loadData() {
  setStatus('Загрузка данных...');
  try {
    const url = GAS_URL + '?action=load&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url);
    if (!json.ok) {
      if (json.error === 'unauthorized') {
        showGate('Неверный пароль');
        return;
      }
      setStatus('Ошибка загрузки: ' + (json.message || json.error), true);
      return;
    }
    state.works = json.works || [];
    state.byWork = buildIndex(json.expenses || []);
    // Лист «Расходы» целиком нужен вкладке «Материалы» (28.08.2026) —
    // расчётный объём материала = норма расхода × объём работ.
    state.expenses = json.expenses || [];
    state.contrRates = json.contrRates || [];
    state.ssRates = json.ssRates || [];
    state.ssMap = json.ssMap || [];
    state.checkRates = json.checkRates || [];
    // На старте все места и группы свёрнуты (решение пользователя 03.08.2026).
    state.collapsed = new Set(allGroupKeys(groupWorks(state.works)));
    state.unitByMaterial = new Map(
      (json.materials || [])
        .filter(m => norm(m['Материал']))
        .map(m => [norm(m['Материал']), String(m['Ед. изм'] || '').trim()])
    );
    // Тип материала из справочника «Материалы» (28.08.2026) — по нему вкладки
    // «МОЛ»/«Материалы» сводят все виды ГКЛ в одну строку (см. matKey).
    state.typeByMaterial = new Map(
      (json.materials || [])
        .filter(m => norm(m['Материал']))
        .map(m => [norm(m['Материал']), String(m['Тип материала'] || '').trim()])
    );
    setStatus('');
    fillFilters();
    renderTable();
    updateCheckBadges();
    // Вкладки «Материалы»/«МОЛ» могли открыться до прихода «Расходов»
    // (28.08.2026) — перерисуем, чтобы расчёт появился без обновления страницы.
    if (state.screen === 'materials') renderMaterials();
    if (state.screen === 'mol') renderMol();
    loadFloors();      // сводка по подрядчикам — фоном, чтобы не тормозить открытие витрины
    loadQuestions();   // вопросы — тоже фоном: файл маленький, нужен бейдж-счётчик
    if (state.volsStatus === 'idle') loadVols();   // объёмы из поэтажки — для колонки
                                                   // «Объем работ» на «Расценках» (05.08.2026)
  } catch (e) {
    setStatus('Не удалось связаться с сервером. Проверьте интернет и обновите страницу.', true);
  }
}

/**
 * Сводка «подрядчик × корпус» считается по листу «Поэтажка_работы» (25 тыс. строк) —
 * это ~25 сек на холодном кэше сервера, поэтому грузим её отдельно и не блокируем таблицу.
 * После загрузки обновляем нижнюю панель — «загружается…» сменится данными.
 */
async function loadFloors() {
  try {
    const url = GAS_URL + '?action=floors&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url, 2);
    if (!json.ok) throw new Error(json.message || json.error);
    state.floors = json.floors || {};
    state.floorsSS = json.ssNames || {};
    state.floorsStatus = 'ready';
    populateContrFilter();   // список фильтра «Подрядчик» в шапке (26.08.2026)
  } catch (e) {
    state.floorsStatus = 'error';
  }
  renderBottomPane();
  // Проверка «Расценки работ» считается по этой сводке: обновляем бейдж,
  // а если пользователь уже на вкладке — и саму таблицу.
  updateCheckBadges();
  if (state.screen === 'check-work-rates') renderCheckWorkRates();
}

function showGate(err) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pwErr').textContent = err || '';
  localStorage.removeItem('otdelka_token');
}

function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

document.getElementById('pwBtn').addEventListener('click', submitPassword);
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

function submitPassword() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  state.token = pw;
  localStorage.setItem('otdelka_token', pw);
  showApp();
  loadData();
}

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  buildSearchDd();   // список работ под полем обновляется сразу, без задержки
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const v = e.target.value;
    if (state.screen === 'budget') {
      // То же самое, что поле «Фильтр по работе...» на экране бюджета.
      state.budgetQuery = v;
      renderBudget();
    } else if (CHECK_SCREENS[state.screen]) {
      state.checkQuery = v;
      applyCheckSearch();
    } else {
      state.query = v;
      if (state.works.length) renderTable();
    }
  }, 150);
});

// Выпадающий список работ у поиска с мультивыбором (просьба 26.08.2026):
// при фокусе/вводе показывает работы текущего экрана (дерево или бюджет)
// с галочками; отмеченные работы фильтруют экран, текст сужает только список.
function searchWorkList() {
  const out = new Map();   // norm -> отображаемое имя
  if (state.screen === 'budget') {
    (state.budget || []).forEach(r => (r[2] || []).forEach(w => {
      const k = norm(String(w[0]));
      if (k && !out.has(k)) out.set(k, String(w[0]));
    }));
  } else {
    state.works.forEach(r => {
      const k = norm(r[WORK_KEY]);
      if (k && !out.has(k)) out.set(k, String(r[WORK_KEY]));
    });
  }
  return out;
}

function buildSearchDd() {
  const dd = document.getElementById('search-dd');
  if (CHECK_SCREENS[state.screen]) { dd.style.display = 'none'; return; }
  const all = searchWorkList();
  if (!all.size) { dd.style.display = 'none'; return; }
  const qq = norm(document.getElementById('search').value);
  const items = [];
  all.forEach((name, k) => {
    // Выбранные работы в списке остаются всегда, остальные сужаются текстом.
    if (qq && !k.includes(qq) && !state.workSel.has(k)) return;
    items.push([k, name]);
  });
  items.sort((p1, p2) => {
    const s1 = state.workSel.has(p1[0]) ? 0 : 1;
    const s2 = state.workSel.has(p2[0]) ? 0 : 1;
    return s1 - s2 || p1[1].localeCompare(p2[1], 'ru');
  });
  dd.innerHTML = '<div class="sdd-top" id="sdd-reset">' +
    (state.workSel.size
      ? 'Выбрано работ: ' + state.workSel.size + ' — сбросить выбор'
      : 'Отметьте работы галочками — можно несколько') + '</div>' +
    items.slice(0, 300).map(p =>
      '<label><input type="checkbox" data-wk="' + escapeHtml(p[0]) + '"' +
      (state.workSel.has(p[0]) ? ' checked' : '') + '>' + escapeHtml(p[1]) +
      '</label>').join('');
  dd.style.display = 'block';
}

function refreshAfterWorkSel() {
  if (state.screen === 'budget') renderBudget();
  else if (state.works.length) renderTable();
}

document.getElementById('search').addEventListener('focus', buildSearchDd);
document.getElementById('search-dd').addEventListener('change', e => {
  const cb = e.target.closest('input[data-wk]');
  if (!cb) return;
  if (cb.checked) state.workSel.add(cb.dataset.wk);
  else state.workSel.delete(cb.dataset.wk);
  buildSearchDd();
  refreshAfterWorkSel();
});
document.getElementById('search-dd').addEventListener('click', e => {
  if (e.target.id === 'sdd-reset' && state.workSel.size) {
    state.workSel.clear();
    buildSearchDd();
    refreshAfterWorkSel();
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('search-dd').style.display = 'none';
  }
});

// Поиск на «Проверках» (26.08.2026): простой фильтр по тексту — строки таблиц
// без совпадения скрываются. Перерисовка экрана возвращает все строки, поэтому
// фильтр накладывается заново при каждом обновлении содержимого (observer).
function applyCheckSearch() {
  const q = norm(state.checkQuery || '');
  document.querySelectorAll('#check-screen tbody tr').forEach(tr => {
    tr.style.display = (!q || norm(tr.textContent).indexOf(q) !== -1) ? '' : 'none';
  });
}
new MutationObserver(() => { if (state.checkQuery) applyCheckSearch(); })
  .observe(document.getElementById('check-screen'), { childList: true, subtree: true });

if (state.token) {
  showApp();
  loadData();
} else {
  showGate();
}
</script>
