<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отделка — витрина расценок</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #4c8dff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #gate {
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 320px; text-align: center;
  }
  #gate h1 { font-size: 18px; margin: 0 0 16px; }
  #gate input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 15px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
  }
  #gate button:disabled { opacity: .6; cursor: default; }
  #gate .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

  #app { display: none; height: 100%; flex-direction: column; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .hint { color: var(--text-dim); font-size: 12px; }
  .search-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #search {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; width: 260px;
  }
  #count { color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  main { flex: 1; overflow: auto; padding: 0 16px 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--panel); text-align: left;
    padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap;
    color: var(--text-dim); font-weight: 600;
  }
  tbody td {
    padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
    max-width: 420px; overflow: hidden; text-overflow: ellipsis;
  }
  tbody tr.work { cursor: pointer; }
  tbody tr.work:hover { background: var(--panel2); }
  tbody tr.work.open { background: var(--panel2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  td.chev-cell { width: 30px; max-width: 30px; color: var(--text-dim); text-align: center; }
  .cnt { color: var(--text-dim); font-size: 11px; }

  tr.detail > td {
    white-space: normal; max-width: none; overflow: visible;
    padding: 0 10px 0 40px; background: #12151b; border-bottom: 1px solid var(--border);
  }
  table.inner { width: auto; min-width: 50%; margin: 10px 0 14px; border: 1px solid var(--border); }
  table.inner th {
    position: static; background: var(--panel2); color: var(--text-dim);
    font-size: 12px; padding: 5px 8px; border-bottom: 1px solid var(--border);
  }
  table.inner td { font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  table.inner tr:last-child td { border-bottom: none; }
  .no-detail { color: var(--text-dim); font-size: 12px; padding: 10px 0 12px; }

  #status { padding: 40px; text-align: center; color: var(--text-dim); }
  #status.error { color: var(--danger); }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Отделка — витрина расценок</h1>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="pwBtn">Войти</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Отделка СБ3 — работы</h1>
    <span class="hint">Нажмите на работу, чтобы увидеть материалы</span>
    <div class="search-wrap">
      <span id="count"></span>
      <input id="search" type="text" placeholder="Поиск...">
    </div>
  </header>
  <main>
    <div id="status">Загрузка данных...</div>
    <table id="table" style="display:none">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyo6f-OGca1loM1aBXtHkcx7nq8tlJWBreGepxp0KTwq7GvDdDPKo-tuFjXQqKs1nZfdQ/exec';

// Колонки листа «Работы», которые на витрине не показываем (решение пользователя 03.08.2026).
const HIDDEN_COLS = [
  'Название работы СС',
  'ИД факт',
  'Признак для бюджета основной',
  'Признак для бюджета дополнительный',
  'Признак для бюджета дополнительный объем',
  'Признак Уровень 1 ДГП для увязки'
];

// Колонка, по которой работа связывается с материалами из листа «Расходы».
const WORK_KEY = 'Название работы из АР';

const state = {
  token: localStorage.getItem('otdelka_token') || '',
  works: [],
  byWork: new Map(),   // название работы (нормализованное) -> строки листа «Расходы»
  query: ''
};

const NUM_HINT = /(расценк|цена|стоимост|объем|объём|расход|процент)/i;

function norm(v) {
  return String(v === null || v === undefined ? '' : v).trim().toLowerCase();
}

function fmtCell(val) {
  if (typeof val === 'number') {
    return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 4 }).format(val);
  }
  return val === null || val === undefined ? '' : String(val);
}

function isNumericColumn(key, rows) {
  if (NUM_HINT.test(key)) return true;
  return rows.length > 0 && typeof rows[0][key] === 'number';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function visibleHeaders(rows) {
  if (!rows.length) return [];
  return Object.keys(rows[0]).filter(h => HIDDEN_COLS.indexOf(h) === -1);
}

function buildIndex(expenses) {
  const map = new Map();
  expenses.forEach(row => {
    const key = norm(row[WORK_KEY]);
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  });
  return map;
}

function renderTable() {
  const rows = state.works;
  const headers = visibleHeaders(rows);
  const q = state.query.trim().toLowerCase();
  const filtered = q
    ? rows.filter(r => headers.some(h => String(r[h]).toLowerCase().includes(q)))
    : rows;

  document.getElementById('count').textContent = filtered.length + ' из ' + rows.length;

  const numeric = {};
  headers.forEach(h => { numeric[h] = isNumericColumn(h, rows); });

  const theadRow = document.getElementById('thead-row');
  theadRow.innerHTML = '<th></th>' + headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('');

  const CHUNK = 300;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let i = 0;
  function renderChunk() {
    const frag = document.createDocumentFragment();
    const end = Math.min(i + CHUNK, filtered.length);
    for (; i < end; i++) {
      const r = filtered[i];
      const key = norm(r[WORK_KEY]);
      const cnt = (state.byWork.get(key) || []).length;
      const tr = document.createElement('tr');
      tr.className = 'work';
      tr.dataset.key = key;
      tr.innerHTML =
        '<td class="chev-cell"><span class="chev">&#9656;</span>' +
        (cnt ? ' <span class="cnt">' + cnt + '</span>' : '') + '</td>' +
        headers.map(h => {
          const cls = numeric[h] ? ' class="num"' : '';
          return '<td' + cls + '>' + escapeHtml(fmtCell(r[h])) + '</td>';
        }).join('');
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    if (i < filtered.length) requestAnimationFrame(renderChunk);
  }
  renderChunk();
}

function detailHtml(list, colspan) {
  if (!list.length) {
    return '<td colspan="' + colspan + '"><div class="no-detail">Материалы для этой работы в листе «Расходы» не найдены</div></td>';
  }
  // Название работы в раскрытом списке не дублируем — оно уже в строке выше.
  const cols = Object.keys(list[0]).filter(h => h !== WORK_KEY);
  const numeric = {};
  cols.forEach(h => { numeric[h] = isNumericColumn(h, list); });

  const head = '<tr>' + cols.map(h => '<th>' + escapeHtml(h) + '</th>').join('') + '</tr>';
  const body = list.map(row =>
    '<tr>' + cols.map(h => {
      const cls = numeric[h] ? ' class="num"' : '';
      return '<td' + cls + '>' + escapeHtml(fmtCell(row[h])) + '</td>';
    }).join('') + '</tr>'
  ).join('');

  return '<td colspan="' + colspan + '"><table class="inner"><thead>' + head +
         '</thead><tbody>' + body + '</tbody></table></td>';
}

function toggleRow(tr) {
  const chev = tr.querySelector('.chev');
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detail')) {
    next.remove();
    tr.classList.remove('open');
    chev.innerHTML = '&#9656;';
    return;
  }
  const list = state.byWork.get(tr.dataset.key) || [];
  const detail = document.createElement('tr');
  detail.className = 'detail';
  detail.innerHTML = detailHtml(list, tr.children.length);
  tr.parentNode.insertBefore(detail, tr.nextSibling);
  tr.classList.add('open');
  chev.innerHTML = '&#9662;';
}

document.getElementById('tbody').addEventListener('click', e => {
  const tr = e.target.closest('tr.work');
  if (tr) toggleRow(tr);
});

function setStatus(text, isError) {
  const el = document.getElementById('status');
  el.style.display = text ? 'block' : 'none';
  el.textContent = text || '';
  el.className = isError ? 'error' : '';
  document.getElementById('table').style.display = text ? 'none' : 'table';
}

async function fetchWithRetry(url, attempts) {
  attempts = attempts || 3;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const resp = await fetch(url);
      const text = await resp.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error('Сервер вернул не JSON (возможно, ошибка доступа к таблице)');
      }
      return json;
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw lastErr;
}

async function loadData() {
  setStatus('Загрузка данных...');
  try {
    const url = GAS_URL + '?action=load&t=' + encodeURIComponent(state.token);
    const json = await fetchWithRetry(url);
    if (!json.ok) {
      if (json.error === 'unauthorized') {
        showGate('Неверный пароль');
        return;
      }
      setStatus('Ошибка загрузки: ' + (json.message || json.error), true);
      return;
    }
    state.works = json.works || [];
    state.byWork = buildIndex(json.expenses || []);
    setStatus('');
    renderTable();
  } catch (e) {
    setStatus('Не удалось связаться с сервером. Проверьте интернет и обновите страницу.', true);
  }
}

function showGate(err) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pwErr').textContent = err || '';
  localStorage.removeItem('otdelka_token');
}

function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

document.getElementById('pwBtn').addEventListener('click', submitPassword);
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

function submitPassword() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  state.token = pw;
  localStorage.setItem('otdelka_token', pw);
  showApp();
  loadData();
}

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    if (state.works.length) renderTable();
  }, 150);
});

if (state.token) {
  showApp();
  loadData();
} else {
  showGate();
}
</script>
</body>
</html>
